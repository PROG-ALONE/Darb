<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الاستجابة</title>
<style>
  body{margin:0;font:14px/1.6 system-ui;background:#111;color:#eee}
  .wrap{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
  figure{margin:0;background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:6px}
  iframe{border:1px solid #555;background:#fff;display:block}
  figcaption{font-size:12px;color:#9ad;padding-top:4px}
  #out{white-space:pre-wrap;padding:10px;font-family:ui-monospace,monospace;font-size:12px;background:#001b00;color:#9f9;margin:10px}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div id="out">جارٍ الفحص…</div>
<script>
const SIZES = [[320,640],[360,740],[390,844],[414,896],[768,1024],[1024,768],[1366,900]];
const URL = 'index.html?ui-test=1';
const wrap = document.getElementById('wrap');
const results = [];
let loaded = 0;
SIZES.forEach(([w,h],i) => {
  const fig = document.createElement('figure');
  const f = document.createElement('iframe');
  f.width = w; f.height = h; f.src = URL;
  const cap = document.createElement('figcaption');
  cap.textContent = w + '×' + h;
  fig.append(f, cap); wrap.append(fig);
  f.addEventListener('load', () => {
    setTimeout(() => {
      const d = f.contentDocument, w2 = f.contentWindow;
      const de = d.documentElement, sc = d.scrollingElement;
      const vw = w2.innerWidth;
      const overflowX = Math.max(de.scrollWidth, sc ? sc.scrollWidth : 0) - vw;
      /* العناصر التي تتجاوز عرض الإطار */
      const bad = [];
      d.querySelectorAll('body *').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return;
        if (r.right > vw + 1.5 || r.left < -1.5) {
          const cs = w2.getComputedStyle(el);
          /* نتجاهل ما يمرّر داخليًا */
          let p = el.parentElement, scrolls = false;
          while (p && p !== d.body) { const pc = w2.getComputedStyle(p); if (pc.overflowX === 'auto' || pc.overflowX === 'scroll' || pc.overflowX === 'hidden') { scrolls = true; break; } p = p.parentElement; }
          if (!scrolls) bad.push((el.tagName + '.' + (el.className || '')).slice(0, 70) + ' → ' + Math.round(r.right));
        }
      });
      const uniq = [...new Set(bad)];
      results.push({ size: w + '×' + h, overflowX, fontSize: w2.getComputedStyle(d.body).fontSize, scrollH: sc ? sc.scrollHeight : 0, bad: uniq.slice(0, 8), badCount: uniq.length });
      if (++loaded === SIZES.length) report();
    }, 700);
  });
});
function report() {
  const lines = results.map(r =>
    r.size.padEnd(9) + ' | تجاوز أفقي: ' + String(r.overflowX).padStart(4) + 'px | خط: ' + r.fontSize.padStart(6) + ' | عناصر خارجة: ' + r.badCount + (r.bad.length ? '\n    · ' + r.bad.join('\n    · ') : '')
  );
  const bad = results.filter(r => r.overflowX > 1);
  document.getElementById('out').textContent =
    (bad.length ? '❌ يوجد تحرك أفقي في: ' + bad.map(r => r.size).join(', ') + '\n\n' : '✅ لا تحرك أفقي في أي مقاس\n\n') + lines.join('\n');
  window.__UI_RESULT__ = { fail: bad.map(r => r.size), lines };
}
</script>
</body>
</html>
