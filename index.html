.about-hero{background:var(--acc);color:var(--acc-ink);border:0}.about-hero *{color:inherit}.card.about-hero h2,.card.about-hero p{color:var(--acc-ink)}.about-hero h2{font-family:var(--deco);font-size:2.4em;margin:0}.about-tag{font-size:1.05em;line-height:1.9}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.about-grid div{background:color-mix(in srgb,var(--ink) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc-ink) 30%,transparent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.about-grid span{font-size:.78em}
.card.about-hero .muted,.card.about-hero .small,.card.about-hero a{color:inherit}
.about-steps{counter-reset:st;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}.about-steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:4px 10px;align-items:start}.about-steps li::before{content:counter(st,arabic-indic);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700}.about-steps span{color:var(--muted);font-size:.9em;line-height:1.8}
.about-foot{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

/* =================== شاشة الجهاز: سلوك التطبيق المثبّت ===================
   الهدف: عند التثبيت على الآيباد أو الهاتف يعمل كتطبيق — لا تحريك أفقي، ولا تكبير باللمس،
   ولا تمدّد يتجاوز عرض الشاشة، مع استجابة كاملة لكل المقاسات والأوضاع. */

/* ١) منع التحريك الأفقي وتمدّد الصفحة، ومنع تكبير النص تلقائيًا في iOS */
html,body{min-height:100%;height:auto;max-width:100%;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none;overflow-wrap:anywhere}
/* معامل الاستجابة: يُضرب في --fs (حجم الخط الذي يختاره الطالب من الإعدادات) */
body{font-size:calc(var(--fs) * var(--fsk,1))}
img,svg,video,canvas,iframe{max-width:100%}
img,video,canvas{height:auto}

/* ٢) لمس مريح + منع التكبير بالنقر المزدوج */
button,.btn,.tab,.icon-btn,.chip,.seg,.play-btn,summary,a{touch-action:manipulation}
summary{min-height:48px}
@media (pointer:coarse){
  .icon-btn{width:48px;height:48px}
  .tab{min-height:60px}
  .numpad button{min-height:52px}
  .chip{min-height:42px}
}

/* ٣) عناصر مرنة بلا حدّ أدنى — أكثر سبب للتحريك يمينًا ويسارًا */
.page>*,.card>*,.grid2>*,.grid4>*,.grid3>*,.row>*,.tabs>*,.metrics>*{min-width:0}
pre,code,.eq,.math{overflow-wrap:anywhere}

/* ٤) ما يحتاج تمريرًا يمرّر داخليًا فقط، ولا يدفع الصفحة */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain}
.tbl td .math.eq{white-space:normal}
.dchart,.shelf{overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.dchart{min-height:150px}

/* ٥) وضع التطبيق المثبّت: ارتفاع كامل واحترام المنطقة الآمنة */
@media (display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){
  #app{min-height:100vh;min-height:100dvh}
  .page{padding-block-end:max(132px,calc(104px + env(safe-area-inset-bottom,0px)))}
  .tabs{padding-block-end:calc(8px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(108px + env(safe-area-inset-bottom,0px))}
  .onb{padding-block-start:calc(30px + env(safe-area-inset-top,0px))}
}

/* ٦) الهاتف — عمودي */
@media (max-width:640px){
  :root{--fsk:.95}
  .page{padding-inline:14px;gap:12px;padding-block-end:max(126px,calc(100px + env(safe-area-inset-bottom,0px)))}
  .top{padding:12px 14px 8px;gap:8px}
  .top h1{font-size:1.3em}
  .card{padding:16px 14px;border-radius:16px;gap:10px}
  .grid2,.grid4{gap:10px}
  .grid4{grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr))}
  .glimpse,.grade-hero,.result-hero{padding:18px 16px;border-radius:18px}
  .result-hero b{font-size:2.3em}
  .about-grid{grid-template-columns:1fr}
  .about-hero h2{font-size:2em}
  .activity,.defcard,.guide{padding:14px 13px}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(min(100%,104px),1fr))}
  .tabs{padding-inline:4px}
  .tab{font-size:.72em}
  /* الجداول لا تنكمش: التفاف النص + تصغير الحشوة + تمرير أفقي سلس */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;overscroll-behavior-x:contain;display:block}
  .tbl{font-size:.82em}
  .tbl th,.tbl td{padding:7px 8px;word-break:normal;overflow-wrap:break-word;min-width:4.2em}
  .tbl td:first-child,.tbl th:first-child{min-width:3.2em}
  .tbl-wrap > .tbl{min-width:100%}
  .tbl-wrap{scrollbar-width:thin}
  /* منع انعكاس الأقواس في النصوص العربية RTL */
  [dir="rtl"]{unicode-bidi:plaintext}
  /* المعادلات لا تخرج عن الشاشة: تصغير الخط + التفاف النص */
  .eqbox,.law-f{font-size:.88em;word-break:break-word}
  .eqbox .math.eq,.law-f .math.eq{white-space:normal}
  .eqbox,.law-f{direction:ltr}
  .law-f.ar{direction:rtl}
  .law-f .math.eq{font-size:1.2em}
  /* املأ الفراغات: النص الرياضي من اليسار لليمين */
  .blank-math{direction:ltr;text-align:left;unicode-bidi:plaintext}
  .onb{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .onb-head{margin-bottom:12px}
  .onb-body.story{flex:1 0 auto;min-height:280px;padding:24px 18px;border-radius:24px;gap:18px}
  .onb-act{margin-top:12px}
  .onb-next{width:100%;min-height:54px}
}
@media (max-width:390px){
  :root{--fsk:.9}
  .page{padding-inline:12px}
  .card{padding:14px 12px}
  .numpad{gap:4px}
  .tab{font-size:.68em;min-height:52px}
  .tab svg{width:21px;height:21px}
  .icon-btn{width:42px;height:42px}
  .top h1{font-size:1.18em}
}
/* الهاتف — أفقي (شريط علوي صغير، محتوى أكثر) */
@media (orientation:landscape) and (max-height:560px){
  :root{--fsk:.92}
  .top{padding:8px 14px 6px}
  .top h1{font-size:1.15em}
  .page{gap:10px;padding-block:2px max(104px,calc(84px + env(safe-area-inset-bottom,0px)))}
  .tab{min-height:46px;font-size:.66em;gap:0}
  .tab svg{width:19px;height:19px}
  .card{padding:12px 14px;gap:8px}
  .numpad button{min-height:40px}
  .vbar{height:84px}
  .dchart{min-height:120px}
}
/* ٧) الآيباد والشاشات الكبيرة — عمودان حيث يفيد، ونص أكبر */
@media (min-width:700px) and (max-width:1023px){
  :root{--fsk:1.03}
  .page{max-width:960px;gap:18px}
  .top h1{font-size:1.7em}
  .about-grid{grid-template-columns:1fr 1fr}
}
@media (min-width:1024px){
  :root{--fsk:1.06}
  .page{max-width:1040px}
  .top{padding-block:18px 12px}
}
@media (min-width:1440px){
  :root{--fsk:1.1}
  .page{max-width:1120px}
}
/* ٨) شاشات عالية (iPad Pro مقاس 12.9) — لا نمدّد السطر أكثر من اللازم */
@media (min-width:1200px) and (pointer:coarse){:root{--fsk:1.08}}
/* ٩) تباين النص الباهت داخل الأزرار الملوّنة */
.btn .muted,.btn .small.muted,.seg .muted{color:color-mix(in srgb,var(--acc-ink) 82%,transparent)}
.btn.quiet .muted,.btn.ghost .muted,.btn.quiet,.btn.ghost{color:var(--muted)}
/* ١٠) نافذة عريضة (البنك، المكتبة، قيّمني، التطور الوزاري) */
.modal.wide{width:min(100%,980px)}
/* ١١) الشرح المتحرك: مشاهد متتابعة بحركة ناعمة */
/* رقم المعدّل الكبير في «تطوّرك الوزاري» (البند ٥٨) */
.minrec-num{flex-shrink:0;width:84px;text-align:center;font-family:var(--display);font-weight:900;font-size:2em;line-height:1;color:var(--acc);letter-spacing:-.02em}
.minrec-num i{font-style:normal;font-size:.5em;font-weight:800}
.minrec-num.ok{color:var(--ok)} .minrec-num.mid{color:#E0A800} .minrec-num.low{color:var(--bad)}
.mo{display:flex;flex-direction:column;gap:12px}
.mo-stage{position:relative;background:linear-gradient(160deg,var(--acc-soft),transparent 65%);border:1px solid var(--line);border-radius:18px;min-height:220px;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mo-bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;flex-shrink:0}
.mo-bar i{display:block;height:100%;background:var(--acc);border-radius:99px;animation-name:moBar;animation-timing-function:linear;animation-fill-mode:both}
@keyframes moBar{from{width:0}to{width:100%}}
.mo-cap{font-family:var(--display);font-weight:800;font-size:1.12em}
.mo-scene{animation:moIn .55s cubic-bezier(.2,.8,.3,1) both;overflow:auto;max-height:56vh;-webkit-overflow-scrolling:touch}
.mo-scene.mo-zoom{animation-name:moZoom}
@keyframes moIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes moZoom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.mo-ctrl{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.mo-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mo-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}
.mo-dots i.on{background:var(--acc);transform:scale(1.35)}
/* ١٢) قيّمني: أقواس نسب وأشرطة متدرجة */
.ev-gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.ev-arc{position:relative;width:190px;height:110px;overflow:hidden}
.ev-arc svg{width:190px;height:190px}
.ev-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px}
.ev-tiles .tile{padding:12px;border-radius:14px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:center}
.ev-tiles .tile b{font-size:1.5em;color:var(--acc);line-height:1.2}
.ev-tiles .tile span{font-size:.85em;color:var(--muted)}
.ev-arc .ev-num{position:absolute;inset-inline:0;bottom:0;text-align:center;font-family:var(--display);font-weight:800;font-size:2.3em;line-height:1}
.ev-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-row .bar{flex:1;min-width:90px}

/* ═══════════ الواجهة الجديدة — النمط «الهادئ» (افتراضي) ═══════════
   خلفية محايدة، بطاقات بيضاء بظل خفيف بدل الحدود الثقيلة، لون مميز واحد،
   قوائم بصفوف موحّدة، وشريط سفلي بأربعة تبويبات. */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#171A21; --muted:#5E6573; --line:#E4E6EB; --soft:#F0F1F4;
  --acc:#4552D8; --acc-ink:#FFFFFF; --acc-soft:#ECEEFC;
  --ok:#1F8A5B; --ok-soft:#E6F4EC; --bad:#C8402E; --bad-soft:#FCEDEA;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 8px 24px rgba(16,24,40,.08);
  --r:18px;
}
:root[data-skin="vivid"]{
  --bg:#F3F1FF; --card:#FFFFFF; --ink:#1B1640; --muted:#5B5680; --line:#E3DFFA; --soft:#EEEAFE;
  --acc:#6D3FF0; --acc-ink:#FFFFFF; --acc-soft:#EDE6FF; --ok:#13A26E; --ok-soft:#E2F7EE;
  --shadow:0 2px 6px rgba(80,50,200,.08); --shadow-lg:0 10px 30px rgba(80,50,200,.14); --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --shadow:none; --shadow-lg:0 8px 24px rgba(0,0,0,.35); } }
:root[data-theme="dark"],:root[data-skin="night"]{ --shadow:none; --shadow-lg:0 8px 24px rgba(0,0,0,.35); }

body{line-height:1.75}
.page{gap:18px;padding-block:6px 128px;max-width:760px}
.card{border:0;box-shadow:var(--shadow);border-radius:var(--r)}

/* الرأس */
.top{padding:14px max(16px,calc((100% - 728px) / 2)) 10px;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-t{flex:1;min-width:0;display:flex;flex-direction:column}
.top h1{font-size:1.45em;font-weight:800}
.top-sub{font-size:.8em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;width:44px;height:44px}

/* الشريط السفلي */
.tabs{left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));border:0;border-radius:22px;box-shadow:var(--shadow-lg);padding:6px;background:var(--card)}
.tab{min-height:56px;border-radius:16px;font-size:.78em;max-width:none;transition:background .15s,color .15s}
.tab[aria-current="page"]{background:var(--acc-soft);color:var(--acc)}

/* الأزرار */
.btn{border-radius:14px;min-height:50px;font-weight:700}
.btn.wide{width:100%}
.btn.ghost{border-width:1.5px}
.link{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:4px 2px;font-size:.88em}
.chip{min-height:40px;border:0;background:var(--soft);font-weight:600}
.chip.strong{background:var(--acc);color:var(--acc-ink)}

/* الأقسام والقوائم */
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:4px}
.sect-h h2{font-size:1.02em;font-weight:800}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list .pad{padding:14px 16px}
.row2{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 16px;border:0;background:transparent;text-align:right;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
.row2+.row2{border-top:1px solid var(--line)}
.row2:hover{background:var(--soft)}
.row2.static{cursor:default}.row2.static:hover{background:transparent}
.row2 .r-tx .bar{margin-top:6px}
a.row2{text-decoration:none}
.row2:active{background:var(--acc-soft)}
.r-ic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.r-ic svg{width:20px;height:20px}
.r-ic.done{--c:var(--ok);background:var(--ok-soft);color:var(--ok)}
.r-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--c);margin-inline:6px 4px}
.r-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.r-tx b{font-weight:700;font-size:.97em}
.r-tx small{color:var(--muted);font-size:.8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2.is-done .r-tx b{color:var(--muted)}
.r-end{flex-shrink:0;font-size:.82em;color:var(--muted);font-weight:600}
.r-chev{flex-shrink:0;color:var(--muted);opacity:.55;display:flex}
.r-chev svg{width:18px;height:18px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:.8em;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* البطاقة الرئيسية والحلقة */
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);padding:18px 20px}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-t h2{font-size:1.15em;font-weight:800}
.hero.me .hero-t h2{font-size:1.3em}
.eyebrow{font-size:.74em;font-weight:800;letter-spacing:.02em;color:var(--acc)}
.ring{position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:var(--soft)}
.ring-fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05em}

/* المسائل */
.pcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.pc-top b{font-size:1.5em;font-weight:800;color:var(--acc)}
.bar{height:8px;background:var(--soft)}
.bar>span{background:var(--acc)}

/* شريط الأسبوع */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit}
.wday .wd-n{font-size:.68em;color:var(--muted);font-weight:700}
.wday b{font-size:1.05em;line-height:1.2}
.wday .wd-c{font-size:.7em;color:var(--muted);font-weight:700}
.wday.today{outline:2px solid var(--acc);outline-offset:-2px}
.wday.sel{background:var(--acc);color:var(--acc-ink)}
.wday.sel .wd-n,.wday.sel .wd-c{color:var(--acc-ink);opacity:.85}
.wday.off{opacity:.45;cursor:default;box-shadow:none;background:transparent}

/* تنبيه واقتباس */
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--bad-soft);color:var(--bad);font-size:.9em;line-height:1.7}
.alert svg{width:20px;height:20px;flex-shrink:0;margin-top:3px}
.alert .link{color:var(--bad);text-decoration:underline}
.quote{padding:16px 18px;border-radius:var(--r);background:var(--soft);display:flex;flex-direction:column;gap:4px}
.quote .q{font-family:var(--display);font-weight:700;font-size:1.05em}

/* دروسي: بطاقات المواد */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r);border:0;background:var(--card);box-shadow:var(--shadow);text-align:right;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.scard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.scard b{font-size:1.02em}
.scard small{color:var(--muted);font-size:.78em}
.scard .bar{width:100%;margin-top:4px}
.scard.off{opacity:.55;cursor:default}
.sc-ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 13%,transparent)}
.sc-ic svg{width:22px;height:22px}

/* الاختبارات */
.segctl{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:16px;overflow-x:auto;scrollbar-width:none}
.page>.segctl:first-child{position:sticky;top:76px;z-index:4}
.segctl::-webkit-scrollbar{display:none}
.segctl button{flex:1;min-width:max-content;min-height:42px;padding:0 14px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:.88em;font-weight:700;color:var(--muted);cursor:pointer}
.segctl button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fold2{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.fold2-h{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 16px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:right}
.fold2-h b{flex:1}
.fold2.open .fold2-h .r-chev{transform:rotate(-90deg)}
.fold2 .list{box-shadow:none;border-radius:0;border-top:1px solid var(--line)}
.xcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.xc-h{display:flex;align-items:center;gap:8px}
.xc-h b{flex:1}
.xc-b{display:flex;flex-wrap:wrap;gap:8px}
.chip.subj{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 10%,var(--card));transition:transform .12s,background .12s}
.chip.subj:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--c) 20%,var(--card))}
.chip:disabled{opacity:.4;cursor:default}

/* أنا */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3>div{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:1.4em;font-weight:800}
.stats3 b small{font-size:.55em;color:var(--muted)}
.stats3 span{font-size:.78em;color:var(--muted)}

/* الرسم الشارح */
.xp-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);border:0;width:100%;text-align:right;cursor:pointer;font:inherit;color:var(--acc-ink);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#000));box-shadow:var(--shadow-lg)}
.xp-card .xp-ic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.xp-card .xp-ic svg{width:22px;height:22px;fill:currentColor}
.xp-card b{display:block;font-size:1.02em}
.xp-card small{opacity:.85;font-size:.8em}
.t-more{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.t-more>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;color:var(--muted);font-size:.9em}
.t-more>summary::-webkit-details-marker{display:none}
.t-more .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
@media (max-width:420px){ .hero{padding:14px} .tab{font-size:.72em} .segctl{top:70px} }

/* الرسم الشارح */
.xp-page{gap:12px}
.xp-stage{background:var(--card);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);padding:8px;overflow:hidden}
.xp-stage svg{display:block;width:100%;height:auto;max-height:58vh;direction:ltr}
.xp-say{display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border-radius:var(--r);padding:12px 14px;min-height:72px}
.xp-say p{font-size:1.02em;font-weight:600;line-height:1.75}
.xp-n{flex-shrink:0;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:2px 9px;font-size:.8em;font-weight:800;margin-top:3px}
.xp-read{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.xp-read:empty{display:none}
.xp-read span{background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.92em}
.xp-task{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-size:.9em}
.xp-task svg{width:20px;height:20px;flex-shrink:0;margin-top:3px}
.xp-ctl{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.xp-sl{display:flex;flex-direction:column;gap:4px;font-size:.9em}
.xp-sl span{display:flex;justify-content:space-between}
.xp-sl input{width:100%;accent-color:var(--acc);min-height:32px}
.xp-picks{display:flex;flex-wrap:wrap;gap:8px}
.xp-picks .chip{min-height:44px;min-width:44px;font-size:1.05em}
.xp-dots{display:flex;justify-content:center;gap:6px}
.xp-dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.xp-dots button.dn{background:color-mix(in srgb,var(--acc) 45%,transparent)}
.xp-dots button.on{background:var(--acc);width:24px;border-radius:6px}
.xp-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.fold3{border-top:1px solid var(--line)}
.fold3-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 16px 8px 14px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:right}
.fold3-h b{font-size:.92em}
.fold3-h small{flex:1;color:var(--muted);font-size:.8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold3.open>.fold3-h .r-chev{transform:rotate(-90deg)}
.fold3 .list{box-shadow:none;border-radius:0;background:var(--soft)}

/* لوحة ترتيب الأسبوع */
.dnd-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.dnd-day{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;transition:outline-color .15s,background .15s;outline:2px dashed transparent;outline-offset:-2px}
.dnd-day.over{outline-color:var(--acc);background:var(--acc-soft)}
.dnd-dh{display:flex;justify-content:space-between;align-items:baseline;font-size:.9em}
.dnd-drop{display:flex;flex-direction:column;gap:6px;min-height:54px}
.dnd-hint{font-size:.75em;color:var(--muted);text-align:center;padding:6px;border:1.5px dashed var(--line);border-radius:12px}
.dnd-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.dnd-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;background:var(--soft);border-inline-start:4px solid var(--c);cursor:grab;touch-action:pan-y;user-select:none;transition:transform .12s,box-shadow .12s}
.dnd-item:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.dnd-item[aria-pressed="true"]{outline:2px solid var(--acc);background:var(--acc-soft)}
.dnd-item.dragging{opacity:.35}
.dnd-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:var(--shadow-lg);background:var(--card)}
.dnd-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.dnd-t b{font-size:.86em}.dnd-t small{font-size:.74em;color:var(--muted)}
.dnd-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.85em;padding:4px}
.dnd-item.flow-in{animation:weekItemFlow .42s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--flow-index,0)*45ms)}
@keyframes weekItemFlow{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
.wp-add{width:100%;min-height:56px;border:1.5px dashed var(--acc);border-radius:16px;background:var(--acc-soft);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.wp-add svg{width:22px;height:22px}
.wp-modal-lead{margin:0 0 12px;color:var(--muted);font-size:.88em;line-height:1.7}
.wp-topics{display:flex;flex-direction:column;gap:8px}
.wp-topic-option,.wp-day-choice{width:100%;min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);text-align:right;font:inherit;cursor:pointer}
.wp-topic-option .r-dot{flex-shrink:0}
.wp-topic-option .wp-topic-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.wp-topic-option small{font-size:.78em;color:var(--muted)}
.wp-day-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.wp-day-choice{justify-content:space-between;text-align:right}
.wp-day-choice span{color:var(--muted);font-size:.78em}

.fold-tools{padding:0 16px 10px}

.qlist{display:flex;flex-direction:column;gap:8px;padding:10px 12px 14px;background:var(--soft)}

.r-ic.big{width:52px;height:52px;border-radius:16px}.r-ic.big svg{width:26px;height:26px}

.tgl i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.tgl input:checked+i{background:var(--acc)}
.tgl input:checked+i::after{inset-inline-start:21px}
.icon-btn.sm{width:36px;height:36px;box-shadow:none;background:var(--soft)}
.countgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,110px),1fr));gap:8px}
.cnt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;transition:transform .12s,background .12s}
.cnt:hover{transform:translateY(-2px);background:var(--acc-soft)}
.cnt b{font-size:1.3em;color:var(--acc)}.cnt small{font-size:.72em;color:var(--muted)}

.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.calbar b{font-size:1.1em;font-weight:800}
.icon-btn.mirror svg{transform:scaleX(-1)}
.calcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal2 .cw{font-size:.68em;color:var(--muted);text-align:center;font-weight:700}
.cd2{aspect-ratio:1;max-width:100%;border:0;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s;padding:0}
.cd2 b{font-size:.92em;line-height:1.1}.cd2 small{font-size:.6em;opacity:.85}
.cd2:hover:not(:disabled){transform:scale(1.06);box-shadow:var(--shadow)}
.cd2:disabled{opacity:.35;cursor:default}
.cd2.good{background:var(--ok);color:#fff}.cd2.mid{background:color-mix(in srgb,var(--acc) 55%,var(--soft));color:#fff}.cd2.weak{background:var(--bad);color:#fff}
.cd2.today{outline:2px solid var(--acc);outline-offset:1px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats4>div{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 6px;text-align:center;display:flex;flex-direction:column}
.stats4 b{font-size:1.2em;font-weight:800}.stats4 b small{font-size:.6em;color:var(--muted)}.stats4 span{font-size:.72em;color:var(--muted)}
@media (max-width:420px){.stats4{grid-template-columns:repeat(2,1fr)}}

.chartcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.mincurve2{display:flex;align-items:flex-end;gap:6px;height:140px}
.mincurve2 span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.mincurve2 i{width:100%;max-width:28px;border-radius:8px 8px 3px 3px;transition:height .5s}
.mincurve2 em{font-style:normal;font-size:.66em;color:var(--muted)}

/* ═══════════ طبقة توحيد الشاشات القديمة على النمط الجديد ═══════════ */
.pitem{border:0;box-shadow:var(--shadow);border-radius:var(--r);transition:transform .14s,box-shadow .14s,background .14s}
.pitem:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);border-color:transparent;background:var(--card)}
.pitem .st{border-radius:12px}
.plist{display:flex;flex-direction:column;gap:8px}
.stat{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.stat b{font-size:1.5em;font-weight:800}
.acc{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.acc-h{min-height:56px}
details.fold{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.chip{transition:background .14s,transform .12s}
.chip:hover:not(:disabled){transform:translateY(-1px)}
.segs{gap:6px}
.seg{border:0;background:var(--card);box-shadow:var(--shadow);font-weight:600;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.t-head{background:var(--card);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);padding:16px}
.t-head h2{font-size:1.3em}
.t-sec{background:var(--acc-soft)!important;color:var(--acc)!important;border:0!important}
.why{border:0;border-radius:var(--r);background:var(--gold-soft);box-shadow:none}
.lesson{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.lesson h3{font-weight:800}
.defcard,.law,.example,.prob{border:0;box-shadow:var(--shadow);border-radius:var(--r);transition:box-shadow .15s,transform .15s}
.defcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.example{border-inline-start:5px solid var(--ok)}
.law-f{border-radius:calc(var(--r) - 4px)}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:16px;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateX(-2px);border-color:var(--acc);background:var(--acc-soft)}
.opt .ol{background:var(--acc-soft);color:var(--acc)}
.answer{border-radius:var(--r)}
.result-hero{background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#000));border-radius:calc(var(--r) + 6px)}
.result-hero b{color:#fff}
.grade-hero{background:linear-gradient(140deg,color-mix(in srgb,var(--acc) 85%,#000),var(--acc));border-radius:calc(var(--r) + 6px)}
.subject{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.glimpse{border-radius:var(--r)}
.hint-purpose{border-style:solid;border-width:0;border-radius:var(--r)}
.strip{border-radius:var(--r)}
.empty{border:0;background:var(--card);box-shadow:var(--shadow)}
.note{line-height:1.7}
.input{border:1.5px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s}
.input:focus{border-color:var(--acc);outline:none}
.row{border-radius:14px;background:var(--soft)}
.dlegend i.good{background:var(--ok)}.dlegend i.mid{background:color-mix(in srgb,var(--acc) 55%,var(--soft))}.dlegend i.weak{background:var(--bad)}
/* النافذة الوسطية */
.modal-back{background:rgba(10,14,24,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{border-radius:26px;box-shadow:var(--shadow-lg);animation:popIn .22s cubic-bezier(.2,.9,.3,1.2) both}
.modal-h{background:transparent;border-bottom:1px solid var(--line)}
.modal-h::before{display:none}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
/* حركة لطيفة عند الدخول والمرور */
main.page>*{animation:rise2 .28s ease both}
main.page>*:nth-child(2){animation-delay:.03s}main.page>*:nth-child(3){animation-delay:.06s}main.page>*:nth-child(4){animation-delay:.09s}main.page>*:nth-child(5){animation-delay:.12s}
@keyframes rise2{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{transition:transform .12s,box-shadow .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 28%,transparent);filter:brightness(1.04)}
.btn:active:not(:disabled){transform:scale(.98)}
.row2:active,.scard:active,.wday:active,.cd2:active{transform:scale(.985)}
.tab{transition:background .15s,color .15s,transform .12s}.tab:active{transform:scale(.94)}
.icon-btn{transition:transform .12s,box-shadow .15s}.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ═══════════ الأنماط: كل نمط يغيّر الشكل كله لا الألوان وحدها ═══════════ */
/* حيوي: زوايا أكبر، بطاقات مواد ملوّنة بالكامل، عناوين عريضة، شريط سفلي ملوّن */
:root[data-skin="vivid"] .scard{background:var(--c);color:#fff}
:root[data-skin="vivid"] .scard small{color:rgba(255,255,255,.85)}
:root[data-skin="vivid"] .scard .sc-ic{background:rgba(255,255,255,.22);color:#fff}
:root[data-skin="vivid"] .scard .bar{background:rgba(255,255,255,.3)}:root[data-skin="vivid"] .scard .bar>span{background:#fff!important}
:root[data-skin="vivid"] .hero{background:linear-gradient(135deg,var(--acc),#C04FD8);color:#fff}
:root[data-skin="vivid"] .hero .muted,:root[data-skin="vivid"] .hero .eyebrow{color:rgba(255,255,255,.85)}
:root[data-skin="vivid"] .ring-bg{stroke:rgba(255,255,255,.25)}:root[data-skin="vivid"] .ring-fg{stroke:#fff}
:root[data-skin="vivid"] .tab[aria-current="page"]{background:var(--acc);color:#fff}
:root[data-skin="vivid"] .top h1,:root[data-skin="vivid"] .sect-h h2{font-weight:900}
:root[data-skin="vivid"] .r-ic{border-radius:50%}
:root[data-skin="ocean"] .top{background:#173B45;color:#F3FAFB}
:root[data-skin="ocean"] .top-sub{color:#C0D9DE}
:root[data-skin="ocean"] .tab[aria-current="page"]{border-block-end:3px solid var(--acc);border-radius:12px 12px 4px 4px}
:root[data-skin="ocean"] .hero{background:linear-gradient(120deg,#087E8B,#14566B);color:#fff}
:root[data-skin="ocean"] .hero .muted,:root[data-skin="ocean"] .hero .eyebrow{color:#E1F2F4}
:root[data-skin="sage"] .card,:root[data-skin="sage"] .scard{border:1px solid var(--line);box-shadow:none}
:root[data-skin="sage"] .sect-h{border-inline-start:4px solid var(--acc);padding-inline-start:10px}
:root[data-skin="sage"] .tab[aria-current="page"]{background:var(--acc-soft);color:var(--acc);border-radius:999px}
:root[data-skin="rose"] .top{border-block-end:1px solid var(--line)}
:root[data-skin="rose"] .hero{background:linear-gradient(135deg,#A54867,#CF7D83);color:#fff}
:root[data-skin="rose"] .hero .muted,:root[data-skin="rose"] .hero .eyebrow{color:#FFF0F2}
:root[data-skin="rose"] .tab[aria-current="page"]{background:var(--acc);color:#fff;border-radius:16px}
/* ورقي: كتاب مطبوع — خط زخرفي للعناوين، حدود رفيعة بلا ظلال، زوايا صغيرة، شريط سفلي كلاسيكي بعرض الشاشة */
:root[data-skin="paper"]{--r:6px;--shadow:none;--shadow-lg:none}
:root[data-skin="paper"] body{background-image:radial-gradient(rgba(122,79,18,.05) 1px,transparent 1px);background-size:4px 4px}
:root[data-skin="paper"] .top h1,:root[data-skin="paper"] .sect-h h2,:root[data-skin="paper"] .hero-t h2,:root[data-skin="paper"] .t-head h2{font-family:var(--deco);font-weight:700}
:root[data-skin="paper"] .list,:root[data-skin="paper"] .hero,:root[data-skin="paper"] .scard,:root[data-skin="paper"] .card,:root[data-skin="paper"] .fold2,:root[data-skin="paper"] .xcard,:root[data-skin="paper"] .stats3>div,:root[data-skin="paper"] .stats4>div,:root[data-skin="paper"] .pcard,:root[data-skin="paper"] .wday,:root[data-skin="paper"] .lesson,:root[data-skin="paper"] .t-head,:root[data-skin="paper"] .calcard,:root[data-skin="paper"] .chartcard,:root[data-skin="paper"] .bank-sum>div,:root[data-skin="paper"] .qcard,:root[data-skin="paper"] .dnd-day,:root[data-skin="paper"] .xp-stage,:root[data-skin="paper"] .xp-ctl,:root[data-skin="paper"] .cnt,:root[data-skin="paper"] .icon-btn,:root[data-skin="paper"] .defcard,:root[data-skin="paper"] .law,:root[data-skin="paper"] .example,:root[data-skin="paper"] .prob,:root[data-skin="paper"] .pitem,:root[data-skin="paper"] .stat{border:1px solid var(--line)}
:root[data-skin="paper"] .tabs{left:0;right:0;transform:none;bottom:0;width:auto;border-radius:0;border-top:2px solid var(--acc);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
:root[data-skin="paper"] .tab[aria-current="page"]{background:transparent;text-decoration:underline;text-underline-offset:6px}
:root[data-skin="paper"] .segctl button[aria-selected="true"]{border:1px solid var(--line)}
:root[data-skin="paper"] main.page>*{animation:none}
/* ليلي: داكن بلمسة ذهبية وتوهّج، شريط زجاجي */
:root[data-skin="night"]{--shadow:0 0 0 1px rgba(242,196,109,.08);--shadow-lg:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(242,196,109,.15)}
:root[data-skin="night"] .tabs{background:rgba(19,27,56,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root[data-skin="night"] .hero{background:radial-gradient(120% 140% at 100% 0,rgba(242,196,109,.18),var(--card) 60%)}
:root[data-skin="night"] .ring-fg{filter:drop-shadow(0 0 6px rgba(242,196,109,.6))}
:root[data-skin="night"] .btn:not(.quiet):not(.ghost){box-shadow:0 0 18px rgba(242,196,109,.25)}
/* مضغوط: مساحات أصغر لمن يريد رؤية أكثر في الشاشة */
:root[data-skin="compact"]{--r:12px}
:root[data-skin="compact"] .page{gap:10px}
:root[data-skin="compact"] .row2{min-height:48px;padding:6px 12px}
:root[data-skin="compact"] .r-ic{width:30px;height:30px;border-radius:9px}
:root[data-skin="compact"] .hero{padding:12px 14px}
:root[data-skin="compact"] .tab{min-height:48px}
:root[data-skin="compact"] .tabs{bottom:0;border-radius:16px 16px 0 0;width:100%}

.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.thm{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;border-radius:var(--r);border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;text-align:right;transition:transform .12s,border-color .12s}
.thm:hover{transform:translateY(-2px)}
.thm.on{border-color:var(--acc)}
.thm small{font-size:.74em;color:var(--muted);line-height:1.5}
.thm-prev{width:100%;height:64px;border-radius:12px;background:var(--b);display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px;border:1px solid rgba(0,0,0,.08)}
.thm-prev i{border-radius:7px;background:color-mix(in srgb,var(--a) 20%,#fff)}
.thm-prev i:first-child{grid-column:span 2;background:var(--a)}

.fieldrow{display:flex;gap:8px}.fieldrow .input{flex:1;min-width:0}
.codebox{min-height:84px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:.75em;resize:vertical;word-break:break-all}
details.lb>summary{list-style:none}details.lb>summary::-webkit-details-marker{display:none}
details.lb+details.lb{border-top:1px solid var(--line)}
.lb-rank{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.lb-rank.top1{background:#F2C46D;color:#4a3300}.lb-rank.top2{background:#C9D1DC;color:#2a3340}.lb-rank.top3{background:#E3A97A;color:#4a2400}
.lb-b{padding:4px 16px 14px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.lb-s .bar{display:block;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.lb-s .bar>span{display:block;height:100%;border-radius:9px}
.lb-s{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:8px;align-items:center;font-size:.85em}
:where(button:not(:disabled),a[href],summary,[role="button"]){transition:color .16s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease,filter .16s ease}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  :where(button:not(:disabled),a[href],summary,[role="button"]):hover{filter:brightness(1.035)}
  :where(input:not(:disabled),select:not(:disabled),textarea:not(:disabled)):hover{border-color:var(--acc)}
}
:where(button,a[href],summary,[role="button"],input,select,textarea):focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
:where(button:not(:disabled),a[href],summary,[role="button"]):active{filter:brightness(.97)}
</style>

/* ===== behaves like an installed app: block zoom + horizontal drift =====
   iOS في وضع التطبيق المثبّت يتجاهل user-scalable، فنمنع إيماءات التكبير مباشرة.
   على الحاسوب (فأرة) لا نمنع شيء: النص يبقى قابلًا للتحديد بالنقر المزدوج. */
(function () {
  const root = document.documentElement;
  const standalone = matchMedia('(display-mode:standalone)').matches || matchMedia('(display-mode:fullscreen)').matches;
  const touch = matchMedia('(pointer:coarse)').matches;
  root.classList.toggle('installed', standalone);
  const stop = e => { e.preventDefault(); };
  /* إيماءات قرص iOS (تكبير/تصغير بالإصبعين) */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, stop, { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) stop(e); }, { passive: false });
  if (touch || standalone) {
    document.addEventListener('dblclick', stop, { passive: false });
    let last = 0;
    document.addEventListener('touchend', e => {
      if (e.touches.length) return;
      const now = Date.now();
      if (now - last < 320) stop(e);   /* نقر مزدوج = تكبير في iOS */
      last = now;
    }, { passive: false });
  }
  /* أي انزلاق أفقي غير مقصود يُعاد إلى الصفر (سلوك التطبيقات) */
  let guard = 0;
  addEventListener('scroll', () => {
    if (root.scrollLeft > 0) root.scrollLeft = 0;
    const sc = document.scrollingElement;
    if (sc && sc.scrollLeft > 0 && ++guard < 6) sc.scrollLeft = 0;
  }, { passive: true });
  addEventListener('orientationchange', () => setTimeout(() => { scrollTo(0, 0); root.scrollLeft = 0; }, 120));
})();

function dayStats() {

  const t = today0();
  for (let i = 13; i >= 0; i--) {
    const d = isoD(new Date(t.getTime() - i * 864e5));
    let ok = 0, bad = 0, rev = 0, study = 0;
    Object.keys(solves || {}).forEach(k => { const v = solves[k]; if (!v || !v.started) return; if (isoD(new Date(v.started)) !== d) return; if (v.self === 'ok') ok++; else if (v.self === 'bad' || v.self === 'none') bad++; });

      attrs: !mN ? 'data-act="soon"' : starSt === 'lock' ? 'data-act="minLocked" data-s="' + esc(s) + '"' : 'data-act="openBank" data-s="' + esc(s) + '"' });
    map = '<section class="map-card"><div class="map-h"><div><span class="small muted">' + esc(g.name) + '</span><h2>مسار ' + esc(s) + '</h2></div>' + playBtn + '</div>' + pathMap(items, 's:' + key) + '</section>';
  }
  const hiddenAll = c ? c.chapters.flatMap(ch => ch.topics.filter(t => isHidden(t.id))) : [];
  return topBar(s, { back: true }) + '<main class="page">' +
    '<section class="card"><h2>لماذا تدرس ' + esc(s) + '؟</h2><p>' + esc(WHY[s] || '') + '</p></section>' +

}

function chMemoHTML(ts, subject) {
  const mt = ts.flatMap(t => memosOf(t).map((M, bi) => ({ t, M, bi }))).filter(x => x.M && x.M.units && x.M.units.length); if (!mt.length) return '';
  return '<section class="card"><h2>الحفظ في نهاية هذا الفصل</h2><p class="small muted">كل نص مقرّر للحفظ في هذا الفصل: قصائد وأبيات، وسور، وأحاديث، ومعاني الآيات. اختبار الحفظ يُجتاز بـ١٠٠٪ فقط، وأي خطأ يعيده من البداية.</p>' +
    mt.map(x => { const m = memoOf(x.t.id, x.bi), U = x.M.units, ok = U.filter((u, i) => m.ok[i]).length, isB = U.some(Array.isArray);
      return '<button class="pitem" data-act="memoGo" data-id="' + x.t.id + '" data-b="' + x.bi + '"><span class="st">' + (m.passed ? '✓' : ar(Math.round(ok / (U.length || 1) * 100)) + '٪') + '</span><span style="flex:1"><b>' + ft(x.M.title) + '</b><br><span class="small muted"><em class="memo-kind">' + esc(x.M.kind || 'حفظ') + '</em> | ' + ar(U.length) + (isB ? ' أبيات' : x.M.kind === 'معنى' ? ' مقطعًا' : ' آيات') + ' | ' + (m.passed ? 'اجتزت اختبار الحفظ' : 'احفظ ثم اختبر نفسك') + '</span></span></button>'; }).join('') + '</section>';
}
/* أسئلة البنك الوزاري التي تخص فصلًا بعينه: إما مربوطة بموضوعاته مباشرة (tid)
   أو مُحلّلة نصًّا إلى هذا الفصل (ch). الفصل المكتمل يفتح اختباره الوزاري */
function bankOfChapter(subject, chId) {
  const f = findChapter(chId); if (!f) return [];
  const title = f.ch.title;
  return ministerialPool(subject).filter(x => {
    if (x.tid) { const t = findTopic(x.tid); if (t && t.ch.id === chId) return true; }
    return !!(x.q && x.q.ch) && x.q.ch === title;
  });
}
/* بطاقة المسار الوزاري للفصل: امتحان الفصل أولًا، ثم الاختبار الوزاري بأسئلته */
function chapterMinisterialHTML(f, ch, pct, doneT, tsLen) {
  const subject = f.key.split(':')[2];
  const items = bankOfChapter(subject, ch.id);
  if (!items.length) return '';
  const withSol = items.filter(x => x.q.why && x.q.why.length > 8).length;
  const years = [...new Set(items.map(x => x.q.year).filter(Boolean))].sort();
  const studied = pct >= 60, complete = doneT === tsLen && tsLen > 0;
  const unlock = studied || complete;
  const lastBest = ministerialChapterBest(subject, ch.id);
  let h = '<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">' +
    '<h2>اختبار وزاري على هذا الفصل</h2><span class="muted small num">' + ar(items.length) + ' سؤال</span></div>' +
    '<p class="small muted">أسئلة الدورات الوزارية التي تخص ' + esc(ch.title.replace(/^الفصل [^:]+:\s*/, '').replace(/^الوحدة [^:]+:\s*/, '')) + ' وحدها — لا تخلط بفصول أخرى. كل سؤال بوقته المناسب ثم حلّه.</p>' +
    (years.length ? '<p class="small muted num">الدورات: ' + years.map(y => ar(y)).join(' | ') + '</p>' : '') +
    '<p class="small muted">' + ar(withSol) + ' سؤالًا منها بحل نموذجي.</p>';
  if (lastBest) h += '<p class="small" style="color:var(--ok);font-weight:600">أفضل نتيجة لك: ' + ar(lastBest) + '٪</p>';
  h += unlock
    ? '<button class="btn" style="width:100%" data-act="chMinExam" data-s="' + esc(subject) + '" data-id="' + esc(ch.id) + '">ابدأ الاختبار الوزاري على الفصل</button>'
    : '<p class="note">يُفتح الاختبار الوزاري حين تنهي الفصل: أكمل ' + ar(doneT) + ' من ' + ar(tsLen) + ' موضوعًا (٦٠٪ فأعلى).</p>' +
      '<button class="btn quiet" style="width:100%" disabled>أكمل الفصل أولًا</button>';
  return h + '</section>';
}
function ministerialChapterBest(subject, chId) {
  const st = me(); const arr = ((st.ministerial || {})[subject]) || [];
  const hit = arr.filter(x => x.chId === chId);
  return hit.length ? Math.max.apply(null, hit.map(x => x.pct)) : 0;
}

/* اختبار الفصل الشامل لا يُفتح إلّا بعد إتمام ما قبله: كل مواضيعه مُختبَرة وبلغت ٦٠٪ فأعلى.
   تُرجع سبب القفل، أو null إذا كان مفتوحًا. */
function chTestUnlocked(ts, ch) {
  const open = ts.filter(t => !isHidden(t.id));
  if (!open.length) return null;
  const left = open.filter(t => { const p = progOf(t.id); return !(p.quiz && p.quiz.at) || topicPct(t) < 60; });
  if (left.length === open.length) return 'لم تدرس أي موضوع في هذا الفصل بعد — ابدأ بدراسة المواضيع الـ' + ar(open.length) + ' ثم اختبرها';
  if (left.length) return 'بقيت ' + ar(left.length) + ' من ' + ar(open.length) + ' مواضيع لم تكتمل دراستها أو اختبارها';
  return null;
}

/* إحصاءات المراجعة على نمط wizarati: نسب وشرائح لا أرقام خام */
function revStats() {
  const items = revAll();
  const over = items.filter(x => revOver(x.r));
  const soon = items.filter(x => !revOver(x.r));
  const n = items.length || 1;
  const lv = items.map(x => Math.max(0, Math.min(100, x.t ? topicPct(x.t) : 0)));
  const avg = Math.round(lv.reduce((a, b) => a + b, 0) / (items.length || 1));
  const band = k => items.filter((x, i) => k === 'strong' ? lv[i] >= 90 : k === 'mid' ? lv[i] >= 70 && lv[i] < 90 : lv[i] < 70).length;
  const bySub = {};
  items.forEach(x => {
    const b = bySub[x.subject] = bySub[x.subject] || { all: 0, over: 0, sum: 0, strong: 0 };
    b.all++; if (revOver(x.r)) b.over++;
    b.sum += x.t ? topicPct(x.t) : 0;
    if (x.t && topicPct(x.t) >= 90) b.strong++;
  });
  const types = { probs: 0, und: 0, memo: 0, other: 0 };
  over.forEach(x => {
    if (memosOf(x.t).length) types.memo++;
    else if (x.t.problems && x.t.problems.length) types.probs++;
    else if (x.t.explain && x.t.explain.length) types.und++;
    else types.other++;
  });
  const st = me();
  const days = Math.max(1, Math.round((Date.now() - (st.started || Date.now())) / 864e5));
  const perDay = (st.log || []).filter(x => x.type === 'review').length / days;
  return { items, over, soon, avg, n, band, bySub, types, done: revTodayCount(), perDay: Math.round(perDay * 10) / 10, days };
}
function pctBar(label, val, cls) {
  return '<div class="srow"><span class="slab">' + label + '</span>' +
    '<span class="strack"><i class="' + (cls || '') + '" style="width:' + Math.max(2, Math.min(100, val)) + '%"></i></span>' +
    '<b class="sval num">' + ar(Math.round(val)) + '٪</b></div>';
}
function vReview() {
  const S2 = revStats();
  const { items, over, soon, avg } = S2;
  const total = items.length || 1;
  const overPct = Math.round(over.length / total * 100);
  const strong = S2.band('strong'), mid = S2.band('mid'), weak = S2.band('weak');

  let h = topBar('المراجعة', { log: 'review' }) + '<main class="page">' +
    '<div class="strip"><span>كل موضوع تدرسه يعود بعد يوم، ثم ثلاثة أيام، ثم أسبوع، ثم شهر — والتقييم هنا نِسَب لا أرقام.</span><b class="num">' + ar(over.length) + ' بسبب اليوم</b></div>';

  if (!items.length) {
    h += '<div class="empty">' + ico('review', 1.4) + '<b>ابدأ دراستك لتظهر المراجعة</b><p>كل موضوع تدرسه وتبدأ اختباره يدخل جدول المراجعة: يعود إليك بعد يوم، ثم ثلاثة أيام، ثم أسبوع، ثم شهر — مجزأً حسب المواد.</p><button class="btn" data-act="tab" data-v="path">اذهب إلى مساري</button></div>';
    return h + '</main>';
  }

  /* ١) لوحة النسب العامة */
  h += '<section class="card"><h2>صورتك الإحصائية</h2>' +
    '<p class="small muted">حالة كل ما في جدول مراجعتك الآن، موزّعة على ثلاث شرائح إتقان.</p>' +
    '<div class="sgrid">' +
      '<div class="stat"><span class="muted small">متوسط إتقانك</span><b class="num">' + ar(avg) + '٪</b></div>' +
      '<div class="stat"><span class="muted small">مستحقّ اليوم</span><b class="num">' + ar(overPct) + '٪</b></div>' +
      '<div class="stat"><span class="muted small">راجعت اليوم</span><b class="num">' + ar(S2.done) + '</b></div>' +
      '<div class="stat"><span class="muted small">معدّل المراجعة</span><b class="num">' + ar(S2.perDay) + '/يوم</b></div>' +
    '</div>' +
    '<div class="srows" style="margin-top:12px">' +
      pctBar('ماتقنه تمامًا (٩٠٪ فأعلى)', strong / total * 100, 'good') +
      pctBar('ما بقي على الطريق (٧٠–٨٩٪)', mid / total * 100, 'gold') +
      pctBar('يحتاج عودة (أقل من ٧٠٪)', weak / total * 100, 'bad') +
      pctBar('مستحقّ المراجعة الآن', overPct, 'acc') +

/* ————— سجلّي: تقويم بأيامه وإحصاء كل يوم على حدة ————— */
/* كل ما جرى في يوم واحد: المسائل ونتيجتها، والمراجعات والدروس، والاختبارات ونواتجها.
   نبني منه بطاقة اليوم كاملة بالتفاصيل، لا سطر «مراجعة» واحدًا كما كان. */
function dayFacts(d) {
  const st = me();
  const f = { d, ok: 0, bad: 0, rev: 0, study: 0, log: [], problems: [], exams: [], quizzes: [] };
  Object.keys(st.solves || {}).forEach(k => {
    const v = st.solves[k]; if (!v || !v.started) return; if (isoD(new Date(v.started)) !== d) return;
    if (v.self === 'ok') f.ok++; else if (v.self === 'bad' || v.self === 'none') f.bad++;
    f.problems.push({ k, v, info: findProblem(k) });
  });
  (st.log || []).forEach(x => { if (x.d !== d) return; f.log.push(x); if (x.type === 'review') f.rev++; if (x.type === 'study') f.study += x.sec || 0; });
  (st.exams || []).forEach(e => { if (isoD(new Date(e.at)) === d) f.exams.push(e); });
  Object.keys(st.progress || {}).forEach(tid => { const p = st.progress[tid]; if (p && p.quiz && p.quiz.at && isoD(new Date(p.quiz.at)) === d) f.quizzes.push({ tid, q: p.quiz }); });
  f.quizzes = f.quizzes.filter(x => !f.exams.some(e => e.src === 't:' + x.tid));
  f.probs = f.ok + f.bad;
  f.pct = f.probs ? Math.round(f.ok / f.probs * 100) : 0;
  f.items = f.probs + f.rev + f.exams.length + f.quizzes.length + (f.study ? 1 : 0);
  return f;
}
/* لون اليوم في التقويم: أخضر إنجاز، ذهبي متوسط، أحمر أخطاء أكثر، ورمادي بلا نشاط */
function dayLevel(f) {
  if (!f.items) return '';
  if (f.probs) return f.pct >= 80 ? 'good' : f.pct >= 50 ? 'mid' : 'weak';
  return (f.study >= 600 || f.exams.length) ? 'good' : 'mid';
}

  (st.exams || []).forEach(e => set.add(isoD(new Date(e.at))));

}

const mmss = s => { s = Math.max(0, Math.round(s)); return ar(String(Math.floor(s / 60)).padStart(2, '0')) + ':' + ar(String(s % 60).padStart(2, '0')); };

/* حالة حل المسألة: started (بدأ العد) ← revealed (ظهر الحل بعد المطابقة أو «لا أعرف») ← self (تقييم الطالب لحله) ← used/fx (الوقت وأثره) */
function solveOf(pid) { const st = me(); st.solves = st.solves || {}; return st.solves[pid] || null; }

/* أولوية وقت المسائل: المواد التي فيها مسائل لم تُحل تأتي أولًا، والأكثر مسائل متبقية قبل غيرها */
function problemQueue() {
  const st = me(), subs = subjectsOf(st.grade, st.branch), q = [];
  subs.forEach(s => {

    const all = allProblems(c), pending = all.filter(x => { const v = solveOf(x.p.id); return !v || v.self !== 'ok'; });

}

function aiParseJSON(txt) {
  if (!txt) return null;
  const s = String(txt).replace(/```json|```/g, '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const m = s.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return null;
}

async function aiRequest(imgDataUrl, f) {
  const a = aiPref();
  if (!a.key) throw new Error('لا يوجد مفتاح.');
  const prompt = aiPrompt(f);
  let res;
  if (a.provider === 'gemini') {
    const model = a.model || 'gemini-2.5-flash';
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(a.key);
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: imgDataUrl.split(',')[1] } }] }],
      generationConfig: { temperature: 0, response_mime_type: 'application/json' }
    }) });
    if (!res.ok) throw new Error('رفض المزوّد الطلب (' + res.status + '). تحقق من المفتاح والنموذج.');
    const j = await res.json();
    const parts = ((((j.candidates || [])[0] || {}).content || {}).parts) || [];
    const out = aiParseJSON(parts.map(p => p.text || '').join(''));
    if (!out) throw new Error('ردّ غير مفهوم من المزوّد.');
    return out;
  }
  const base = a.provider === 'openai' ? 'https://api.openai.com/v1'
    : a.provider === 'openrouter' ? 'https://openrouter.ai/api/v1'
    : String(a.base || '').replace(/\/+$/, '');
  if (!base) throw new Error('أدخل رابط الخدمة.');
  res = await fetch(base + '/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + a.key }, body: JSON.stringify({
    model: a.model || 'gpt-4o-mini', temperature: 0,
    messages: [{ role: 'user', content: [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: imgDataUrl } }] }]
  }) });
  if (!res.ok) throw new Error('رفض المزوّد الطلب (' + res.status + '). تحقق من المفتاح والنموذج.');
  const j = await res.json();
  const out = aiParseJSON((((j.choices || [])[0] || {}).message || {}).content);
  if (!out) throw new Error('ردّ غير مفهوم من المزوّد.');
  return out;
}

let SHUF = 0;
function shuffle(a, seed) { a = a.slice(); let s = seed || ((Date.now() + (++SHUF) * 7919 + Math.floor(Math.random() * 1e5)) % 233280); for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(src, n) {
  const pool = quizPool(src), pick = shuffle(pool).slice(0, n);
  S.quiz = { src, items: pick.map(x => ({ key: x.key, tid: x.tid, order: x.q.tf ? [0, 1] : shuffle(x.q.o.map((_, i) => i)) })), i: 0, picks: [] };

}
function quizQ(item) { const [tid, qi] = item.key.split(':'); return findTopic(tid).t.quiz[+qi]; }

function finishQuiz() {
  const z = S.quiz, ok = z.picks.filter((p, i) => p === quizQ(z.items[i]).c).length, pct = Math.round(ok / z.items.length * 100);
  if (z.src[0] === 't') { const p = progOf(z.src.slice(2)); p.quiz = { best: Math.max(pct, (p.quiz || {}).best || 0), last: pct, n: z.items.length, at: Date.now() }; revDone(z.src.slice(2), pct >= 70); }
  else { const st = me(); st.tests = st.tests || {}; const prev = st.tests[z.src] || {}; st.tests[z.src] = { best: Math.max(pct, prev.best || 0), last: pct, at: Date.now() }; }

/* =================== المراجعة: تكرار متباعد يعيد لك ما درسته =================== */
/* كل موضوع تدرسه يدخل جدول المراجعة: يعود بعد يوم، ثم ثلاثة أيام، ثم أسبوع، ثم شهر.
   جدول كل موضوع: { at: آخر دراسة/مراجعة, level: 0..3, done: عدد المراجعات }.
   تُزرع البذرة تلقائيًا من التقدم الحالي (نتائج اختبارات الموضوع) لتعمل المراجعة فورًا بما هو موجود. */
const REV_GAP = [1, 3, 7, 30];
const REV_DAYS = ['غدًا', 'بعد ٣ أيام', 'بعد أسبوع', 'بعد شهر'];
function revDue(r) { if (!r) return null; return r.at + REV_GAP[Math.min(r.level, REV_GAP.length - 1)] * 864e5; }
function revOver(r) { const d = revDue(r); return d != null && today0().getTime() >= d; }
function studiedTid(tid, t) {
  if (!t) return false;
  const st = me(), p = (st.progress || {})[tid];
  return !!(p && p.quiz && p.quiz.at) || topicPct(t) >= 60;
}
function getRev(tid) {
  const p = progOf(tid);
  if (!p.rev) p.rev = { at: (p.quiz && p.quiz.at) || Date.now(), level: 0, done: 0 };
  return p.rev;
}
function revDone(tid, ok) {
  const r = getRev(tid);
  r.level = ok ? Math.min(3, r.level + 1) : 0;
  r.at = Date.now(); r.done = (r.done || 0) + 1;
  const f = findTopic(tid), st = me(); st.log = st.log || [];
  st.log.push({ d: isoD(new Date()), subject: f ? f.subject : 'المراجعة', sec: 0, type: 'review', tid });
  if (st.log.length > 5000) st.log = st.log.slice(-5000);
  save();
}
function revAll() {
  const st = me(), out = []; let dirty = false;
  gradeContents(st.grade).forEach(y => y.c.chapters.forEach(ch => ch.topics.forEach(t => {
    if (isHidden(t.id)) return;
    if (!studiedTid(t.id, t)) return;
    const p = (st.progress || {})[t.id];
    if (!p.rev) { p.rev = { at: (p.quiz && p.quiz.at) || Date.now(), level: 0, done: 0 }; dirty = true; }
    out.push({ subject: y.subject, ch, t, r: p.rev, due: revDue(p.rev) });
  })));
  if (dirty) save();
  return out.sort((a, b) => a.due - b.due);
}
function revTodayCount() { const d = isoD(new Date()); return (me().log || []).filter(x => x.d === d && x.type === 'review').length; }
const tWord = n => n === 1 ? 'موضوع' : 'مواضيع';

/* اختبار «مما درسته فقط»: أسئلة المواضيع التي درستها وبدأت اختبارها، مع استثناء ما أخفيته */
function myStudyPool() {
  const st = me(), out = [];
  gradeContents(st.grade).forEach(y => y.c.chapters.forEach(ch => ch.topics.forEach(t => {
    if (!isHidden(t.id) && studiedTid(t.id, t)) t.quiz.forEach((q, i) => out.push({ q, tid: t.id, key: t.id + ':' + i }));
  })));

/* يُبقي تفصيل الأسئلة على آخر ٦٠ نتيجة فقط، ويُبقي الدرجات والتاريخ دائمًا */
function trimExamDetails(st) {
  const arr = st.exams || [], cut = arr.length - 60;
  arr.forEach((e, i) => { if (i < cut && e.ks) { delete e.ks; delete e.ok; delete e.times; delete e.kinds; } });
}
/* ٧-ب) سجل المادة: إحصاء كامل ثم تفصيل لكل امتحان سؤالًا بسؤال (صواب/خطأ/زمن/درجة) */
function testsRecordHTML(exams, subject) {
  if (!exams.length) return '<div class="empty">' + ico('tests', 1.3) + '<b>لا نتائج بعد</b><p>أنهِ أي اختبار فيظهر هنا بإحصائه وتفصيل أسئلته.</p></div>';
  const st = me();
  const withDetail = exams.filter(e => e.ks && e.ok);
  const n = exams.length;
  const avg = Math.round(exams.reduce((a, e) => a + e.pct, 0) / n);
  const best = Math.max.apply(null, exams.map(e => e.pct));
  const worst = Math.min.apply(null, exams.map(e => e.pct));
  const pass = exams.filter(e => e.pct >= 70).length;
  const totalQ = exams.reduce((a, e) => a + e.n, 0);
  let okQ = 0, detQ = 0, secQ = 0, secN = 0;
  withDetail.forEach(e => {
    e.ok.forEach(v => { detQ++; if (v === 1 || v === 2) okQ++; });
    (e.times || []).forEach(t => { if (t > 0) { secQ += t; secN++; } });
  });
  const acc = detQ ? Math.round(okQ / detQ * 100) : null;
  const perQ = secN ? Math.round(secQ / secN) : null;
  const band = (lo, hi) => exams.filter(e => e.pct >= lo && e.pct < hi).length;
  const dir = n >= 2 ? exams[0].pct - exams[n - 1].pct : 0;

  let h = '<div class="hint-purpose">' + ico('star', 1.6) +
    '<span><b>لماذا هذا السجل؟</b><br><span class="small">ليست الغاية الدرجة وحدها: هنا ترى ' +
    (acc != null ? 'دقة إجاباتك على مستوى السؤال (' + ar(acc) + '٪)، ' : '') +
    'وما بين الامتحانات، وأي أسئلة أخذت منك وقتًا أكثر، فتعرف أين تعيد المراجعة قبل ' + esc(subject || 'الامتحان القادم') + '.</span></span></div>';

  h += '<div class="sgrid" style="margin-top:10px">' +
    '<div class="stat"><span class="muted small">معدّل نتائجك</span><b class="num">' + ar(avg) + '٪</b></div>' +
    '<div class="stat"><span class="muted small">أفضل / أضعف نتيجة</span><b class="num">' + ar(best) + '٪ | ' + ar(worst) + '٪</b></div>' +
    '<div class="stat"><span class="muted small">نسبة نجاحك (٧٠٪+)</span><b class="num">' + ar(Math.round(pass / n * 100)) + '٪</b></div>' +
    '<div class="stat"><span class="muted small">عدد الأسئلة المحلولة</span><b class="num">' + ar(totalQ) + '</b></div>' +
    '</div>';

  h += '<div class="srows" style="margin-top:12px">' +
    pctBar('معدّل نتائجك', avg, avg >= 80 ? 'good' : avg >= 60 ? 'gold' : 'bad') +
    (acc != null ? pctBar('دقة إجاباتك سؤالًا بسؤال', acc, acc >= 85 ? 'good' : acc >= 65 ? 'gold' : 'bad') : '') +
    pctBar('نِسَبك من الاختبارات الناجحة', Math.round(pass / n * 100), pass / n >= .7 ? 'good' : 'gold') +
    pctBar('أسئلة أصابتها من كل ما حللته', detQ ? okQ / detQ * 100 : 0, 'acc') +
    '</div>';

  h += '<div class="srows" style="margin-top:12px">' +
    pctBar('درجات في ٩٠٪ فأعلى', n ? band(90, 101) / n * 100 : 0, 'good') +
    pctBar('درجات في ٧٠–٨٩٪', n ? band(70, 90) / n * 100 : 0, 'gold') +
    pctBar('درجات دون ٧٠٪', n ? band(0, 70) / n * 100 : 0, 'bad') +
    '</div>' +
    (n >= 2 ? '<p class="small muted" style="margin-top:8px">' + (dir > 5 ? 'اتجاهك صاعد: ' + ar(dir) + '٪ بين أول نتيجة وآخرها.' : dir < -5 ? 'اتجاهك هابط: ' + ar(-dir) + '٪ بين أول نتيجة وآخرها — أعد مراجعة مواضيع الأخطاء.' : 'نتائجك مستقرة: الفارق ' + ar(Math.abs(dir)) + '٪ فقط.') + '</p>' : '') +
    (perQ != null ? '<p class="small muted">معدّل زمنك في السؤال: ' + (perQ >= 60 ? fmtDur(perQ) : ar(perQ) + ' ثانية') + ' — هذا أنت، وهو ما يُرجَّح في حساب وقت امتحانك القادم.</p>' : '');

  /* تفصيل كل امتحان: شريط درجته ثم أسئلته صوابًا وخطأ وزمن كل سؤال */
  h += '<div class="plist" style="margin-top:10px">' + exams.map((e, xi) => {
    const det = e.ks && e.ok;
    const okN = det ? e.ok.filter(v => v === 1 || v === 2).length : Math.round(e.n * e.pct / 100);
    const wN = e.n - okN;
    const k = 'exdet-' + xi;
    let s2 = '<div class="acc"><div class="acc-h" data-act="acc" data-k="' + k + '">' +
      '<span class="acc-ico">▼</span>' +
      '<span class="acc-t"><b>' + esc(examLabel(e.src)) + '</b><br><span class="small muted num">' + fmtD(new Date(e.at)) +
      ' | ' + ar(e.n) + ' سؤالًا | ' + ar(okN) + ' صواب | ' + ar(wN) + ' خطأ' +
      (e.sec ? ' | ' + fmtDur(e.sec) : '') + '</span></span>' +
      '<span class="acc-s num ' + (e.pct >= 70 ? 'ok' : 'bad') + '" style="font-weight:700">' + ar(e.pct) + '٪</span></div>' +
      '<div class="acc-b"><div class="acc-b-in">' +
      '<div class="srows">' +
        pctBar('درجة هذا الامتحان', e.pct, e.pct >= 90 ? 'good' : e.pct >= 70 ? 'gold' : 'bad') +

      '</div>';
    if (det) {
      s2 += '<p class="small muted" style="margin-top:8px">كل سؤال — أخضر أصاب، وأحمر أخطأ، والمدة التي أخذه:</p>' +
        '<div class="qdet">' + e.ks.map((key, i) => {
          const v = e.ok[i], t = (e.times || [])[i] || 0;
          const f = key.indexOf(':') > 0 ? findTopic(key.split(':')[0]) : null;
          const name = f ? f.t.title : key;

          const word = v === 1 || v === 2 ? 'أصاب' : v === 3 ? 'جزئي' : 'أخطأ';
          return '<span class="qchip ' + cls + '" title="' + esc(name) + '">' +
            '<b>' + ar(i + 1) + '</b><i>' + (v === 1 || v === 2 ? '✓' : v === 3 ? '◐' : '✕') + '</i>' +
            '<em>' + (t ? (t >= 60 ? mmss(t) : ar(t) + 'ث') : '—') + '</em></span>';
        }).join('') + '</div>' +
        '<p class="small muted">أخطأت في ' + ar(wN) + ' من ' + ar(e.n) + ' — ' + (wN ? 'أعد هذه المواضيع قبل الجلسة التالية.' : 'لا شيء، واصِل.') + '</p>';
    } else {
      s2 += '<p class="small muted">هذا امتحان قديم حُفظت درجته فقط — تفاصيل أسئلته تُسجَّل في امتحاناتك الجديدة.</p>';
    }
    s2 += '<div class="grid2" style="margin-top:8px"><button class="btn ghost" data-act="retake" data-src="' + esc(e.src) + '" data-n="' + e.n + '">أعده</button>' +
      (e.src[0] === 'x' ? '<button class="btn ghost" data-act="examCfg" data-kind="' + esc(e.src.split(':')[2]) + '" data-s="' + esc(e.src.split(':')[1]) + '">اضبطه من جديد</button>' : '') + '</div>';
    return s2 + '</div></div></div>';
  }).join('') + '</div>';
  return h;
}
function examLabel(src) {
  if (src[0] === 't') { const f = findTopic(src.slice(2)); return f ? 'اختبار: ' + f.t.title : src; } /* نصّ خام: كل مستدعٍ يهرّبه (كان يُهرَّب مرتين فتظهر <bdi> حرفيًا) */
  if (src[0] === 'c') { const f = findChapter(src.slice(2)); return f ? 'اختبار ' + f.ch.title.split(':')[0] : src; }
  if (src[0] === 'x') { const p = src.split(':'); return (EXAM_KINDS[p[2]] || 'امتحان') + ' | ' + p[1]; }
  if (src === 'm') return 'اختبار سريع مما درسته';
  return src;
}

/* ٧-ز) سجل «تطوّرك الوزاري»: كل ما اختبرته في المادة (اختبارات المواضيع + الشهري + الوزاري)
   في سجل واحد إحصائي على نمط wizarati، مع تبويبات «التقييم اليومي/الشهري/الكلي»
   يتنبّأ فيه بمعدلك في الوزاري. */
function minRecordStats(subject) {
  const st = me();
  const y = subjEntry(subject);
  /* ١) اختبارات المواضيع: من st.progress */
  const quizzes = [];
  if (y) y.c.chapters.forEach(ch => ch.topics.forEach(t => {
    if (isHidden(t.id)) return;
    const p = (st.progress || {})[t.id]; if (!p || !p.quiz || !p.quiz.at) return;
    quizzes.push({ at: p.quiz.at, pct: p.quiz.best || 0, last: p.quiz.last || 0, title: t.title, ch: ch.title });
  }));
  /* ٢) الشهري: من st.exams */
  const monthlies = (st.exams || []).filter(e => e.src === 'x:' + subject + ':monthly');
  const quick = (st.exams || []).filter(e => e.src === 'x:' + subject + ':exam');
  /* ٣) الوزاري: من st.ministerial */
  const mins = ((st.ministerial || {})[subject] || []).slice();

  const avg = a => a.length ? Math.round(a.reduce((k, x) => k + x.pct, 0) / a.length) : null;
  const med = a => { if (!a.length) return null; const v = a.map(x => x.pct).sort((m, n) => m - n); return v[Math.floor(v.length / 2)]; };
  const lastN = (a, n) => a.slice().sort((m, n2) => m.at - n2.at).slice(-n);
  const dayStart = Date.now() - 864e5, monthStart = Date.now() - 30 * 864e5;
  const inRange = (a, from) => a.filter(x => x.at >= from);

  const quizzesAll = quizzes.map(q => ({ at: q.at, pct: q.pct }));
  const qAvg = avg(quizzesAll), mAvg = avg(monthlies), xAvg = avg(quick), nAvg = avg(mins);
  /* ٧-ز) توقّع معدلك الوزاري: أثقل للمواد الوزارية نفسها ثم للشهري ثم للمواضيع */
  const w = (nAvg != null ? 5 : 0) + (mAvg != null ? 3 : 0) + (qAvg != null ? 2 : 0);
  const predict = w ? Math.round(((nAvg || 0) * (nAvg != null ? 5 : 0) + (mAvg || 0) * (mAvg != null ? 3 : 0) + (qAvg || 0) * (qAvg != null ? 2 : 0)) / w) : null;
  const today = { q: inRange(quizzesAll, dayStart), m: inRange(monthlies, dayStart), x: inRange(quick, dayStart), n: inRange(mins, dayStart) };
  const month = { q: inRange(quizzesAll, monthStart), m: inRange(monthlies, monthStart), x: inRange(quick, monthStart), n: inRange(mins, monthStart) };
  return {
    subject, quizzes, monthlies, quick, mins, qAvg, mAvg, xAvg, nAvg, med: med(mins.concat(monthlies)),
    predict, lastQ: lastN(quizzesAll, 5), today, month,
    totalAll: quizzesAll.length + monthlies.length + quick.length + mins.length
  };
}
/* أشرطة مقارنة: قيم ثلاث (или أكثر) مع نسبها — نمط wizarati */

    row2({ act: 'testsLog', data: { s: subject }, ico: 'cal', title: 'السجل التفصيلي', sub: 'كل امتحان بأسئلته وزمنها' }) + '</div>';
  return h;
}
const avgP = a => a.length ? Math.round(a.reduce((k, x) => k + x.pct, 0) / a.length) : 0;
/* شاشة «تطوّرك الوزاري»: اختيار المادة ثم سجلّها الكامل */
function vMinrec() {
  const st = me(), subs = gradeContents(st.grade);
  const cur = S.minRecSubj && subs.some(y => y.subject === S.minRecSubj) ? S.minRecSubj : null;

      const s2 = minRecordStats(y.subject), pct = s2.predict != null ? s2.predict : s2.mAvg;
      return row2({ act: 'minRecSubj', data: { s: y.subject }, dot: scol(y.subject), title: esc(y.subject), sub: ar(s2.totalAll) + ' نتيجة | ' + ar(s2.mins.length) + ' جلسة وزارية | ' + ar(ministerialPool(y.subject).length) + ' سؤالًا في البنك', end: pct != null ? '<span class="pill ' + (pct >= 80 ? 'ok' : pct >= 60 ? '' : 'bad') + '">' + ar(pct) + '٪</span>' : '—' });
    }).join('') + '</div></main>';
  return topBar('تطوّري | ' + cur, { back: true, noTools: true }) + '<main class="page">' + minRecordHTML(cur, S.minRecTab || 'all') + '</main>';
}

/* ٧-ط) «المحاكاة الكاملة»: الوزاري الحقيقي ٥–٦ أسئلة فقط، تغطي المادة كلها،
   ومئتها موزّعة على المسائل والتعريفات والرسوم — لا ٥٠ سؤالًا متناثرًا.
   نبني الخطة من أنماط الأسئلة المستخرجة من الدورات (bankMeta.type). */
const SIM_PROB = /احسب|حساب|أعرب|أوصل|رتّب|صحّح|املأ|أجب|اختر|مسألة/;
const SIM_DRAW = /ارسم|رسمة|مجسم|شكل|خريطة|دائرة|مخطط/;
const SIM_DEF = /عرّف|تعريف|حدّد|بيّن|اذكر|علّل|اشرح|استنتج|قارن/;
const SCIENCE = /الرياضيات|الفيزياء|الكيمياء|الأحياء/;
/* فرّة السؤال: مسألة، أم تعريف، أم رسم — والسؤال العام يُصنَّف حسب المادة */
function simBucket(q, subject) {
  const t = (q && q.type || '').trim();
  if (SIM_DRAW.test(t)) return 'draw';
  if (SIM_PROB.test(t)) return 'prob';
  if (SIM_DEF.test(t)) return 'def';
  return SCIENCE.test(subject) ? 'prob' : 'def';
}
const SIM_LABEL = { prob: 'مسائل وحسابات', def: 'تعريفات وتعليلات', draw: 'رسوم ومجسمات', gen: 'أسئلة عامة' };
/* نقاط كل فرّة: المسائل أغلى، ثم الرسوم، ثم التعريفات — حتى تكتمل ١٠٠ */
const SIM_WEIGHT = { prob: 3, draw: 3, def: 2, gen: 2 };
function simPlan(subject) {
  const pool = ministerialPool(subject);
  if (!pool.length) return { n: 0, items: [], by: {}, total: 0, sec: 0 };
  const y = subjEntry(subject);
  const chs = y ? y.c.chapters.filter(ch => pool.some(x => qChId(x) === ch.id)) : [];
  /* ٥ أو ٦ أسئلة كما في الوزاري الحقيقي: منتصف عدد الفصول، محصورًا بينهما */
  const n = Math.max(5, Math.min(6, Math.ceil((chs.length || pool.length) / 2)));
  /* نوزّع الأسئلة على الفصول بالتناوب حتى تُغطى المادة كلّها لا فصلًا واحدًا */
  const byCh = {};
  pool.forEach(x => (byCh[qChId(x)] = byCh[qChId(x)] || []).push(x));
  const order = Object.keys(byCh).sort((a, b) => byCh[b].length - byCh[a].length);
  const picked = [];
  for (let round = 0; round < n && picked.length < n; round++) {
    for (let k = 0; k < order.length && picked.length < n; k++) {
      const arr = byCh[order[k]];
      const cand = arr.filter(x => picked.indexOf(x) < 0);
      if (!cand.length) continue;
      /* داخل الفصل ننوّع الفرّ: مسألة ثم تعريف ثم رسم إن وُجد */
      const want = ['prob', 'def', 'draw', 'prob', 'def', 'draw'][picked.length % 6];
      let x = cand.find(c => simBucket(c.q, subject) === want) || cand[round % cand.length];
      picked.push(x);
    }
  }
  /* توزيع ١٠٠ نقطة على ما اخترناه بحسب فرّته */
  const ws = picked.map(x => SIM_WEIGHT[simBucket(x.q, subject)] || 2);
  const wSum = ws.reduce((a, b) => a + b, 0) || 1;
  let left = 100;
  const pts = ws.map((w, i) => {
    const v = i === ws.length - 1 ? left : Math.max(5, Math.round(w / wSum * 100));
    left -= v; return v;
  });
  while (left > 0) { pts[0] += 1; left--; }
  while (left < 0) { const j = pts.indexOf(Math.max.apply(null, pts)); pts[j] -= 1; left++; }
  const by = {};
  picked.forEach((x, i) => {
    const b = simBucket(x.q, subject);
    by[b] = by[b] || { n: 0, pts: 0 };
    by[b].n++; by[b].pts += pts[i];
  });
  return {
    n: picked.length, items: picked.map((x, i) => ({ x, pts: pts[i], b: simBucket(x.q, subject) })),
    by, total: pts.reduce((a, b) => a + b, 0),
    sec: picked.reduce((a, x) => a + qSec(x.q, 'ministerial', x.tid), 0),
    chs: chs.length, bank: pool.length
  };
}
/* شاشة التحضير للمحاكاة الكاملة: تشرح الخطة (عدد الأسئلة وتوزيع المئات وزمنها) قبل البدء */
function vMinsim() {
  const subj = S.minsimSubj;
  if (!subj) return vMinPrep();
  const p = simPlan(subj);
  if (!p.n) return topBar('المحاكاة الكاملة', { back: true, noTools: true }) + '<main class="page">' + empty('library', 'لا بنك وزاري لهذه المادة بعد', 'حين يُبنى بنك الدورات تظهر هنا خطة المحاكاة الكاملة: ٥–٦ أسئلة تغطي المادة كلها، ومئتها موزّعة على المسائل والتعريفات والرسوم.') + '</main>';
  const h = topBar('المحاكاة الكاملة | ' + subj, { back: true, noTools: true }) + '<main class="page">' +
    '<section class="card"><h2>خطة المحاكاة كما في الوزاري الحقيقي</h2>' +
    '<p class="small muted">الوزاري الحقيقي خمسة أسئلة أو ستة فقط، لكنها تغطي المادة كلّها. هنا تُبنى من أنماط أسئلة الدورات المستخرجة: ' +
    ar(p.chs) + ' فصلًا في ' + ar(p.n) + ' أسئلة، والمئة نقطة موزّعة على المسائل والتعريفات والرسوم — لا أربعون سؤالًا متناثرًا.</p>' +
    '<div class="srows" style="margin-top:10px">' +
      Object.keys(p.by).map(b => pctBar(SIM_LABEL[b] || b + ' | ' + ar(p.by[b].n) + ' أسئلة', p.by[b].pts, b === 'prob' ? 'acc' : b === 'draw' ? 'gold' : 'good')).join('') +
      pctBar('المجموع', p.total, 'good') +
    '</div>' +
    '<div class="sgrid" style="margin-top:12px">' +
      '<div class="stat"><span class="muted small">عدد الأسئلة</span><b class="num">' + ar(p.n) + '</b></div>' +
      '<div class="stat"><span class="muted small">الزمن المحسوب</span><b class="num">' + fmtDur(p.sec) + '</b></div>' +
      '<div class="stat"><span class="muted small">معدّل السؤال</span><b class="num">' + ar(Math.round(p.sec / p.n)) + ' ث</b></div>' +
      '<div class="stat"><span class="muted small">بنك المادة</span><b class="num">' + ar(p.bank) + '</b></div></div>' +
    '<div class="hint-purpose" style="margin-top:12px">' + ico('star', 1.6) +
      '<span><b>لماذا هذه الخطة؟</b><br><span class="small">لأن الوزاري يقيس الفهم لا الحفظ: خمسة أسئلة كبيرة تغطي الفصول كلّها وتُوزَّع بالنقاط، فتتدرب على التفكير في سؤال طويل بدل الإجابة عن أربعين سؤالًا قصيرًا. زمن كل سؤال مشتقّ من صعوبته (كتاب ٣ دقائق، وزاري ٥) ومن زمنك الفعلي.</span></span></div>' +
    '<div class="chips" style="margin-top:12px">' + p.items.map((it, i) =>
      '<span class="chip" style="cursor:default"><b>' + ar(i + 1) + ' | ' + ar(it.pts) + ' ن</b> <span class="small muted">' + (SIM_LABEL[it.b] || '') + '</span></span>').join('') + '</div>' +
    '<div class="grid2" style="margin-top:12px">' +
      '<button class="btn" data-act="minsimStart"><b>ابدأ المحاكاة</b><span class="small muted">' + ar(p.n) + ' أسئلة | ' + fmtDur(p.sec) + '</span></button>' +
      '<button class="btn ghost" data-act="back">رجوع</button></div>' +
    '</section></main>';
  return h;
}

/* =================== الامتحانات لكل مادة: عندي امتحان، الشهري، التهيئة للوزاري =================== */

function selectExamQuestions(pool, n, problemMode) {
  const count = Math.min(Math.max(0, Math.floor(n || 0)), pool.length);
  if (!count) return [];
  const problemItems = pool.filter(x => examQuestionKind(x.q) === 'problem');
  const otherItems = pool.filter(x => examQuestionKind(x.q) !== 'problem');
  const targetProblems = problemMode === 'two' ? Math.min(2, count) : problemMode === 'half' ? Math.ceil(count / 2) : null;
  const taken = new Set(), picked = [];
  const takeBalanced = (items, limit) => {
    const groups = new Map();
    shuffle(items).forEach(x => {
      const key = qChId(x);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(x);
    });
    const buckets = [...groups.values()];
    let remaining = Math.min(limit, items.length);
    while (remaining > 0) {
      let added = false;
      for (const bucket of buckets) {
        while (bucket.length && taken.has(bucket[0].key)) bucket.shift();
        if (!bucket.length || remaining <= 0) continue;
        const item = bucket.shift();
        taken.add(item.key); picked.push(item); remaining--; added = true;
      }
      if (!added) break;
    }
  };
  if (targetProblems != null) {
    takeBalanced(problemItems, targetProblems);
    takeBalanced(otherItems, count - picked.length);

}

function examPaceSec(questionKind) {
  const samples = [];

    if (!e.kinds || !e.ok || !e.times) return;
    e.kinds.forEach((kind, i) => {
      const sec = e.times[i];
      if (kind === questionKind && (e.ok[i] === 1 || e.ok[i] === 2) && Number.isFinite(sec) && sec >= 15 && sec <= 1800) samples.push(sec);
    });
  });

  samples.sort((a, b) => a - b);

/* يقدّر الوقت من نوع السؤال وعدد مطالبه، ثم يتدرّج مع وسيط الإجابات الصحيحة المشابهة. */
function qSec(q, kind, tid) {
  const questionKind = examQuestionKind(q);
  const bases = {
    problem: [210, 300], diagram: [180, 240], explain: [150, 210],
    reason: [120, 180], definition: [75, 105], choice: [60, 90], other: [90, 135]
  };
  const base = (bases[questionKind] || bases.other)[kind === 'ministerial' ? 1 : 0];
  const text = String((q && q.q) || '');
  const partMarks = text.match(/(?:\([أ-دa-d1-4]\)|(?:^|\s)[أ-د][.)]|(?:^|\s)[a-d][.)])/gi) || [];
  const extraParts = Math.min(3, Math.max(0, partMarks.length - 1));
  const longTextSteps = Math.min(3, Math.max(0, Math.ceil((text.length - 180) / 140)));
  let sec = base * (1 + extraParts * 0.18 + longTextSteps * 0.08);
  const pace = examPaceSec(questionKind);
  if (pace != null) sec *= Math.max(0.75, Math.min(1.35, pace / base));
  if (kind === 'ministerial' && tid) {
    const f = findTopic(tid);
    if (f) {
      const pct = topicPct(f.t);

    }
