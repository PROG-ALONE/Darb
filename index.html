/* =================== خطة اليوم: توزيع المواضيع المتبقية على أيام الدراسة =================== */
/* تُدمج المواضيع المتبقية لكل مادة بالتناوب (مادة، مادة، مادة…) فلا تطغى مادة على غيرها،
   ولا يزيد نصاب اليوم على مادتين ثقيلتين، ثم تُقدَّم مراجعات اليوم المستحقة أولًا. */
function studyLine() {
  const st = me(), groups = [];
  gradeContents(st.grade).forEach(y => {
    const ts = [];
    y.c.chapters.forEach(ch => ch.topics.forEach(t => { if (!isHidden(t.id) && topicPct(t) < 90) ts.push({ subject: y.subject, ch, t }); }));
    if (ts.length) groups.push({ subject: y.subject, ts });
  });
  if (!groups.length) return [];
  groups.sort((a, b) => b.ts.length - a.ts.length);
  const line = [], total = groups.reduce((k, g) => k + g.ts.length, 0);
  for (let i = 0; line.length < total; i++) {
    const g = groups[i % groups.length];
    if (g.ts.length) line.push(g.ts.shift());
  }
  return line;
}
/* خطة اليوم = شريحة اليوم من خطة الأسبوع.
   كانت تُبنى من «خط الدراسة» فتعطي الفيزياء والكيمياء كل يوم وتؤجّل بقية المواد حتى تنتهيا.
   الآن: إن ملأ الطالب رفّ اليوم في «خطة الأسبوع» فهو خطته. وإلا تُوزَّع حصة الأسبوع
   (المتناسبة مع ما بقي في كل مادة) على أيام دراسته توزيعًا ثابتًا طوال الأسبوع،
   فيأخذ كل يوم موادّ مختلفة، ويُستكمل من الحصة إن أنهى رفّه مبكرًا. */
/* بداية الأسبوع الدراسي العراقي: السبت */
function weekStart0() { const t = today0(), d = new Date(t); d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); return d; }
function studyDayIndex(st) {
  /* ترتيب اليوم بين أيام دراسة الأسبوع الحالي (الأسبوع يبدأ من يوم بدء الدوام) */
  const t = today0(), wStart = weekStart0();
  let k = 0; const d = new Date(wStart);
  while (d < t) { if (!st.rest.includes(d.getDay()) && !inHoliday(d, st.holidays)) k++; d.setDate(d.getDate() + 1); }
  return k;
}
function autoWeek(st) {
  /* توزيع الأسبوع: «عشوائي» يخلط حصة الأسبوع ويوزعها بحيث لا تتكرر المادة في اليوم نفسه،
     و«يدوي» يأخذ ما سحبه الطالب بنفسه إلى كل يوم (st.weekFill). المسائل تتبع موضوعها دائمًا. */

    const f = st.weekFill && st.weekFill.wk === wk && Array.isArray(st.weekFill.days) && st.weekFill.days.length === n ? st.weekFill : (st.weekFill = { wk, days: Array.from({ length: n }, () => []) });
    return { wk, weekNo: g.weekNo, days: f.days, manual: true };
  }
  if (st.autoWeek && st.autoWeek.wk === wk && st.autoWeek.days && st.autoWeek.days.length === n && st.autoWeek.v === 2) return st.autoWeek;
  const L = shuffleSeeded(weeklyTopicList(st, 'manual'), parseD(wk).getTime() / 864e5 | 0).slice(0, n * g.perDay), days = Array.from({ length: n }, () => []), subjOf = id => findTopic(id).subject;
  L.forEach(x => {
    const id = x.t.id, sj = x.subject;
    let best = -1;
    for (let i = 0; i < n; i++) { const okS = days[i].length < g.perDay && !days[i].some(d => subjOf(d) === sj); if (okS && (best < 0 || days[i].length < days[best].length)) best = i; }
    if (best < 0) for (let i = 0; i < n; i++) if (days[i].length < g.perDay && (best < 0 || days[i].length < days[best].length)) best = i;

function dailyLessonGoal(st) { return Math.max(1, Math.min(4, Math.round((st.minutes || 120) / 40))); }
function planToday(extra) {

  if (extra) { const nx = line.map(x => x.t.id).find(id => !dp.ids.includes(id)); if (nx) { dp.ids.push(nx); save(); } }
  const picks = dp.ids.filter(ok).map(asItem);
  const reviews = revAll().filter(x => revOver(x.r) && !dp.ids.includes(x.t.id)).slice(0, 6);
  return { picks, reviews, left: line.length, total: line.length };
}
/* الهدف الأسبوعي: عدد المواضيع التي يجب تغطيتها أسبوعيًا لإنهاء المنهج قبل الامتحان */
function weeklyGoal() {
  /* مصدر واحد للهدف الأسبوعي (weeklyGoals) حتى لا تختلف الأرقام بين البطاقات */
  const st = me(), ti = timeInfo(st);
  if (!ti.daysLeft || !line_count()) return { perWeek: 0, total: 0, weeksLeft: 0, revWeeks: 0 };
  const g = weeklyGoals(st);
  return { perWeek: g.perWeek, total: g.left, weeksLeft: g.contentWeeks, revWeeks: g.revWeeks };
}
function line_count() { return studyLine().length; }
/* ── أهداف الأسبوع ──
   لا رقم مكتوب يتقدّم وحده: كل هدف يُقرأ من تقدّمك الفعلي (topicPct)، فينخفض كلما
   اجتزت اختبارًا أو أتقنت مسألة، ويعاد توزيعه على أسابيعك الباقية وحده.
   الطالب لا يُلقى به في مئة موضوع، بل في حصص معدودة يختار ترتيبها. */
function weeklyGoals(st) {
  const ti = timeInfo(st);
  const studyDays = Math.max(1, 7 - (st.rest || []).length);
  const perDay = dailyLessonGoal(st);
  const weeksLeft = Math.max(1, ti.weeksLeft || Math.ceil((ti.daysLeft || 7) / 7));
  const subjects = [];
  let left = 0, total = 0;
  gradeContents(st.grade).forEach(y => {
    const c = y.c; if (!c) return;
    const topics = [];
    c.chapters.forEach(ch => ch.topics.forEach(t => { if (!isHidden(t.id)) topics.push({ t, ch, subject: y.subject }); }));
    const done = topics.filter(x => topicPct(x.t) >= 90).length;
    const lft = topics.length - done;
    total += topics.length; left += lft;
    subjects.push({ subject: y.subject, total: topics.length, done, left: lft, topics });
  });
  /* ننهي المنهج قبل الامتحان بأسابيع مراجعة (حتى ٤ أسابيع) لا في ليلته: محاكاة السنة كشفت
     أن التوزيع على كل الأسابيع يُنهي آخر موضوع قبل الامتحان بيوم بلا وقت للمراجعة الشاملة */
  const revWeeks = Math.min(4, Math.floor(weeksLeft / 5));
  const contentWeeks = Math.max(1, weeksLeft - revWeeks);
  const perWeek = Math.ceil(left / contentWeeks);
  const sum = subjects.reduce((a, s) => a + s.left, 0) || 1;
  subjects.forEach(s => { s.perWeek = s.left ? Math.max(1, Math.round(perWeek * s.left / sum)) : 0; });
  return { weeksLeft, revWeeks, contentWeeks, studyDays, perDay, sessionsPerWeek: studyDays * perDay, perWeek, left, total, subjects, weekNo: ti.weekNo };
}
/* مواضيع الحصة القادمة: تُوزَّع بالتناوب بين المواد حسب ما بقي في كل واحدة، فلا تُهمَّل
   مادة كاملة، ثم تُخلط في الوضع العشوائي وتبقى على ترتيب المنهج في اليدوي */
function weeklyTopicList(st, mode) {
  const g = weeklyGoals(st);
  const buckets = g.subjects.filter(s => s.left > 0)
    .map(s => ({ items: s.topics.filter(x => topicPct(x.t) < 90), share: s.left }));
  if (!buckets.length) return [];
  const need = Math.max(1, g.perWeek);
  const sum = buckets.reduce((a, b) => a + b.share, 0) || 1;
  const target = buckets.map(b => Math.max(1, Math.round(need * b.share / sum)));
  const at = buckets.map(() => 0), out = [];
  let guard = 0;
  while (out.length < need && guard++ < need * 4) {
    let moved = false;
    for (let i = 0; i < buckets.length && out.length < need; i++) {
      if (at[i] < target[i] && buckets[i].items[at[i]]) { out.push(buckets[i].items[at[i]]); at[i]++; moved = true; }
    }
    if (!moved) {
      let bi = 0;
      for (let i = 1; i < buckets.length; i++) if (at[i] - target[i] > at[bi] - target[bi]) bi = i;
      if (buckets[bi].items[at[bi]]) { out.push(buckets[bi].items[at[bi]]); at[bi]++; moved = true; }
    }
    if (!moved) break;
  }
  return mode === 'random' ? shuffleSeeded(out, g.weekNo) : out;
}
/* خلط ثابت ببذرة الأسبوع: لو خُلط في كل رسمة لاختلط ترتيب الطالب كلما عاد للشاشة */
function shuffleSeeded(arr, seed) {
  const a = arr.slice();
  let s = (seed * 9301 + 49297) % 233280 || 7;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = s % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
/* ── توزيع الأسبوع على أيام الدراسة ──
   «عدد الأيام المختارة من الإعدادات» = أيامك غير الراحة. كل يوم له رفوف فارغة
   بقدر مواضيعه، والطالب يملؤها من الخطة المقسّمة أمامه — لا نظام يفرض عليه ترتيبًا. */
function studyDaysCount(st) { return Math.max(1, 7 - (st.rest || []).length); }
function planDates(st, n) {
  const out = [], d = today0();
  while (out.length < n && out.length < 40) {
    if (!st.rest.includes(d.getDay()) && !inHoliday(d, st.holidays)) out.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function weekFill(st) {
  const g = weeklyGoals(st), n = studyDaysCount(st);
  const f = st.weekFill;
  if (!f || f.weekNo !== g.weekNo || !Array.isArray(f.days)) {
    st.weekFill = { order: (f && f.order) || null, weekNo: g.weekNo, days: Array.from({ length: n }, () => []) };
  }
  else if (f.days.length !== n) f.days = Array.from({ length: n }, (_, i) => f.days[i] || []);
  return st.weekFill;
}
function weekFillUsed(f) { return f.days.reduce((a, d) => a + d.length, 0); }
function weekFillAssign(st, tid) {
  const f = weekFill(st);
  if (f.days.some(d => d.includes(tid))) return false;
  const perDay = weeklyGoals(st).perDay;
  const target = f.days.find(d => d.length < perDay);
  if (!target) return false;
  target.push(tid); save(); return true;
}
function addStudyDay(st) {
  const dates = weekDates(st), t0 = today0();
  const target = dates.find(x => !x.study && x.d >= t0 && st.rest.includes(x.d.getDay()));
  if (!target) return false;
  const wk = isoD(weekStart0()), pos = dates.filter(x => x.study && x.d < target.d).length;
  const manual = st.weekFill;
  const automatic = st.autoWeek;
  st.rest = st.rest.filter(d => d !== target.d.getDay());
  if (manual && Array.isArray(manual.days)) manual.days.splice(Math.min(pos, manual.days.length), 0, []);
  if (automatic && automatic.wk === wk && Array.isArray(automatic.days)) {
    automatic.days.splice(Math.min(pos, automatic.days.length), 0, []);
    automatic.weekNo = weeklyGoals(st).weekNo;
  }
  st.dayPlan = null;
  save();
  return true;
}
/* ── خطة الأسبوع: ترتيب ← عدد أيامك ← رفوف فارغة يملؤها الطالب ──
   الخطوة الأولى ترتيب الحصة (عشوائي أو بيدك)، فإذا اخترت رأيت أيام دراستك كما في
   الإعدادات، ولكل يوم رفوفٌ فارغة، ومن الخطة المقسّمة أمامك تملأها — ولا تُملأ إلا بيدك. */
function weeklyPlanHTML(st) {
  const g = weeklyGoals(st);
  if (!g.total) return '';
  const f = weekFill(st), mode = f.order || null;

  let h = '<div class="hp"><div class="hp-row">' +
    '<button class="btn' + (mode === 'random' ? '' : ' quiet') + '" data-act="weekOrder" data-m="random"' +
      ' data-hint="يخلط ترتيب مواضيع الحصة بالطريقة نفسها لكل أسبوع، حتى لا تدرس دائمًا بالمهج نفسه. التوزيع على أيامك يبقى كما هو — يتغير ترتيب المادة داخل اليوم لا عدد ما تُنجزه.">' +
      (mode === 'random' ? ico('check', 2.4) : '') + '<b>عشوائي</b></button>' +
    '<button class="btn' + (mode === 'manual' ? '' : ' quiet') + '" data-act="weekOrder" data-m="manual"' +

        }).join('') + '</div>'

  /* ── أيام الدراسة: رفوف فارغة بانتظارك ── */
  const perDay = g.perDay, used = weekFillUsed(f), need = Math.min(list.length, f.days.length * perDay);
  h += '<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">' +
    '<h3 style="margin:0">رفوف أيامك</h3>' +

    '<p class="small muted">عدد أيامك هنا هو ما حددته في الإعدادات: ' + ar(g.studyDays) + ' أيام دراسة أسبوعيًا — تُحسب بطرح أيام الراحة.</p>' +
    (used ? '<div class="chips" style="margin:10px 0"><button class="chip" data-act="weekFillClear">أفرِغ الأيام</button></div>' : '') +
    '<div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">';

  f.days.forEach((slots, di) => {
    const d = days[di];
    h += '<div class="pday"><div class="pday-h"><b>اليوم ' + ar(di + 1) + '</b><span class="muted num">' + (d ? DAYS[d.getDay()] + ' ' + fmtD(d) : '') + '</span></div>';

  if (used) h += '<button class="btn" style="width:100%;margin-top:8px" data-act="weekStart">ابدأ الحصة</button>';
  else h += '<p class="note">املأ رفًّا واحدًا على الأقل لتبدأ حصة اليوم.</p>';
  h += '</section>';
  return h;
}

/* صور الحلول الورقية تُحفظ في IndexedDB لأنها أكبر من سعة localStorage */
const MEDIA = {
  p: null,
  open() { return this.p || (this.p = new Promise((res, rej) => { try { const r = indexedDB.open('study-app-media', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); },
  async tx(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('photos', mode), st = t.objectStore('photos'), r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  get(k) { return this.tx('readonly', s => s.get(k)).catch(() => null); },
  del(k) { return this.tx('readwrite', s => s.delete(k)).catch(() => null); }
};
const photoKey = pid => me().id + ':' + pid;
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const m = 1400, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ملفات: في المعاينة على claude.ai تمر عبر قدرة التنزيل، وفي التطبيق المنشور تنزيل عادي */
async function saveFile(name, data, mime) {
  try {

/* يجمع مواضيع النطاق: درس، تبويب، فصل، مادة، صف، كامل */

  const fromC = (gid, subject, c) => c.chapters.forEach(ch => ch.topics.forEach(t => push(gid, subject, ch, t)));
  if (x.lvl === 'topic' || x.lvl === 'tab') { const f = findTopic(x.tid); if (f) push(st.grade, x.subject, f.ch, f.t); }
  else if (x.lvl === 'chapter') { const f = findChapter(x.ch); if (f) f.ch.topics.forEach(t => push(st.grade, x.subject, f.ch, t)); }
  else if (x.lvl === 'subject') { const c = contentOf(st.grade, x.subject); if (c) fromC(st.grade, x.subject, c); }
  else if (x.lvl === 'grade') gradeContents(st.grade).forEach(y => fromC(y.gid, y.subject, y.c));

  if (x.lvl === 'chapter') { const f = findChapter(x.ch); return f ? x.subject + ' | ' + f.ch.title : ''; }

/* =================== الأشكال =================== */
/* ══════════════════════════════════════════════════════════════════════
   الرسم التفاعلي (النقطة ٨)
   ──────────────────────────────────────────────────────────────────────
   الرسم ليس صورةً تُنظر إليها ويُمرَّ عليها. هنا:
     | تكبير وتصغير (أزرار + عجلة الفأرة) وسحب للتحريك داخل الإطار.
     | نقاط مرقّمة فوق أجزاء الرسم — اضغط أيًّا منها فيشرح نفسه.
     | «ماذا يعلّمك هذا الرسم؟» — غاية الرسم التعليمية صراحةً.
     | «كيف ترسمه بنفسك؟» — يبنيه أمامك خطوةً خطوة، فيتعلّم
       الطالب بناء الرسم لا حفظ شكله.
     | ملء الشاشة للكبير منه والتقريب الدقيق.
   ══════════════════════════════════════════════════════════════════════ */
function figVBox(svg) { const m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg || ''); return m ? { w: +m[1], h: +m[2] } : { w: 320, h: 200 }; }
function figSt(k) { const S2 = S; if (!S2.figs[k]) S2.figs[k] = { z: 1, x: 0, y: 0, step: 0, part: -1 }; return S2.figs[k]; }
/* --fz يبقى مع التكبير حتى تستطيع النقاط أن تُحجَم بمعكوسه فلا تتضخّم مع الرسم */
/* قيمة transform وحدها — تُستعمل أيضًا في style.transform مباشرة */
function figT(z, x, y) { return 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')'; }
/* قائمة كاملة للخاصية style=""، وتحمل --fz حتى تُحجَم النقاط بمعكوس التكبير */
function figTDecl(z, x, y) { return 'transform:' + figT(z, x, y) + ';--fz:' + z + ';'; }
function figApply(k) {
  const L = document.querySelector('[data-figlayer="' + k + '"]');
  if (!L) return false;
  const st = figSt(k);
  L.style.transform = figT(st.z, st.x, st.y);
  L.style.setProperty('--fz', st.z);
  /* داخل الموضوع: تُمنع لمس السحب فقط بعد التكبير، وإلّا يبقى تمرير الصفحة طبيعيًّا */
  const vp = L.closest('.fig-vp');
  if (vp && !vp.dataset.figvp) vp.style.touchAction = st.z > 1 ? 'none' : '';
  return true;
}

/* النقاط المرقّمة فوق الأجزاء — موقعها نسبةً من مقياس الـsvg نفسه */
function figHotspots(k) {
  const f = FIGS[k]; if (!f || !f.parts || !f.parts.length) return '';
  const vb = figVBox(f.svg), st = figSt(k);
  return f.parts.map((p, i) => {
    if (typeof p.x !== 'number' || typeof p.y !== 'number') return '';
    const L = (p.x / vb.w * 100).toFixed(2), T = (p.y / vb.h * 100).toFixed(2);
    return '<button class="fhot' + (st.part === i ? ' on' : '') + '" data-act="figPart" data-k="' + k + '" data-i="' + i + '" ' +
      'style="left:' + L + '%;top:' + T + '%" aria-label="' + esc(p.label) + '">' + ar(i + 1) + '</button>';
  }).join('');
}

/* لوحة شرح الجزء المختار: ماذا يُعلّم هذا الجزء تحديدًا */
function figExplHTML(k) {

  return '<div class="fig-expl"><b><i class="fnum">' + ar(st.part + 1) + '</i> ' + esc(p.label) + '</b><p>' + esc(p.note) + '</p>' +
    '<button class="chip sm" data-act="figPart" data-k="' + k + '" data-i="-1">إغلاق الشرح ✕</button></div>';
}

/* «كيف ترسمه بنفسك؟» — نبني الرسم أمامه خطوةً خطوة.
   تعليمات الخطوات تُقتطع من الـsvg (تبدأ برقم ثم قوس) وتُعرض تحته كتعليق،
   وإلا تراكمت التعليمات فوق بعضها في كل خطوة. */
const FIG_SAY_RE = /<text[^>]*>\s*[٠-٩0-9]+\)[\s\S]*?<\/text>/g;
function figStrip(say) { return String(say || '').replace(FIG_SAY_RE, ''); }
function figSay(step) { const m = String(step || '').match(FIG_SAY_RE); return m ? m[m.length - 1].replace(/^<text[^>]*>|<\/text>$/g, '') : ''; }
function figDrawHTML(k) {
  const f = FIGS[k]; if (!f || !f.steps || !f.steps.length) return '';
  const st = figSt(k), vb = figVBox(f.svg);
  if (f.static) return '<div class="fig-draw"><div class="fig-stepview"><svg viewBox="0 0 ' + vb.w + ' ' + vb.h + '" role="img" aria-label="' + esc(f.title) + '">' + (window.FIG_DEFS || '') + figStrip(f.svg.replace(/^<svg[^>]*>|<\/svg>$/g, '')) + '</svg></div><p class="fig-say"><b>رسم توضيحي خاص بموضوع: ' + esc(f.title) + '</b></p></div>';
  const n = f.steps.length, at = Math.max(0, Math.min(st.step, n - 1));
  let draw = '';
  for (let i = 0; i <= at; i++) draw += figStrip(f.steps[i]);
  const say = figSay(f.steps[at]) || ('الخطوة ' + ar(at + 1));
  return '<div class="fig-draw">' +
    '<div class="fig-stepper">' +

/* أرقام النقاط التفاعلية كانت تُوضع فوق مركز التسمية فتغطي النص.
   بعد الرسم نقيس صناديق نصوص SVG فعليًا، ونزيح كل رقم يتقاطع مع نص
   أو مع رقم آخر إلى أقرب موضع حرّ حوله (يفضّل الأعلى) داخل حدود الرسم. */
function figPlaceHots(layer) {
  const svg = layer.querySelector('svg'); const hots = [...layer.querySelectorAll('.fhot')];
  if (!svg || !hots.length) return true;
  const R = svg.getBoundingClientRect(); if (!R.width || !R.height) return false;
  const z = parseFloat(getComputedStyle(layer).getPropertyValue('--fz')) || 1;
  const sx = R.width / z, sy = R.height / z;          /* الأبعاد قبل التكبير */
  const obst = [];
  svg.querySelectorAll('text').forEach(t => {
    if (!t.textContent.trim()) return;
    const b = t.getBoundingClientRect(); if (!b.width) return;
    obst.push({ l: (b.left - R.left) / z - 2, t: (b.top - R.top) / z - 2, r: (b.right - R.left) / z + 2, b: (b.bottom - R.top) / z + 2 });
  });
  const rad = 15, placed = [];
  const hit = (x, y) => obst.some(o => x + rad > o.l && x - rad < o.r && y + rad > o.t && y - rad < o.b) ||
    placed.some(p => Math.hypot(p.x - x, p.y - y) < rad * 2 + 2);
  const inside = (x, y) => x >= rad && x <= sx - rad && y >= rad && y <= sy - rad;
  hots.forEach(h => {
    const ox = parseFloat(h.style.left) / 100 * sx, oy = parseFloat(h.style.top) / 100 * sy;
    let best = { x: ox, y: oy };
    if (hit(ox, oy) || !inside(ox, oy)) {
      let found = null;
      for (let d = 12; d <= 110 && !found; d += 6) {
        for (let a = 0; a < 16 && !found; a++) {
          const ang = -Math.PI / 2 + (a % 2 ? 1 : -1) * Math.ceil(a / 2) * Math.PI / 8;
          const x = ox + d * Math.cos(ang), y = oy + d * Math.sin(ang);
          if (inside(x, y) && !hit(x, y)) found = { x, y };
        }
      }
      if (found) best = found;
    }
    placed.push(best);
    h.style.left = (best.x / sx * 100).toFixed(2) + '%'; h.style.top = (best.y / sy * 100).toFixed(2) + '%';
  });
  return true;
}
function figPlaceAll() {
  document.querySelectorAll('.fig-layer').forEach(l => { if (!l.dataset.placed) { try { if (figPlaceHots(l)) l.dataset.placed = '1'; } catch (e) { } } });
}
/* التثبيت بعد كل رسم: العجلة للتكبير، والسحب للتحريك (لا يُعاد إلا على الجديد) */
function mountFigs() {
  document.querySelectorAll('.fig-vp').forEach(el => {
    if (el.dataset.m) return; el.dataset.m = '1';
    const k = el.querySelector('[data-figlayer]').dataset.figlayer;
    const layer = () => el.querySelector('[data-figlayer]');
    const apply = () => figApply(k);
    /* العجلة تكبّر داخل الشاشة الكاملة فقط، حتى لا تخطف تمرير الصفحة في الموضوع */
    if (el.dataset.figvp) el.addEventListener('wheel', e => { e.preventDefault(); const st = figSt(k); st.z = Math.max(1, Math.min(6, st.z * (e.deltaY < 0 ? 1.15 : 0.87))); if (st.z === 1) { st.x = st.y = 0; } apply(); }, { passive: false });
    let drag = null;
    el.addEventListener('pointerdown', e => { const st = figSt(k); if (st.z <= 1) return; drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y }; try { el.setPointerCapture(e.pointerId); } catch (er) { } });
    el.addEventListener('pointermove', e => { if (!drag) return; const st = figSt(k); st.x = drag.ox + (e.clientX - drag.x); st.y = drag.oy + (e.clientY - drag.y); apply(); });
    const end = () => { drag = null; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('pointerleave', end);
  });

}

/* =================== عنصر قابل للمطابقة الرقمية (مسألة أو مثال محلول) =================== */
function findItem(id) {

    const e = (f.t.examples || [])[+em[2]];
    if (!e) return null;
    const steps = e.steps || [];
    const sec = suggestSec(steps);
    return { id: s, kind: 'example', ans: e.ans, steps, text: e.text, subject: f.key.split(':')[2], t: f.t, ch: f.ch, sec, e, title: e.title };
  }

  return { id: s, kind: 'problem', ans: f.p.ans, steps: f.p.steps || [], text: f.p.text, subject: f.subject, t: f.t, ch: f.ch, sec, p: f.p, title: f.p.ref || '' };
}

/* أرقام الجواب النهائي: نوحّدها لأرقام لاتينية، ونمسك الرقم المميّز لإخفائه في الخطوات */
const AR2LAT = '٠١٢٣٤٥٦٧٨٩';
const toLat = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => AR2LAT.indexOf(d)).replace(/[×✕]/g, 'x');
function numTokens(ans) { return (toLat(ans).match(/-?\d+(?:[.\/]\d+)?/g) || []); }
function maskTokens(ans) {
  const toks = numTokens(ans), strong = toks.filter(x => /[.\/]/.test(x) || x.replace(/-/g, '').length >= 3);
  if (strong.length) return strong;
  return toks.length === 1 ? toks : [];
}
function hasFinalNumber(ans) { return maskTokens(ans).length > 0; }
const DIGC = { '0': '[0٠]', '1': '[1١]', '2': '[2٢]', '3': '[3٣]', '4': '[4٤]', '5': '[5٥]', '6': '[6٦]', '7': '[7٧]', '8': '[8٨]', '9': '[9٩]' };
function tokRegex(tok) {
  let r = '';
  for (const ch of tok) {
    if (DIGC[ch]) r += DIGC[ch];
    else if (ch === '.') r += '[.٫]';
    else if (ch === '/') r += '[\\/⁄]';
    else if (ch === '-') r += '[-−]';
    else r += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  return new RegExp(r, 'g');
}
function maskStep(s, ans) {
  let html = fm(String(s == null ? '' : s));
  maskTokens(ans).sort((a, b) => b.length - a.length).forEach(tok => { html = html.replace(tokRegex(tok), '<span class="masked">؟</span>'); });
  return html;
}
function suggestSec(steps) { const n = (steps || []).length; return Math.max(90, Math.min(600, n ? n * 45 : 90)); }

/* مقارنة الإجابة: توحيد عربي/لاتيني + تطابق حرفي + هامش رقمي ±٢٪ + كسور مكافئة */
function parseNum(s) {
  const t = toLat(s).replace(/[−–—]/g, '-').replace(/٫/g, '.');
  let m = t.match(/-?\d+\s*\/\s*\d+/);
  if (m) { const [p, q] = m[0].split('/').map(x => parseFloat(x)); if (q) return p / q; }
  m = t.match(/-?\d+(?:\.\d+)?/);
  if (!m) return null;
  let val = parseFloat(m[0]);
  const sm = t.match(/x\s*10\s*\^?\s*(-?\d+)/);
  if (sm) val = val * Math.pow(10, parseInt(sm[1], 10));
  return val;
}
function answerValues(exp) {
  const t = toLat(exp).replace(/[−–—]/g, '-').replace(/٫/g, '.');
  const tail = t.includes('=') ? t.slice(t.lastIndexOf('=') + 1) : t;
  const grab = str => {
    const vals = [];
    (str.match(/-?\d+\s*\/\s*\d+/g) || []).forEach(f => { const [p, q] = f.split('/').map(x => parseFloat(x)); if (q) vals.push(p / q); });
    (str.match(/-?\d+(?:\.\d+)?/g) || []).forEach(x => vals.push(parseFloat(x)));
    return vals;
  };
  let vals = grab(tail);
  if (!vals.length) vals = grab(t);
  return vals;
}
const ANSWER_UNITS = [
  ['متر', 'متر'], ['سم', 'سم'], ['ثانية', 'ثانية'], ['كجم', 'كجم'], ['°', '°'],
  ['Ω', 'Ω'], ['فولت', 'فولت'], ['أمبير', 'أمبير'], ['كولوم (C)', 'C'],
  ['ميكروكولوم (μC)', 'μC'], ['نانوكولوم (nC)', 'nC'], ['فاراد (F)', 'F'],
  ['ميكروفاراد (μF)', 'μF'], ['نانوفاراد (nF)', 'nF'], ['بيكوفاراد (pF)', 'pF'],
  ['جول', 'جول'], ['نيوتن', 'نيوتن'], ['هرتز (Hz)', 'Hz'], ['واط (W)', 'W'],
  ['م/ث', 'م/ث'], ['م/ث²', 'م/ث²']
];
function answerUnit(value) {
  const text = String(value || '').trim().replace(/[),.;،؛]+$/, '').replace(/µ/g, 'μ');
  const units = ANSWER_UNITS.map(x => x[1]).sort((a, b) => b.length - a.length);
  return units.find(u => {
    const unit = u.replace(/µ/g, 'μ');
    return text.endsWith(unit) && (text.length === unit.length || /[\s\d]/.test(text[text.length - unit.length - 1]));
  }) || '';
}
function answerMatches(ans, unit, expected) {
  const exp = String(expected == null ? '' : expected);
  const expectedUnit = answerUnit(exp), selectedUnit = unit && unit !== 'بدون' ? answerUnit('1 ' + unit) : '';
  if (selectedUnit && expectedUnit && selectedUnit !== expectedUnit) return false;
  const cands = [String(ans || ''), unit && unit !== 'بدون' ? String(ans) + ' ' + unit : ''].filter(Boolean);
  if (cands.some(c => normA(c) === normA(exp))) return true;
  const want = answerValues(exp);
  if (want.length) {
    for (const c of cands) {
      const a = parseNum(c);
      if (a == null) continue;
      for (const b of want) {
        const tol = Math.max(Math.abs(b) * 0.02, 0.005);
        if (Math.abs(a - b) <= tol) return true;
      }
    }
  }
  return false;
}

/* أثر الوقت على الهدف: يحدّث سرعة الطالب وموعد إتمام المنهج المتوقع */

  const base = Math.max(1, Math.ceil(total / Math.max(1, Math.ceil(ti.daysLeft / 7))));
  const pf = Math.max(0.35, Math.min(2.5, paceFactor(st)));
  const perWeek = Math.max(1, Math.round(base / pf));

}

/* =================== الشرح المتحرك ===================
   مشاهد مبنية تلقائيًا من محتوى الموضوع نفسه (لماذا ندرسه ← فقرات الشرح ←
   القوانين ← التعريفات ← مثال الكتاب ← خلاصة)، كل مشهد يظهر بحركة ناعمة
   وتقدّم تلقائي يمكن إيقافه، مع السابق/التالي/الإعادة والنقاط. */
function motionScenes(t) {
  const sc = [];
  const E = t.explain || [];
  const durOf = s => Math.max(3200, Math.min(11000, 2600 + String(s).replace(/<[^>]+>/g, '').length * 55));
  sc.push({ cap: 'لماذا ندرسه؟', html: '<p>' + fm(t.why || 'هذا الموضوع من مقرّرات منهجك.') + '</p>', dur: 5200 });
  let buf = '', bufRaw = '';
  const flush = () => { if (buf) { sc.push({ html: buf, dur: durOf(bufRaw), anim: 'moIn' }); buf = ''; bufRaw = ''; } };
  E.forEach((b, i) => {
    const key = t.id + '-mo' + i;
    if (b.t === 'h') { flush(); buf += '<h3>' + fm(b.x) + '</h3>'; bufRaw += b.x; return; }
    if (b.t === 'fig') { flush(); sc.push({ cap: 'رسم تفاعلي', html: figHTML(b.k, b.cap || '', false), dur: 9500, anim: 'moZoom' }); return; }
    if (b.t === 'sim') { flush(); sc.push({ cap: 'محاكاة تفاعلية', html: blockHTML(b, key), dur: 9500, anim: 'moZoom' }); return; }
    if (b.t === 'table' || b.t === 'poem' || b.t === 'activity' || b.t === 'list') { flush(); sc.push({ html: blockHTML(b, key), dur: 9000, anim: 'moIn' }); return; }
    buf += blockHTML(b, key);
    bufRaw += typeof b.x === 'string' ? b.x : (b.q || '');
    if (bufRaw.length > 380) flush();
  });
  flush();
  if (t.laws && t.laws.length) sc.push({ cap: 'القوانين', html: lawsHTML(t), dur: 11000, anim: 'moIn' });
  if (t.defs && t.defs.length) sc.push({ cap: 'التعريفات', html: defsHTML(t), dur: 10000, anim: 'moIn' });
  if (t.examples && t.examples.length) {
    const e = t.examples[0];
    sc.push({ cap: 'مثال الكتاب', html: '<section class="example"><div class="ex-h"><b>' + esc(e.title || 'مثال') + '</b>' + (e.page ? '<span class="small muted">ص' + ar(e.page) + '</span>' : '') + '</div><p class="prob-text">' + fm(e.text || '') + '</p>' + solutionContentHTML(e.steps || []) + (e.ans ? '<p class="ex-ans"><b>الجواب النهائي:</b> ' + fm(e.ans) + '</p>' : '') + '</section>', dur: 12000, anim: 'moIn' });
  }
  const keys = E.filter(b => b.t === 'key').map(b => b.x);
  sc.push({ cap: 'خلاصة', html: (keys.length ? keys.map(k => '<div class="keybox">' + fm(k) + '</div>').join('') : '<p>شاهد المشاهد، ثم افتح «أمثلة الكتاب» و«المسائل» لتثبيت الفهم بالتطبيق.</p>'), dur: 6500, anim: 'moIn' });
  return sc;
}
function openMotion(id) {
  const f = findTopic(id); if (!f) return;
  const scenes = motionScenes(f.t);
  if (!scenes.length) { toast('لا محتوى شرح في هذا الموضوع بعد.'); return; }
  S.mo = { scenes, i: 0, playing: true, acc: 0, start: Date.now(), timer: null };
  showPopup('شرح متحرك: ' + f.t.title, () => motionHTML(), true);
  moSchedule();

function moElapsed() {
  const M = S.mo; if (!M) return 0;

  const M = S.mo; if (!M) return;

/* =================== قيّمني ===================
   شاشة تفاعلية تحسب كل دليل تراكم منذ أول يوم: دروس مُنجَزة، اختبارات فصول،
   اختبارات مواضيع، نتائج وزارية، مسائل محلولة، أيام مواظبة — ثم تقدّر معدّلك
   المتوقّع مقابل هدفك وتقترح وتيرة الأيام المتبقية ونقاط التركيز. */
function evalSubjects() {
  const st = me();
  return gradeContents(st.grade).map(y => {
    let tot = 0, done = 0, qSum = 0, qN = 0, tSum = 0, tN = 0;
    const rows = [];
    y.c.chapters.forEach(ch => {
      const tb = (st.tests || {})['c:' + ch.id];
      if (tb && tb.best) { tSum += tb.best; tN++; }
      ch.topics.forEach(t => {
        if (isHidden(t.id)) return;
        tot++;
        const p = topicPct(t);
        if (p >= 90) done++;
        const q = progOf(t.id).quiz;
        if (q && q.best) { qSum += q.best; qN++; }
        rows.push({ t, ch, score: Math.max(p, (q && q.best) || 0) });
      });
    });
    const cov = tot ? done / tot : 0;
    const quizAvg = qN ? qSum / qN : null;
    const testAvg = tN ? tSum / tN : null;
    const mAvg = ministerialAvg(y.subject) > 0 ? ministerialAvg(y.subject) : null;
    /* المتوقع = متوسط الأدلة المتاحة × (٠٫٦ + ٠٫٤ × التغطية): درستَ كثيرًا ونجوتَ → أقرب للحقيقة */
    const evid = [quizAvg, testAvg, mAvg].filter(x => x != null);
    const ev = evid.length ? evid.reduce((a, b) => a + b, 0) / evid.length : null;
    const pred = ev != null ? Math.round(ev * (0.6 + 0.4 * cov)) : Math.round(85 * cov); /* بلا أي دليل: التوقع من التغطية وحدها (يبدأ من صفر لا من ٤٠ وهمية) */
    rows.sort((a, b) => a.score - b.score);
    return { subject: y.subject, tot, done, cov, quizAvg, testAvg, mAvg, pred, weak: rows.filter(r => r.score < 90).slice(0, 3) };
  }).filter(s => s.tot);
}
function evalStats() {

function wpAssign(tid, k, renderAfter) {

  aw.days.forEach(d => { const i = d.indexOf(tid); if (i >= 0) d.splice(i, 1); });

  return true;
}

(function () {
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const it = e.target.closest('.dnd-item'); if (!it || e.pointerType === 'touch' || e.target.closest('.dnd-x') || S.view !== 'weekplan') return;
    drag = { tid: it.dataset.tid, x: e.clientX, y: e.clientY, el: it, ghost: null, moved: false };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    if (!drag.moved) { drag.moved = true; const g = drag.el.cloneNode(true); g.classList.add('dnd-ghost'); g.style.width = drag.el.offsetWidth + 'px'; document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('dragging'); }
    e.preventDefault();
    drag.ghost.style.transform = 'translate(' + (e.clientX - drag.el.offsetWidth / 2) + 'px,' + (e.clientY - 24) + 'px)';
    /* تمرير تلقائي قرب حافتي الشاشة حتى تصل الأيام البعيدة */
    drag.vy = e.clientY < 110 ? -14 : e.clientY > innerHeight - 140 ? 14 : 0; drag.cx = e.clientX; drag.cy = e.clientY;
    if (!drag.tm) drag.tm = setInterval(() => { if (drag && drag.vy) { const sc = [document.scrollingElement, document.body, document.getElementById('app')].find(x => x && x.scrollHeight > x.clientHeight + 4 && /(auto|scroll)/.test(getComputedStyle(x).overflowY)) || document.scrollingElement; sc.scrollTop += drag.vy; } }, 30);
    document.querySelectorAll('.dnd-day.over').forEach(d => d.classList.remove('over'));
    const under = document.elementFromPoint(e.clientX, e.clientY), day = under && under.closest('.dnd-day'); if (day) day.classList.add('over');
  }, { passive: false });
  document.addEventListener('pointerup', e => {
    if (!drag) return; const d = drag; drag = null; if (d.tm) clearInterval(d.tm);
    if (d.ghost) d.ghost.remove();
    document.querySelectorAll('.dnd-day.over').forEach(x => x.classList.remove('over'));
    if (!d.moved) return;
    const under = document.elementFromPoint(e.clientX, e.clientY), box = under && (under.closest('[data-day]'));
    if (box) wpAssign(d.tid, +box.dataset.day); else render();
  });
  document.addEventListener('pointercancel', () => {
    if (!drag) return; if (drag.tm) clearInterval(drag.tm);
    if (drag.ghost) drag.ghost.remove();
    drag.el.classList.remove('dragging'); drag = null;
    document.querySelectorAll('.dnd-day.over').forEach(x => x.classList.remove('over'));
  });
  document.addEventListener('click', e => {
    if (S.view !== 'weekplan') return;
    if (e.target.closest('.dnd-x')) return;
    const item = e.target.closest('.dnd-item');
    if (item) { S.pickT = S.pickT === item.dataset.tid ? null : item.dataset.tid; render(); return; }
    if (!S.pickT) return;
    const day = e.target.closest('.dnd-day'); if (day) wpAssign(S.pickT, +day.dataset.day);
  });
})();

}

    st.branch = g.branch ? (st.branch || 'sci') : null;
    if (!g.ministerial) st.goal = null; else if (!st.goal) st.goal = 90;
    st.examDate = null; save(); render(); toast('تغيّر صفك إلى ' + g.name + '.');
  }
  if (id === 'sStart' && v) { st.start = v; save(); toast('أُعيد حساب أسابيعك.'); }
  if (id === 'sExam' && v) { st.examDate = v; save(); toast('حُفظ موعد امتحانك.'); }
  if (id === 'impFile' && e.target.files[0]) {
    importAny(e.target.files[0]);
  }
});

/* =================== النسخ الاحتياطي =================== */
function doExport() {
  const data = JSON.stringify({ app: 'study-app', schema: SCHEMA, exported: new Date().toISOString(), db: DB });
  const box = document.getElementById('expBox'), ta = document.getElementById('expText');
  ta.value = data; box.hidden = false;
  saveFile('نسخة-احتياطية-' + isoD(new Date()) + '.json', data, 'application/json');
}
function doImport(text) {
  let o;
  try { o = JSON.parse(text); } catch (err) { toast('هذا النص ليس نسخة احتياطية صالحة. تأكد أنك نسخته كاملًا.'); return; }
  if (!o || o.app !== 'study-app' || !o.db || !Array.isArray(o.db.students)) { toast('الملف لا يخص هذا التطبيق.'); return; }
  const pending = S.pendingPhotos || [];
  if (pending.some(x => x.sid && !o.db.students.some(s => s.id === x.sid))) {
    S.pendingPhotos = null;
    toast('النسخة تحتوي صورًا مرتبطة بطلاب غير موجودين فيها؛ لم يُسترجع شيء.');
    return;
  }
  S.dialog = { title: 'استرجاع النسخة الاحتياطية؟', text: 'فيها ' + ar(o.db.students.length) + ' طالب. ستحل محل كل ما على هذا الجهاز الآن.', ok: 'استرجع', danger: false,
    run: async () => {
      DB = Object.assign(freshDB(), o.db, { schema: SCHEMA }); save();
      try {
        await Promise.all(pending.map(x => {
          const sid = x.sid || DB.activeId, key = x.avatar ? avKey(sid) : sid + ':' + x.pid;
          return MEDIA.put(key, 'data:image/jpeg;base64,' + x.b64);
        }));
        toast('استُرجعت النسخة الاحتياطية مع ' + ar(pending.length) + ' صورة.');
      } catch (e) { toast('استُرجعت بيانات النسخة لكن تعذّر حفظ بعض الصور: ' + (e.message || 'خطأ غير معروف')); }
      finally { S.pendingPhotos = null; S.stack = []; S.view = 'today'; render(true); }
    } };
  render();
}

/* =================== التشغيل =================== */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloadingForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloadingForUpdate) return;
    reloadingForUpdate = true;
    flushSave();
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').catch(e => console.error('تعذّر تسجيل تحديث التطبيق:', e));
}
let releaseNoticeStorageError = false;
function queueReleaseNotice() {
  if (!DB.students.length) return false;
  let seen = null;
  try { seen = localStorage.getItem(RELEASE_NOTICE_KEY); } catch (e) { releaseNoticeStorageError = true; }
  if (seen === APP_RELEASE_ID) return false;
  if (DB.students.length) S.dialog = { title: 'وصل تحديث جديد إلى دَرْب', html: releaseNotesHTML(), ok: 'فهمت، ابدأ الدراسة', single: true };
  try { localStorage.setItem(RELEASE_NOTICE_KEY, APP_RELEASE_ID); }
  catch (e) { releaseNoticeStorageError = true; }
  return releaseNoticeStorageError;
}
function prepareManualLessonSelection() {
  let changed = false;
  DB.students.forEach(st => {
    if (st.lessonSelectionVersion === 2) return;
    if (st.weekMode !== 'manual') {
      st.weekMode = 'manual';
      st.weekFill = null;
      st.autoWeek = null;
      st.dayPlan = null;
    }
    st.lessonSelectionVersion = 2;
    changed = true;
  });
  if (changed) save();
}
try { history.replaceState({ d: 0 }, ''); } catch (e) {}
prepareManualLessonSelection();
queueReleaseNotice();
render();
if (releaseNoticeStorageError) toast('تعذّر حفظ حالة إشعار التحديث على هذا الجهاز؛ قد يظهر الملخص مرة أخرى عند فتح التطبيق.');
</script>
