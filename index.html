/* =================== المحتوى =================== */
/* المحتوى الحقيقي يُبنى من نص الكتاب الرسمي. المسائل أدناه نموذج مؤقت لتجربة المحرك، وتُستبدل بمسائل الكتاب. */
/* كل فصل في ملف مستقل داخل content/ يضيف نفسه إلى CONTENT_PARTS، وهنا تُجمع الفصول حسب الصف والفرع والمادة */
/* بنك الأسئلة الوزارية الكامل: أجزاء تُضاف من content/ministerial-*.js على شكل
   { key: '12:sci:الفيزياء', questions: [{ q, o:[...], c, why, tid?, year? }] }، ويخدم الطالب (تصفّح وتدريب) والنظام (جلسات التهيئة الوزارية والتطور). */
window.MINISTERIAL_BANK = window.MINISTERIAL_BANK || [];
const CONTENT = {};
(window.CONTENT_PARTS || []).forEach(p => { (CONTENT[p.key] = CONTENT[p.key] || { chapters: [] }).chapters.push(p.chapter); });
Object.values(CONTENT).forEach(c => c.chapters.sort((a, b) => a.no - b.no));
/* فهرس بحث سريع O(1) يُبنى مرة واحدة بعد تجميع المحتوى، بدل المسح الخطي في كل استدعاء */
const IDX_TOPIC = new Map(), IDX_CH = new Map(), IDX_PROB = new Map();
Object.entries(CONTENT).forEach(([k, c]) => c.chapters.forEach(ch => {
  IDX_CH.set(ch.id, { key: k, ch });
  ch.topics.forEach(t => { IDX_TOPIC.set(t.id, { key: k, ch, t }); (t.problems || []).forEach(p => IDX_PROB.set(p.id, { key: k, ch, t, p, subject: k.split(':')[2] })); });
}));
const contentKey = (gid, branch, subject) => gid + ':' + (branch || '-') + ':' + subject;
function contentOf(gid, subject) {
  const st = me(), g = GRADES[gid - 1];
  const br = g.branch ? (gid === st.grade ? st.branch : (st.branch || 'sci')) : null;
  return CONTENT[contentKey(gid, br, subject)] || null;
}
/* المواضيع التي أخفاها الطالب («ليس ضمن دراستي») تُستثنى من المسار والمسائل والاختبارات والبحث والتقدم */
const isHidden = tid => { const st = me(); return !!(st && (st.hidden || []).includes(tid)); };
function allProblems(c, withHidden) { const out = []; c.chapters.forEach(ch => ch.topics.forEach(t => { if (!withHidden && isHidden(t.id)) return; t.problems.forEach(p => out.push({ p, t, ch })); })); return out; }
function findTopic(id) { return IDX_TOPIC.get(id) || null; }
/* تجميع سؤال: مربوط بموضوعه إن أمكن، وإلا يُجمع حسب دورة الاختبار */
function qGroup(x) {
  const t = x.tid ? findTopic(x.tid) : null;
  if (t) return { chId: t.ch.id, chTitle: t.ch.title, tKey: x.tid, tLabel: ft(t.t.title) };
  const yr = x.q && x.q.year;
  return { chId: 'bank', chTitle: 'أسئلة الدورات الوزارية', tKey: yr ? 'y' + yr : 'general', tLabel: yr ? 'دورة ' + ar(yr) : 'أسئلة عامة' };
}
function qChId(x) { return qGroup(x).chId; }
function qTid(x) { return qGroup(x).tKey; }
/* بيانات السؤال الوزاري: الفصل المرتبط به (إن وُجد بالتحليل) + نوعه وزمنه ومصدره */
function bankMeta(x) {
  const q = x.q || {}, t = x.tid ? findTopic(x.tid) : null;
  const chTitle = q.ch || (t ? t.ch.title : '');
  const tpTitle = q.tpT || (t ? ft(t.t.title) : '');
  const conf = q.mc || (q.ch ? q.mc || 'chapter' : (t ? 'high' : 'none'));
  const year = q.year || 0, role = q.role && q.role !== 'غير محدد' ? q.role : '';
  const isMCQ = q.o && q.o.length;
  const type = q.type || (isMCQ ? 'اختيار من متعدد' : '');
  const sec = q.time || (isMCQ ? 60 : 120);
  return { chTitle, tpTitle, conf, year, role, sec, type, letter: q.letter || '', num: q.num || '', fromExam: !!year };
}
/* سطر هينت يظهر عند المرور على السؤال: مصدره في الدورات + نوعه + زمنه */
function bankHint(x) {
  const m = bankMeta(x), bits = [];
  bits.push(m.fromExam ? 'دورة ' + ar(m.year) + (m.role ? ' · ' + m.role : '') : 'سؤال من إعداد المنهج لا من دورة سابقة');
  if (m.type) bits.push('النوع: ' + m.type);
  bits.push('زمن مقترح: ' + Math.round(m.sec / 60) + ' دقيقة');
  if (m.chTitle) bits.push('الفصل: ' + m.chTitle.replace(/^[^:]*[:：]\s*/, ''));
  if (m.letter) bits.push('الفرع ' + m.letter + (m.num ? ' · رقم ' + ar(m.num) : ''));
  return bits.join(' · ');
}
function findChapter(id) { return IDX_CH.get(id) || null; }
function findProblem(id) { return IDX_PROB.get(id) || null; }
/* يعزل كل معادلة داخل النص العربي حتى لا ينقلب ترتيبها */
const MATH_RE = /[A-Za-zΔΦεπΩµ½√(0-9⁰¹²³⁴-⁹ωθφαβλℂ‖±][A-Za-zΔΦεπΩµ½√∝≈∥…ωθφαβλℂ‖±^⁄⁰¹²³⁴-⁹⁻⁺₀-₉0-9=×÷+\-−().²³ \/.,_{}·'°→⇌⟸<>]*[A-Za-z0-9µΩ⁰¹²³⁴-⁹₀-₉)}'°ωθφπ‖]|[A-Za-zΔΦεπΩµ0-9ωθφℂ]/g;
const subs = s => s.replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
/* يعزل كل معادلة أو رمز لاتيني داخل النص العربي في عنصر LTR، ويُهرّب النص قبل التغليف */
const arSec = x => /[A-Za-z]/.test(String(x)) ? String(x) : ar(String(x));
const bsec = x => '<bdi' + (/[\u0621-\u064A]/.test(String(x)) ? '' : ' dir="ltr"') + '>' + esc(arSec(x)) + '</bdi>';
const ft = t => /[_^=]/.test(t) ? fm(t) : esc(t).replace(/\d+(?:\s*[–\-]\s*\d+)+/g, m => '<bdi dir="ltr">' + m + '</bdi>');
const fm = t => { t = String(t == null ? '' : t); if (!/[\u0600-\u06FF]/.test(t) && /[a-z]{2,}[\s,’'][^=]*[a-z]{2,}/i.test(t)) return '<span class="lt lt-b" dir="ltr">' + esc(t) + '</span>'; let out = '', last = 0; t.replace(MATH_RE, (m, off) => { if (!/[=+×÷√]/.test(m) && /[a-z]{3,}\s+[a-z]{2,}/i.test(m)) { out += esc(t.slice(last, off)) + '<span class="lt" dir="ltr">' + esc(m) + '</span>'; last = off + m.length; return m; } out += esc(t.slice(last, off)) + '<span class="math' + (m.length <= 28 ? ' eq' : '') + '">' + subs(esc(m)) + '</span>'; last = off + m.length; return m; }); return out + esc(t.slice(last)); };
const fe = t => '<span class="math eq">' + subs(esc(t)) + '</span>';
const mmss = s => { s = Math.max(0, Math.round(s)); return ar(String(Math.floor(s / 60)).padStart(2, '0')) + ':' + ar(String(s % 60).padStart(2, '0')); };
/* مدة بالساعات والدقائق تُقرأ («ساعة و٢٥ دقيقة») بدل أرقام خام */
const fmtDur = s => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); if (h && m) return ar(h) + ' س ' + ar(m) + ' د'; if (h) return ar(h) + ' ساعة'; return ar(Math.max(1, m)) + ' دقيقة'; };

/* حالة حل المسألة: started (بدأ العد) ← revealed (ظهر الحل بعد المطابقة أو «لا أعرف») ← self (تقييم الطالب لحله) ← used/fx (الوقت وأثره) */
function solveOf(pid) { const st = me(); st.solves = st.solves || {}; return st.solves[pid] || null; }
function startSolve(pid) { const st = me(); st.solves[pid] = { started: Date.now(), attempts: ((solveOf(pid) || {}).attempts || 0) + 1 }; save(); }
function logTime(subject, sec, type) {
  const st = me(); st.log = st.log || [];
  st.log.push({ d: isoD(new Date()), subject, sec: Math.round(sec), type });
  if (st.log.length > 5000) st.log = st.log.slice(-5000);
}
function todayProblemSec() { const st = me(), d = isoD(new Date()); return (st.log || []).filter(x => x.d === d && x.type === 'problem').reduce((a, x) => a + x.sec, 0); }

/* أولوية وقت المسائل: المواد التي فيها مسائل لم تُحل تأتي أولًا، والأكثر مسائل متبقية قبل غيرها */
function problemQueue() {
  const st = me(), subs = subjectsOf(st.grade, st.branch), q = [];
  subs.forEach(s => {
    const c = contentOf(st.grade, s); if (!c) return;
    const all = allProblems(c), pending = all.filter(x => { const v = solveOf(x.p.id); return !v || v.self !== 'ok'; });
    if (pending.length) q.push({ subject: s, pending: pending.length, total: all.length, next: pending[0].p.id });
  });
  return q.sort((a, b) => b.pending - a.pending);
}

/* ٧-ز) سجل «تطوّرك الوزاري»: كل ما اختبرته في المادة (اختبارات المواضيع + الشهري + الوزاري)
   في سجل واحد إحصائي على نمط wizarati، مع تبويبات «التقييم اليومي/الشهري/الكلي»
   يتنبّأ فيه بمعدلك في الوزاري. */
function minRecordStats(subject) {
  const st = me();
  const y = subjEntry(subject);
  /* ١) اختبارات المواضيع: من st.progress */
  const quizzes = [];
  if (y) y.c.chapters.forEach(ch => ch.topics.forEach(t => {
    if (isHidden(t.id)) return;
    const p = (st.progress || {})[t.id]; if (!p || !p.quiz || !p.quiz.at) return;
    quizzes.push({ at: p.quiz.at, pct: p.quiz.best || 0, last: p.quiz.last || 0, title: t.title, ch: ch.title });
  }));
  /* ٢) الشهري: من st.exams */
  const monthlies = (st.exams || []).filter(e => e.src === 'x:' + subject + ':monthly');
  const quick = (st.exams || []).filter(e => e.src === 'x:' + subject + ':exam');
  /* ٣) الوزاري: من st.ministerial */
  const mins = ((st.ministerial || {})[subject] || []).slice();

  const avg = a => a.length ? Math.round(a.reduce((k, x) => k + x.pct, 0) / a.length) : null;
  const med = a => { if (!a.length) return null; const v = a.map(x => x.pct).sort((m, n) => m - n); return v[Math.floor(v.length / 2)]; };
  const lastN = (a, n) => a.slice().sort((m, n2) => m.at - n2.at).slice(-n);
  const dayStart = Date.now() - 864e5, monthStart = Date.now() - 30 * 864e5;
  const inRange = (a, from) => a.filter(x => x.at >= from);

  const quizzesAll = quizzes.map(q => ({ at: q.at, pct: q.pct }));
  const qAvg = avg(quizzesAll), mAvg = avg(monthlies), xAvg = avg(quick), nAvg = avg(mins);
  /* ٧-ز) توقّع معدلك الوزاري: أثقل للمواد الوزارية نفسها ثم للشهري ثم للمواضيع */
  const w = (nAvg != null ? 5 : 0) + (mAvg != null ? 3 : 0) + (qAvg != null ? 2 : 0);
  const predict = w ? Math.round(((nAvg || 0) * (nAvg != null ? 5 : 0) + (mAvg || 0) * (mAvg != null ? 3 : 0) + (qAvg || 0) * (qAvg != null ? 2 : 0)) / w) : null;
  const today = { q: inRange(quizzesAll, dayStart), m: inRange(monthlies, dayStart), x: inRange(quick, dayStart), n: inRange(mins, dayStart) };
  const month = { q: inRange(quizzesAll, monthStart), m: inRange(monthlies, monthStart), x: inRange(quick, monthStart), n: inRange(mins, monthStart) };
  return {
    subject, quizzes, monthlies, quick, mins, qAvg, mAvg, xAvg, nAvg, med: med(mins.concat(monthlies)),
    predict, lastQ: lastN(quizzesAll, 5), today, month,
    totalAll: quizzesAll.length + monthlies.length + quick.length + mins.length
  };
}
/* أشرطة مقارنة: قيم ثلاث (или أكثر) مع نسبها — نمط wizarati */
function compareBars(rows) {
  const max = Math.max.apply(null, rows.map(r => r[1]).concat([1]));

/* ٧-ط) «المحاكاة الكاملة»: الوزاري الحقيقي ٥–٦ أسئلة فقط، تغطي المادة كلها،
   ومئتها موزّعة على المسائل والتعريفات والرسوم — لا ٥٠ سؤالًا متناثرًا.
   نبني الخطة من أنماط الأسئلة المستخرجة من الدورات (bankMeta.type). */
const SIM_PROB = /احسب|حساب|أعرب|أوصل|رتّب|صحّح|املأ|أجب|اختر|مسألة/;
const SIM_DRAW = /ارسم|رسمة|مجسم|شكل|خريطة|دائرة|مخطط/;
const SIM_DEF = /عرّف|تعريف|حدّد|بيّن|اذكر|علّل|اشرح|استنتج|قارن/;
const SCIENCE = /الرياضيات|الفيزياء|الكيمياء|الأحياء/;
/* فرّة السؤال: مسألة، أم تعريف، أم رسم — والسؤال العام يُصنَّف حسب المادة */
function simBucket(q, subject) {
  const t = (q && q.type || '').trim();
  if (SIM_DRAW.test(t)) return 'draw';
  if (SIM_PROB.test(t)) return 'prob';
  if (SIM_DEF.test(t)) return 'def';
  return SCIENCE.test(subject) ? 'prob' : 'def';
}
const SIM_LABEL = { prob: 'مسائل وحسابات', def: 'تعريفات وتعليلات', draw: 'رسوم ومجسمات', gen: 'أسئلة عامة' };
/* نقاط كل فرّة: المسائل أغلى، ثم الرسوم، ثم التعريفات — حتى تكتمل ١٠٠ */
const SIM_WEIGHT = { prob: 3, draw: 3, def: 2, gen: 2 };
function simPlan(subject) {
  const pool = ministerialPool(subject);
  if (!pool.length) return { n: 0, items: [], by: {}, total: 0, sec: 0 };
  const y = subjEntry(subject);
  const chs = y ? y.c.chapters.filter(ch => pool.some(x => qChId(x) === ch.id)) : [];
  /* ٥ أو ٦ أسئلة كما في الوزاري الحقيقي: منتصف عدد الفصول، محصورًا بينهما */
  const n = Math.max(5, Math.min(6, Math.ceil((chs.length || pool.length) / 2)));
  /* نوزّع الأسئلة على الفصول بالتناوب حتى تُغطى المادة كلّها لا فصلًا واحدًا */
  const byCh = {};
  pool.forEach(x => (byCh[qChId(x)] = byCh[qChId(x)] || []).push(x));
  const order = Object.keys(byCh).sort((a, b) => byCh[b].length - byCh[a].length);
  const picked = [];
  for (let round = 0; round < n && picked.length < n; round++) {
    for (let k = 0; k < order.length && picked.length < n; k++) {
      const arr = byCh[order[k]];
      const cand = arr.filter(x => picked.indexOf(x) < 0);
      if (!cand.length) continue;
      /* داخل الفصل ننوّع الفرّ: مسألة ثم تعريف ثم رسم إن وُجد */
      const want = ['prob', 'def', 'draw', 'prob', 'def', 'draw'][picked.length % 6];
      let x = cand.find(c => simBucket(c.q, subject) === want) || cand[round % cand.length];
      picked.push(x);
    }
  }
  /* توزيع ١٠٠ نقطة على ما اخترناه بحسب فرّته */
  const ws = picked.map(x => SIM_WEIGHT[simBucket(x.q, subject)] || 2);
  const wSum = ws.reduce((a, b) => a + b, 0) || 1;
  let left = 100;
  const pts = ws.map((w, i) => {
    const v = i === ws.length - 1 ? left : Math.max(5, Math.round(w / wSum * 100));
    left -= v; return v;
  });
  while (left > 0) { pts[0] += 1; left--; }
  while (left < 0) { const j = pts.indexOf(Math.max.apply(null, pts)); pts[j] -= 1; left++; }
  const by = {};
  picked.forEach((x, i) => {
    const b = simBucket(x.q, subject);
    by[b] = by[b] || { n: 0, pts: 0 };
    by[b].n++; by[b].pts += pts[i];
  });
  return {
    n: picked.length, items: picked.map((x, i) => ({ x, pts: pts[i], b: simBucket(x.q, subject) })),
    by, total: pts.reduce((a, b) => a + b, 0),
    sec: picked.reduce((a, x) => a + qSec(x.q, 'ministerial'), 0),
    chs: chs.length, bank: pool.length
  };
}
/* شاشة التحضير للمحاكاة الكاملة: تشرح الخطة (عدد الأسئلة وتوزيع المئات وزمنها) قبل البدء */

    '<div class="hint-purpose" style="margin-top:12px">' + ico('star', 1.6) +
      '<span><b>لماذا هذه الخطة؟</b><br><span class="small">لأن الوزاري يقيس الفهم لا الحفظ: خمسة أسئلة كبيرة تغطي الفصول كلّها وتُوزَّع بالنقاط، فتتدرب على التفكير في سؤال طويل بدل الإجابة عن أربعين سؤالًا قصيرًا. زمن كل سؤال مشتقّ من صعوبته (كتاب ٣ دقائق، وزاري ٥) ومن زمنك الفعلي.</span></span></div>' +
    '<div class="chips" style="margin-top:12px">' + p.items.map((it, i) =>
      '<span class="chip" style="cursor:default"><b>' + ar(i + 1) + ' · ' + ar(it.pts) + ' ن</b> <span class="small muted">' + (SIM_LABEL[it.b] || '') + '</span></span>').join('') + '</div>' +
    '<div class="grid2" style="margin-top:12px">' +

      '<button class="btn ghost" data-act="back">رجوع</button></div>' +

/* =================== الامتحانات لكل مادة: عندي امتحان، الشهري، التهيئة للوزاري =================== */
const EXAM_KINDS = { exam: 'عندي امتحان', monthly: 'الشهري', ministerial: 'التهيئة للوزاري' };
const EXAM_DESC = {
  exam: 'جلسة امتحان من أسئلة المادة، كل سؤال بعده سبب الجواب وتفصيله.',
  monthly: 'امتحان شهري بتفاصيل كاملة: النتيجة، والمواضيع التي أخفقت فيها، ومسارك في المادة.',
  ministerial: 'أسئلة الدورات الوزارية بوقت محسوب لكل سؤال. تُغلق الأسئلة ولا تُفتح حتى تضغط «أكملت الامتحان» وتؤكّد العهد، ثم تُسجَّل مدتك ويُحسب معدلك وتُحدَّد مواضيعك الضعيفة ليزيدها جدول المراجعة.'
};
function subjEntry(subject) { return gradeContents(me().grade).find(y => y.subject === subject) || null; }
function subjTopics(subject) {
  const y = subjEntry(subject), out = [];
  if (y) y.c.chapters.forEach(ch => ch.topics.forEach(t => { if (!isHidden(t.id)) out.push({ ch, t }); }));
  return out;
}
function subjQuizPool(subject) {
  const out = [];
  subjTopics(subject).forEach(({ t }) => t.quiz.forEach((q, i) => out.push({ q, tid: t.id, key: t.id + ':' + i })));
  return out;
}
function ministerialPool(subject) {
  const key = contentKey(me().grade, me().branch, subject), out = [];
  (window.MINISTERIAL_BANK || []).forEach((part, pi) => {
    if (part.key !== key || !part.questions) return;
    /* pi في المفتاح ضروري: أكثر من جزء قد يتشارك المادة نفسها (بنك يدوي + بنك مستخرج)
       وكان التكرار يجعل مفتاحًا واحدًا يُطابق سؤالين فيحصر التدريب على ضعف ما اختير */
    part.questions.forEach((q, i) => out.push({ q, tid: q.tid || null, part: pi, key: 'MN:' + key + ':' + pi + ':' + i }));
  });
  return out;
}
const ministerialHasBank = subject => ministerialPool(subject).length > 0;
function examPool(kind, subject) { return kind === 'ministerial' ? (ministerialHasBank(subject) ? ministerialPool(subject) : subjQuizPool(subject)) : subjQuizPool(subject); }
function ministerialAvg(subject) {
  const arr = ((me().ministerial || {})[subject]) || [];
  return arr.length ? Math.round(arr.reduce((k, x) => k + x.pct, 0) / arr.length) : 0;
}
function examConfig(kind, subject) {
  /* الوقت لا يُضبط برقمه: يُشتقّ من صعوبة أسئلة المادة ومن زمنك الفعلي في المسائل */
  const pool = examPool(kind, subject);
  const defaultPerQ = pool.length ? Math.round(pool.reduce((a, x) => a + qSec(x.q, kind), 0) / pool.length) : (kind === 'ministerial' ? 180 : 90);
  S.exam = { kind, subject, phase: 'config', perQ: defaultPerQ, prep: 0 }; go('exam');
}
function startExam(kind, subject, n, perQ) {
  const pool = examPool(kind, subject);
  if (!pool.length) { toast('لا توجد أسئلة في هذا القسم بعد.'); return false; }
  
  // فلترة حسب الفصول/المواضيع المختارة
  let filtered = pool;
  if (S.exam && Array.isArray(S.exam.selCh)) {
    filtered = filtered.filter(x => S.exam.selCh.includes(qChId(x)));
  }
  if (S.exam && Array.isArray(S.exam.selTopics)) {
    filtered = filtered.filter(x => S.exam.selTopics.includes(qTid(x)));
  }
  /* نطاق مجموعات البنك: إن اختار الطالب فصلًا أو دورة من الشاشة السابقة، يُحصر الاختبار فيها */
  if (S.examScope && Array.isArray(S.examScope.keys)) {
    filtered = filtered.filter(x => S.examScope.keys.includes(x.key));
  }
  if (!filtered.length) { toast('لا توجد أسئلة في النطاق المحدد.'); return false; }
  
  /* ٧-ط) المحاكاة الكاملة تفرض أسئلتها المخطَّطة (بنقاطها) بدل الاختيار العشوائي */
  const forced = S.examForcePick;

    const el = document.getElementById('examClock');
    if (!el) { clearExamClock(); return; }
    const perQ = perQOf(z, z.i);
    const left = Math.max(0, perQ - Math.floor((Date.now() - z.qAt) / 1000));
    el.textContent = mmss(left);
    el.classList.toggle('bad-t', left <= 10);
    const bar = document.getElementById('examBar'); if (bar) bar.style.width = Math.round(left / perQ * 100) + '%';

        const isOpen = (!it.q.o || !it.q.o.length) && (it.q.c == null || it.q.c < 0);

/* =================== خطة اليوم: توزيع المواضيع المتبقية على أيام الدراسة =================== */
/* تُدمج المواضيع المتبقية لكل مادة بالتناوب (مادة، مادة، مادة…) فلا تطغى مادة على غيرها،
   ولا يزيد نصاب اليوم على مادتين ثقيلتين، ثم تُقدَّم مراجعات اليوم المستحقة أولًا. */
function studyLine() {
  const st = me(), groups = [];
  gradeContents(st.grade).forEach(y => {
    const ts = [];
    y.c.chapters.forEach(ch => ch.topics.forEach(t => { if (!isHidden(t.id) && topicPct(t) < 90) ts.push({ subject: y.subject, ch, t }); }));
    if (ts.length) groups.push({ subject: y.subject, ts });
  });
  if (!groups.length) return [];
  groups.sort((a, b) => b.ts.length - a.ts.length);
  const line = [], total = groups.reduce((k, g) => k + g.ts.length, 0);
  for (let i = 0; line.length < total; i++) {
    const g = groups[i % groups.length];
    if (g.ts.length) line.push(g.ts.shift());
  }
  return line;
}
function planToday() {
  const st = me(), line = studyLine();
  const K = Math.max(1, Math.min(4, Math.round((st.minutes || 120) / 40)));
  const picks = [], seen = new Set();
  for (const it of line) {
    if (picks.length >= K) break;
    if (seen.size >= 2 && !seen.has(it.subject)) continue;
    seen.add(it.subject); picks.push(it);
  }
  const reviews = revAll().filter(x => revOver(x.r)).slice(0, 6);
  return { picks, reviews, left: line.length - picks.length, total: line.length };
}
/* الهدف الأسبوعي: عدد المواضيع التي يجب تغطيتها أسبوعيًا لإنهاء المنهج قبل الامتحان */
function weeklyGoal() {
  const st = me(), ti = timeInfo(st);
  if (!ti.daysLeft || !line_count()) return { perWeek: 0, total: 0, weeksLeft: 0 };
  const total = studyLine().length;
  const weeksLeft = Math.max(1, Math.ceil(ti.daysLeft / 7));
  return { perWeek: Math.ceil(total / weeksLeft), total, weeksLeft };
}
function line_count() { return studyLine().length; }
/* ── أهداف الأسبوع ──
   لا رقم مكتوب يتقدّم وحده: كل هدف يُقرأ من تقدّمك الفعلي (topicPct)، فينخفض كلما
   اجتزت اختبارًا أو أتقنت مسألة، ويعاد توزيعه على أسابيعك الباقية وحده.
   الطالب لا يُلقى به في مئة موضوع، بل في حصص معدودة يختار ترتيبها. */
function weeklyGoals(st) {
  const ti = timeInfo(st);
  const studyDays = Math.max(1, 7 - (st.rest || []).length);
  const perDay = Math.max(1, Math.min(4, Math.round((st.minutes || 120) / 40)));
  const weeksLeft = Math.max(1, ti.weeksLeft || Math.ceil((ti.daysLeft || 7) / 7));
  const subjects = [];
  let left = 0, total = 0;
  gradeContents(st.grade).forEach(y => {
    const c = y.c; if (!c) return;
    const topics = [];
    c.chapters.forEach(ch => ch.topics.forEach(t => { if (!isHidden(t.id)) topics.push({ t, ch, subject: y.subject }); }));
    const done = topics.filter(x => topicPct(x.t) >= 90).length;
    const lft = topics.length - done;
    total += topics.length; left += lft;
    subjects.push({ subject: y.subject, total: topics.length, done, left: lft, topics });
  });
  const perWeek = Math.ceil(left / weeksLeft);
  const sum = subjects.reduce((a, s) => a + s.left, 0) || 1;
  subjects.forEach(s => { s.perWeek = s.left ? Math.max(1, Math.round(perWeek * s.left / sum)) : 0; });
  return { weeksLeft, studyDays, perDay, sessionsPerWeek: studyDays * perDay, perWeek, left, total, subjects, weekNo: ti.weekNo };
}
/* مواضيع الحصة القادمة: تُوزَّع بالتناوب بين المواد حسب ما بقي في كل واحدة، فلا تُهمَّل
   مادة كاملة، ثم تُخلط في الوضع العشوائي وتبقى على ترتيب المنهج في اليدوي */
function weeklyTopicList(st, mode) {
  const g = weeklyGoals(st);
  const buckets = g.subjects.filter(s => s.left > 0)
    .map(s => ({ items: s.topics.filter(x => topicPct(x.t) < 90), share: s.left }));
  if (!buckets.length) return [];
  const need = Math.max(1, g.perWeek);
  const sum = buckets.reduce((a, b) => a + b.share, 0) || 1;
  const target = buckets.map(b => Math.max(1, Math.round(need * b.share / sum)));
  const at = buckets.map(() => 0), out = [];
  let guard = 0;
  while (out.length < need && guard++ < need * 4) {
    let moved = false;
    for (let i = 0; i < buckets.length && out.length < need; i++) {
      if (at[i] < target[i] && buckets[i].items[at[i]]) { out.push(buckets[i].items[at[i]]); at[i]++; moved = true; }
    }
    if (!moved) {
      let bi = 0;
      for (let i = 1; i < buckets.length; i++) if (at[i] - target[i] > at[bi] - target[bi]) bi = i;
      if (buckets[bi].items[at[bi]]) { out.push(buckets[bi].items[at[bi]]); at[bi]++; moved = true; }
    }
    if (!moved) break;
  }
  return mode === 'random' ? shuffleSeeded(out, g.weekNo) : out;

/* خلط ثابت ببذرة الأسبوع: لو خُلط في كل رسمة لاختلط ترتيب الطالب كلما عاد للشاشة */
function shuffleSeeded(arr, seed) {
  const a = arr.slice();
  let s = (seed * 9301 + 49297) % 233280 || 7;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = s % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

  if (!target) return false;
  target.push(tid); save(); return true;
}
/* ── خطة الأسبوع: ترتيب ← عدد أيامك ← رفوف فارغة يملؤها الطالب ──

/* صور الحلول الورقية تُحفظ في IndexedDB لأنها أكبر من سعة localStorage */
const MEDIA = {
  p: null,
  open() { return this.p || (this.p = new Promise((res, rej) => { try { const r = indexedDB.open('study-app-media', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } })); },
  async tx(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('photos', mode), st = t.objectStore('photos'), r = fn(st); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  get(k) { return this.tx('readonly', s => s.get(k)).catch(() => null); },
  del(k) { return this.tx('readwrite', s => s.delete(k)).catch(() => null); }
};
const photoKey = pid => me().id + ':' + pid;
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const m = 1400, k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function mountPhotos() {
  document.querySelectorAll('img[data-photo]:not([src])').forEach(async im => { const d = await MEDIA.get(photoKey(im.dataset.photo)); if (d) { im.src = d; im.hidden = false; } });
  document.querySelectorAll('img[data-avkey]:not([src])').forEach(async im => { const d = await MEDIA.get(im.dataset.avkey + ':avatar'); if (d) { im.src = d; im.hidden = false; } });
}

/* ملفات: في المعاينة على claude.ai تمر عبر قدرة التنزيل، وفي التطبيق المنشور تنزيل عادي */
async function saveFile(name, data, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('downloads');
      if (d) { try { await d.save({ filename: name, data }); toast('حُفظ الملف.'); return true; } catch (e) { if (e && e.code === 'declined') return false; } }
    }
  } catch (e) {}
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('حُفظ الملف.'); return true;
  } catch (e) { toast('تعذّر حفظ الملف هنا.'); return false; }
}

/* يجمع مواضيع النطاق: درس، تبويب، فصل، مادة، صف، كامل */
function gradeContents(gid) {
  const st = me(), g = GRADES[gid - 1], br = g.branch ? (gid === st.grade ? st.branch : (st.branch || 'sci')) : null;
  return subjectsOf(gid, br).map(s => ({ gid, subject: s, c: contentOf(gid, s) })).filter(x => x.c);
}
function scopeTopics(x) {
  const st = me(), out = [];
  const push = (gid, subject, ch, t) => { if (!isHidden(t.id)) out.push({ gid, subject, ch, t }); };
  const fromC = (gid, subject, c) => c.chapters.forEach(ch => ch.topics.forEach(t => push(gid, subject, ch, t)));
  if (x.lvl === 'topic' || x.lvl === 'tab') { const f = findTopic(x.tid); if (f) push(st.grade, x.subject, f.ch, f.t); }
  else if (x.lvl === 'chapter') { const f = findChapter(x.ch); if (f) f.ch.topics.forEach(t => push(st.grade, x.subject, f.ch, t)); }
  else if (x.lvl === 'subject') { const c = contentOf(st.grade, x.subject); if (c) fromC(st.grade, x.subject, c); }
  else if (x.lvl === 'grade') gradeContents(st.grade).forEach(y => fromC(y.gid, y.subject, y.c));
  else for (let g = 1; g <= st.grade; g++) gradeContents(g).forEach(y => fromC(y.gid, y.subject, y.c));
  return out;
}
const LVL = [['topic', 'درس'], ['tab', 'تبويب'], ['chapter', 'فصل'], ['subject', 'مادة'], ['grade', 'الصف'], ['all', 'كامل']];
function scopeLabel(x) {
  const st = me();
  if (x.lvl === 'topic' || x.lvl === 'tab') { const f = findTopic(x.tid); return f ? x.subject + ' · ' + arSec(f.t.sec) + ' ' + f.t.title + (x.lvl === 'tab' ? ' · ' + NB_SEG_NAME[x.seg] : '') : ''; }
  if (x.lvl === 'chapter') { const f = findChapter(x.ch); return f ? x.subject + ' · ' + f.ch.title : ''; }
  if (x.lvl === 'subject') return x.subject + ' · ' + GRADES[st.grade - 1].name;
  if (x.lvl === 'grade') return 'كل مواد ' + GRADES[st.grade - 1].name;
  return 'كل صفوفي حتى ' + GRADES[st.grade - 1].name;
}

function nbEntries(t) {
  const notes = Object.entries(notesOf(t.id)).filter(e => e[1] && e[1].trim());
  const probs = t.problems.filter(p => solveOf(p.id));
  const wrong = Object.keys(wrongOf(t.id)).map(Number).filter(i => t.quiz[i]);
  return { notes, probs, wrong, n: notes.length + probs.length + wrong.length };
}

    });
    if (chHTML) body += '<h2 class="nb-ch">' + esc(ch.title) + '</h2>' + chHTML;

/* ===== تصدير السجلات منفصلًا عن تصدير المحتوى: سجل مراجعة، سجل نشاط، نتائج اختبارات ===== */
function exportLogDoc(kind) {
  const st = me(), now = new Date(), types = { problem: 'مسألة', review: 'مراجعة', study: 'دراسة', quiz: 'اختبار' };
  const title = kind === 'review' ? 'سجل المراجعة' : kind === 'tests' ? 'سجل نتائج الاختبارات' : 'سجل النشاط';
  let rows, meta;
  if (kind === 'review') { rows = (st.log || []).filter(x => x.type === 'review'); meta = rows.length + ' مراجعة'; }
  else if (kind === 'tests') { rows = (st.exams || []).slice().reverse(); meta = ar(rows.length) + ' نتيجة اختبار'; }
  else { rows = (st.log || []).slice().reverse(); meta = ar(rows.length) + ' حركة مسجلة'; }
  let h = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>' + esc(title) + '</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style>' + EXP_CSS + '</style></head><body><div class="wrap">' +
    '<section class="cover"><div class="meta">' + esc(st.name) + ' · ' + esc(GRADES[st.grade - 1].name) + ' · ' + esc(fmtD(now)) + '</div><h1>' + esc(title) + '</h1><div style="font-size:18px">' + meta + '</div></section>';
  if (kind === 'tests') {
    rows.slice(0, 500).forEach(e => h += '<div class="blk"><b class="t">' + esc(examLabel(e.src)) + '</b> <span class="muted">' + fmtD(new Date(e.at)) + '</span><br>النتيجة: <b>' + ar(e.pct) + '٪</b> · ' + ar(e.n) + ' أسئلة</div>');
    if (!rows.length) h += '<p>لا نتائج اختبارات بعد.</p>';
  } else {
    const byDay = {};
    rows.forEach(x => { (byDay[x.d] = byDay[x.d] || []).push(x); });
    const keys = Object.keys(byDay).sort((a, b) => b.localeCompare(a));
    if (!keys.length) h += '<p>لا نشاط مسجل بعد.</p>';
    keys.slice(0, 120).forEach(d => {
      h += '<h2>' + fmtD(parseD(d)) + (kind === 'review' ? ' <span class="muted">' + ar(byDay[d].length) + ' مراجعة</span>' : '') + '</h2>';
      h += byDay[d].map(x => '<div class="blk"><b class="t">' + esc(x.subject || 'عام') + '</b> · ' + esc(types[x.type] || x.type) + (x.sec ? ' · ' + ar(Math.round(x.sec / 60)) + ' دقيقة' : '') + '</div>').join('');
    });
  }
  h += '<p class="foot">صُدِّر من التطبيق في ' + esc(fmtD(now)) + '</p></div></body></html>';
  saveFile(title + '-' + isoD(now) + '.html', h, 'text/html');
}

/* =================== الأشكال =================== */
/* ══════════════════════════════════════════════════════════════════════
   الرسم التفاعلي (النقطة ٨)
   ──────────────────────────────────────────────────────────────────────
   الرسم ليس صورةً تُنظر إليها ويُمرَّ عليها. هنا:
     · تكبير وتصغير (أزرار + عجلة الفأرة) وسحب للتحريك داخل الإطار.
     · نقاط مرقّمة فوق أجزاء الرسم — اضغط أيًّا منها فيشرح نفسه.
     · «ماذا يعلّمك هذا الرسم؟» — غاية الرسم التعليمية صراحةً.
     · «كيف ترسمه بنفسك؟» — يبنيه أمامك خطوةً خطوة، فيتعلّم
       الطالب بناء الرسم لا حفظ شكله.
     · ملء الشاشة للكبير منه والتقريب الدقيق.
   ══════════════════════════════════════════════════════════════════════ */
function figVBox(svg) { const m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg || ''); return m ? { w: +m[1], h: +m[2] } : { w: 320, h: 200 }; }
function figSt(k) { const S2 = S; if (!S2.figs[k]) S2.figs[k] = { z: 1, x: 0, y: 0, step: 0, part: -1 }; return S2.figs[k]; }
/* --fz يبقى مع التكبير حتى تستطيع النقاط أن تُحجَم بمعكوسه فلا تتضخّم مع الرسم */
/* قيمة transform وحدها — تُستعمل أيضًا في style.transform مباشرة */
function figT(z, x, y) { return 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')'; }
/* قائمة كاملة للخاصية style=""، وتحمل --fz حتى تُحجَم النقاط بمعكوس التكبير */
function figTDecl(z, x, y) { return 'transform:' + figT(z, x, y) + ';--fz:' + z + ';'; }
function figApply(k) {
  const L = document.querySelector('[data-figlayer="' + k + '"]');
  if (!L) return false;
  const st = figSt(k);
  L.style.transform = figT(st.z, st.x, st.y);
  L.style.setProperty('--fz', st.z);
  /* داخل الموضوع: تُمنع لمس السحب فقط بعد التكبير، وإلّا يبقى تمرير الصفحة طبيعيًّا */
  const vp = L.closest('.fig-vp');
  if (vp && !vp.dataset.figvp) vp.style.touchAction = st.z > 1 ? 'none' : '';
  return true;
}

/* النقاط المرقّمة فوق الأجزاء — موقعها نسبةً من مقياس الـsvg نفسه */
function figHotspots(k) {
  const f = FIGS[k]; if (!f || !f.parts || !f.parts.length) return '';
  const vb = figVBox(f.svg), st = figSt(k);
  return f.parts.map((p, i) => {
    if (typeof p.x !== 'number' || typeof p.y !== 'number') return '';
    const L = (p.x / vb.w * 100).toFixed(2), T = (p.y / vb.h * 100).toFixed(2);
    return '<button class="fhot' + (st.part === i ? ' on' : '') + '" data-act="figPart" data-k="' + k + '" data-i="' + i + '" ' +
      'style="left:' + L + '%;top:' + T + '%" aria-label="' + esc(p.label) + '">' + ar(i + 1) + '</button>';
  }).join('');
}

/* لوحة شرح الجزء المختار: ماذا يُعلّم هذا الجزء تحديدًا */
function figExplHTML(k) {
  const f = FIGS[k]; if (!f) return '';
  const st = figSt(k), p = (f.parts || [])[st.part];
  if (st.part < 0 || !p) return '<div class="fig-tip">' + ico('search', 1.5) + '<span>اضغط رقمًا من نقاط الرسم فيشرح نفسه، أو اسحب الرسم للتحريك وكبّره بعجلة الفأرة.</span></div>';
  return '<div class="fig-expl"><b><i class="fnum">' + ar(st.part + 1) + '</i> ' + esc(p.label) + '</b><p>' + esc(p.note) + '</p>' +
    '<button class="chip sm" data-act="figPart" data-k="' + k + '" data-i="-1">إغلاق الشرح ✕</button></div>';
}

/* «كيف ترسمه بنفسك؟» — نبني الرسم أمامه خطوةً خطوة.
   تعليمات الخطوات تُقتطع من الـsvg (تبدأ برقم ثم قوس) وتُعرض تحته كتعليق،
   وإلا تراكمت التعليمات فوق بعضها في كل خطوة. */
const FIG_SAY_RE = /<text[^>]*>\s*[٠-٩0-9]+\)[\s\S]*?<\/text>/g;
function figStrip(say) { return String(say || '').replace(FIG_SAY_RE, ''); }
function figSay(step) { const m = String(step || '').match(FIG_SAY_RE); return m ? m[m.length - 1].replace(/^<text[^>]*>|<\/text>$/g, '') : ''; }
function figDrawHTML(k) {
  const f = FIGS[k]; if (!f || !f.steps || !f.steps.length) return '';
  const st = figSt(k), vb = figVBox(f.svg);
  const n = f.steps.length, at = Math.max(0, Math.min(st.step, n - 1));
  let draw = '';
  for (let i = 0; i <= at; i++) draw += figStrip(f.steps[i]);
  const say = figSay(f.steps[at]) || ('الخطوة ' + ar(at + 1));
  return '<div class="fig-draw">' +
    '<div class="fig-stepper">' +
      '<button class="chip sm" data-act="figStep" data-k="' + k + '" data-d="-1"' + (at === 0 ? ' disabled' : '') + '>↩ السابق</button>' +
      '<span class="num">الخطوة ' + ar(at + 1) + ' من ' + ar(n) + '</span>' +
      '<button class="chip sm" data-act="figStep" data-k="' + k + '" data-d="1"' + (at >= n - 1 ? ' disabled' : '') + '><b>التالي ▶</b></button>' +
      '<button class="chip sm" data-act="figStep" data-k="' + k + '" data-d="0">من البداية</button>' +
    '</div>' +
    '<div class="fig-stepview"><svg viewBox="0 0 ' + vb.w + ' ' + vb.h + '" role="img" aria-label="' + esc(say) + '">' + (window.FIG_DEFS || '') + draw + '</svg></div>' +
    '<p class="fig-say"><b>' + esc(say) + '</b></p>' +
    (at >= n - 1 ? '<p class="small muted">هذا الرسم كاملًا. جرّب أن ترسمه من ذاكرة ثم قارنه بالصورة الأصلية.</p>' : '') +
    '</div>';
}

/* أدوات الرسم: تكبير/تصغير/إعادة/ملء الشاشة — تحتها سطر يشرح فائدة كل زرّ (٧-هـ) */

/* بطاقة الرسم داخل الموضوع — قابلة للتقريب والسحب والشرح والبناء */
function figHTML(k, cap, full) {
  const f = FIGS[k]; if (!f) return '';

/* التثبيت بعد كل رسم: العجلة للتكبير، والسحب للتحريك (لا يُعاد إلا على الجديد) */
function mountFigs() {
  document.querySelectorAll('.fig-vp').forEach(el => {
    if (el.dataset.m) return; el.dataset.m = '1';
    const k = el.querySelector('[data-figlayer]').dataset.figlayer;
    const layer = () => el.querySelector('[data-figlayer]');
    const apply = () => figApply(k);
    /* العجلة تكبّر داخل الشاشة الكاملة فقط، حتى لا تخطف تمرير الصفحة في الموضوع */
    if (el.dataset.figvp) el.addEventListener('wheel', e => { e.preventDefault(); const st = figSt(k); st.z = Math.max(1, Math.min(6, st.z * (e.deltaY < 0 ? 1.15 : 0.87))); if (st.z === 1) { st.x = st.y = 0; } apply(); }, { passive: false });
    let drag = null;
    el.addEventListener('pointerdown', e => { const st = figSt(k); if (st.z <= 1) return; drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y }; try { el.setPointerCapture(e.pointerId); } catch (er) { } });
    el.addEventListener('pointermove', e => { if (!drag) return; const st = figSt(k); st.x = drag.ox + (e.clientX - drag.x); st.y = drag.oy + (e.clientY - drag.y); apply(); });
    const end = () => { drag = null; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('pointerleave', end);
  });
}

/* الرسوم التفاعلية كلّها تُحمَّل من content/figs.js (النقطة ٨):

function simBox(title, hint) { return '<div class="sim-h"><b>' + title + '</b><span class="small muted">' + hint + '</span></div>'; }
const SIMS = {

    el.innerHTML = simBox('جرّب: مولد التيار المتناوب', 'الملف يدور فيتغير الفيض جيبيًا. بدّل إلى المبادل لترى تيار المولد المستمر') +

      '<div class="chips"><button class="chip gm" data-v="0" aria-pressed="true">حلقتا الزلق (ac)</button><button class="chip gm" data-v="1" aria-pressed="false">المبادل (dc)</button></div>' +
      '<label class="rng">السرعة الزاوية ω: <b class="math vW"></b><input type="range" min="1" max="5" step="0.5" value="' + w + '" class="sW"></label>' +

/* =================== عنصر قابل للمطابقة الرقمية (مسألة أو مثال محلول) =================== */
function findItem(id) {
  const s = String(id || '');
  const em = s.match(/^(.*):e(\d+)$/);
  if (em) {
    const f = findTopic(em[1]);
    if (!f) return null;
    const e = (f.t.examples || [])[+em[2]];
    if (!e) return null;
    const steps = e.steps || [];
    const sec = suggestSec(steps);
    return { id: s, kind: 'example', ans: e.ans, steps, text: e.text, subject: f.key.split(':')[2], t: f.t, ch: f.ch, sec, e, title: e.title };
  }
  const f = findProblem(s);
  if (!f) return null;
  return { id: s, kind: 'problem', ans: f.p.ans, steps: f.p.steps || [], text: f.p.text, subject: f.subject, t: f.t, ch: f.ch, sec: suggestSec(f.p.steps), p: f.p, title: f.p.ref || '' };
}

/* أرقام الجواب النهائي: نوحّدها لأرقام لاتينية، ونمسك الرقم المميّز لإخفائه في الخطوات */
const AR2LAT = '٠١٢٣٤٥٦٧٨٩';
const toLat = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => AR2LAT.indexOf(d)).replace(/[×✕]/g, 'x');
function numTokens(ans) { return (toLat(ans).match(/-?\d+(?:[.\/]\d+)?/g) || []); }
function maskTokens(ans) {
  const toks = numTokens(ans), strong = toks.filter(x => /[.\/]/.test(x) || x.replace(/-/g, '').length >= 3);
  if (strong.length) return strong;
  return toks.length === 1 ? toks : [];
}
function hasFinalNumber(ans) { return maskTokens(ans).length > 0; }
const DIGC = { '0': '[0٠]', '1': '[1١]', '2': '[2٢]', '3': '[3٣]', '4': '[4٤]', '5': '[5٥]', '6': '[6٦]', '7': '[7٧]', '8': '[8٨]', '9': '[9٩]' };
function tokRegex(tok) {
  let r = '';
  for (const ch of tok) {
    if (DIGC[ch]) r += DIGC[ch];
    else if (ch === '.') r += '[.٫]';
    else if (ch === '/') r += '[\\/⁄]';
    else if (ch === '-') r += '[-−]';
    else r += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  return new RegExp(r, 'g');
}
function maskStep(s, ans) {
  let html = fm(String(s == null ? '' : s));
  maskTokens(ans).sort((a, b) => b.length - a.length).forEach(tok => { html = html.replace(tokRegex(tok), '<span class="masked">؟</span>'); });
  return html;
}
function suggestSec(steps) { const n = (steps || []).length; return Math.max(90, Math.min(600, n ? n * 45 : 90)); }

/* مقارنة الإجابة: توحيد عربي/لاتيني + تطابق حرفي + هامش رقمي ±٢٪ + كسور مكافئة */
function parseNum(s) {
  const t = toLat(s).replace(/[−–—]/g, '-').replace(/٫/g, '.');
  let m = t.match(/-?\d+\s*\/\s*\d+/);
  if (m) { const [p, q] = m[0].split('/').map(x => parseFloat(x)); if (q) return p / q; }
  m = t.match(/-?\d+(?:\.\d+)?/);
  if (!m) return null;
  let val = parseFloat(m[0]);
  const sm = t.match(/x\s*10\s*\^?\s*(-?\d+)/);
  if (sm) val = val * Math.pow(10, parseInt(sm[1], 10));
  return val;
}
function answerValues(exp) {
  const t = toLat(exp).replace(/[−–—]/g, '-').replace(/٫/g, '.');
  const tail = t.includes('=') ? t.slice(t.lastIndexOf('=') + 1) : t;
  const grab = str => {
    const vals = [];
    (str.match(/-?\d+\s*\/\s*\d+/g) || []).forEach(f => { const [p, q] = f.split('/').map(x => parseFloat(x)); if (q) vals.push(p / q); });
    (str.match(/-?\d+(?:\.\d+)?/g) || []).forEach(x => vals.push(parseFloat(x)));
    return vals;
  };
  let vals = grab(tail);
  if (!vals.length) vals = grab(t);
  return vals;
}
function answerMatches(ans, unit, expected) {
  const exp = String(expected == null ? '' : expected);
  const cands = [String(ans || ''), unit && unit !== 'بدون' ? String(ans) + ' ' + unit : ''].filter(Boolean);
  if (cands.some(c => normA(c) === normA(exp))) return true;
  const want = answerValues(exp);
  if (want.length) {
    for (const c of cands) {
      const a = parseNum(c);
      if (a == null) continue;
      for (const b of want) {
        const tol = Math.max(Math.abs(b) * 0.02, 0.005);
        if (Math.abs(a - b) <= tol) return true;
      }
    }
  }
  return false;
}

/* يُسجّل الموضوع في جدول المراجعة عند الخطأ */
function addToReview(f) { const p = progOf(f.t.id); p.rev = { at: Date.now(), level: 0, done: (p.rev && p.rev.done) || 0 }; }

/* أثر الوقت على الهدف: يحدّث سرعة الطالب وموعد إتمام المنهج المتوقع */
function paceFactor(st) { const p = st.pace; return p && p.sumSec ? p.sumUsed / p.sumSec : 1; }
function projectTarget(st) {
  const ti = timeInfo(st), total = studyLine().length;
  if (!total || !ti.daysLeft) return null;
  const base = Math.max(1, Math.ceil(total / Math.max(1, Math.ceil(ti.daysLeft / 7))));
  const pf = Math.max(0.35, Math.min(2.5, paceFactor(st)));
  const perWeek = Math.max(1, Math.round(base / pf));
  return isoD(new Date(today0().getTime() + Math.ceil(total / perWeek) * 7 * 864e5));
}
function registerPace(f, used) {
  const st = me(), before = st.targetDate || null;
  st.pace = st.pace || { n: 0, sumSec: 0, sumUsed: 0, credit: 0 };
  st.pace.n++; st.pace.sumSec += f.sec; st.pace.sumUsed += used; st.pace.credit += (f.sec - used);
  const after = projectTarget(st);
  st.targetDate = after;
  let moved = 0;
  if (before && after) moved = Math.round((parseD(before) - parseD(after)) / 864e5);
  return { saved: f.sec - used, target: after, moved };
}
function fxHTML(v) {
  const fx = v && v.fx; if (!fx) return '';
  const s = fx.saved, late = s < 0;
  const line = late ? 'أخذت وقتًا أطول من المقترح بـ ' + mmss(-s) + '.'
    : s > 0 ? 'أسرعت عن الوقت المقترح بـ ' + mmss(s) + '.'
    : 'أتممت في الوقت المقترح تمامًا.';
  const extra = fx.target ? ' موعد إتمام المنهج المتوقع: ' + fmtD(parseD(fx.target)) + (fx.moved ? ' (' + (fx.moved > 0 ? 'تقدّم ' : 'تأخّر ') + ar(Math.abs(fx.moved)) + ' يومًا)' : '') + '.' : '';
  return '<div class="timefx' + (late ? ' late' : '') + '"><b>أثر الوقت:</b> ' + line + extra + '</div>';
}

/* الحل التفصيلي المتسلسل: خطوات مرقّمة واضحة، ثم النتيجة النهائية في صندوق مميّز */
function solutionHTML(f, v) {

        '<div class="pick" style="grid-template-columns:repeat(3,1fr)"><div class="tile"><b class="num">' + ar(ti.weeksLeft) + '</b><span>أسبوعًا حتى الامتحان</span></div><div class="tile"><b class="num">' + ar(ti.studyWeeks) + '</b><span>أسبوع دراسة بعد العطل</span></div><div class="tile"><b class="num">' + ar(ti.weeksGone) + '</b><span>' + (ti.weeksGone === 1 ? 'أسبوع مضى' : 'أسابيع مضت') + '</span></div></div>' +

function onbNext() {

document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (stop && el.dataset.act === 'closeDialog' && el.classList.contains('dialog-back')) return;
  const a = el.dataset.act, st = me();
  switch (a) {
    case 'tab': tabTo(el.dataset.v); break;
    case 'go': if (el.dataset.v === 'settings') S.setTab = el.dataset.t || 'acc'; go(el.dataset.v); break;
    case 'back': if (!back()) tabTo('today'); break;
    case 'grade': go('grade', { viewGrade: +el.dataset.g }); break;
    case 'subject': go('subject', { viewGrade: +el.dataset.g, viewSubject: el.dataset.s }); break;
    case 'intro': S.introPart = 0; S.introOpen = -1; S.introCyc = 0; go('intro', { viewGrade: +el.dataset.g }); break;
    case 'ipart': S.introPart = +el.dataset.i; render(true); break;
    case 'flip': S.introOpen = S.introOpen === +el.dataset.i ? -1 : +el.dataset.i; render(); break;
    case 'cyc': S.introCyc = +el.dataset.i; render(); break;
    case 'scope': S.search.scope = el.dataset.v; render(); break;
    case 'res': {
      const [k, x, y] = el.dataset.v.split(':');
      if (k === 'topic') { S.tseg = y; go('topic', { viewTopic: x }); } else if (k === 'tab') tabTo(x); else if (k === 'grade') go('grade', { viewGrade: +x }); else if (k === 'subject') go('subject', { viewGrade: +x, viewSubject: y });
      break;
    }
    case 'onbNext': onbNext(); break;
    case 'onbSkip': S.onb.step = STORY.length; render(); break;
    case 'onbBack': S.onb.step = Math.max(S.onb.mode === 'add' ? STORY.length : 0, S.onb.step - 1 - ((S.onb.step - STORY.length === 4 && !GRADES[S.onb.grade - 1].ministerial) ? 1 : 0)); render(); break;
    case 'onbCancel': S.onb = null; render(); break;
    case 'onbDone': onbDone(); break;
    case 'oGrade': S.onb.grade = +el.dataset.g; render(); break;
    case 'oBranch': S.onb.branch = el.dataset.v; render(); break;
    case 'theme': DB.prefs.theme = el.dataset.v; save(); render(); break;
    case 'switch': DB.activeId = el.dataset.id; save(); S.stack = []; S.view = 'today'; render(true); toast('بدّلت إلى ' + me().name); break;
    case 'addStudent': startOnb('add'); render(); break;
    case 'delStudent': {
      const s = DB.students.find(x => x.id === el.dataset.id);
      S.dialog = { title: 'حذف ' + s.name + '؟', text: 'سيُحذف تقدمه كله من هذا الجهاز. صدّر نسخة احتياطية أولًا إن أردت الاحتفاظ به.', ok: 'احذف', danger: true, run: () => { DB.students = DB.students.filter(x => x.id !== s.id); save(); toast('حُذف ' + s.name); } };
      render(); break;
    }
    case 'closeDialog': S.dialog = null; render(); break;
    case 'dlgOk': { const r = S.dialog.run; S.dialog = null; r(); render(); break; }
    case 'branch': st.branch = el.dataset.v; save(); render(); break;
    case 'rest': { const i = +el.dataset.i; st.rest = st.rest.includes(i) ? st.rest.filter(x => x !== i) : st.rest.concat(i); if (st.rest.length > 3) { st.rest = st.rest.filter(x => x !== i); toast('ثلاثة أيام راحة في الأسبوع هي الحد الأعلى.'); } save(); render(); break; }
    case 'delHoliday': st.holidays.splice(+el.dataset.i, 1); save(); render(); break;
    case 'addHoliday': {
      const f = document.getElementById('hFrom').value, t = document.getElementById('hTo').value, n = document.getElementById('hName').value.trim();

      const ok2 = startExam('ministerial', subj, plan.n, Math.round(plan.sec / plan.n));
      if (!ok2) { S.exam = null; break; }
      S.exam.phase = 'run';
      render(true);
      break;
    }
    case 'examGo': { const z = S.exam; if (!z) break; const ok = startExam(z.kind, z.subject, +el.dataset.n, z.perQ); if (ok && S.exam && S.exam.prep > 0) { S.exam.phase = 'prep'; S.exam.prepEnd = Date.now() + S.exam.prep * 60000; } render(true); break; }
    case 'examPrep': if (S.exam && S.exam.phase === 'config') { S.exam.prep = +el.dataset.m; render(); } break;
    case 'examBeginNow': beginExam(); break;
    case 'examPick': {
      const z = S.exam; if (!z || z.phase !== 'run') break;
      z.picks[z.i] = +el.dataset.o; z.times[z.i] = Math.round((Date.now() - z.qAt) / 1000);
      if (z.kind === 'ministerial') { z.i++; z.qAt = Date.now(); clearExamClock(); if (z.i >= z.items.length) examFinish(); render(true); }
      else render();
      break;
    }
    case 'examReveal': {
      const z = S.exam; if (!z || z.phase !== 'run') break;
      S.examRevealed = S.examRevealed || {};
      S.examRevealed[z.items[z.i].key] = 1;
      z.picks[z.i] = -2; /* -2 = عُرض الحل (ليس اختيارًا) */
      z.times[z.i] = Math.round((Date.now() - z.qAt) / 1000);
      render();
      break;
    }
    case 'examNext': { const z = S.exam; if (!z) break; z.i++; z.qAt = Date.now(); if (z.i >= z.items.length) examFinish(); render(true); break; }
    case 'examPledge': {
      const z = S.exam; if (!z) break;
      S.dialog = { title: 'عهد', text: 'أتعهّد أنني أكملت امتحان ' + z.subject + ' بجهدي دون مساعدة، وأنني لن أعود إلى أسئلته.', ok: 'أتعهّد وأكمل', run: () => { z.pledged = true; if (!z._fin) examFinish(); z.phase = 'done'; clearExamClock(); save(); } };
      render(); break;
    }
    case 'openBank': S.bankSubject = el.dataset.s; go('bank'); break;
    case 'bankView': S.bankView = el.dataset.v; render(); break;
    case 'bankTrain': {
      /* يحصر التهيئة الوزارية في مجموعة واحدة من البنك (فصل أو دورة) */
      const subj = el.dataset.s, gk = el.dataset.g, vw = el.dataset.v;
      const keys = [];
      ministerialPool(subj).forEach(x => {
        const m = bankMeta(x);
        const hit = vw === 'year'
          ? ((m.fromExam ? 'دورة ' + ar(m.year) : 'أسئلة من إعداد المنهج (بلا دورة)') === gk)
          : ((m.chTitle || 'غير مرتبط بفصل') === gk);
        if (hit) keys.push(x.key);
      });
      if (!keys.length) { toast('لا توجد أسئلة في هذه المجموعة.'); break; }
      S.examScope = { subject: subj, keys, label: gk };
      examConfig('ministerial', subj);
      break;
    }
    case 'subExams': go('subexams'); break;
    case 'minPrep': go('minprep'); break;
    case 'minPrepSubj': S.minPrepSubj = el.dataset.s || null; go('minprep'); break;
    /* ٨) الرسم التفاعلي: تقريب، تحريك، شرح بالضغط، وبناء خطوة بخطوة */
    case 'figZoom': {
      const k = el.dataset.k, d = +el.dataset.d, st = figSt(k);
      if (d === 0) { st.z = 1; st.x = 0; st.y = 0; }
      else { st.z = Math.max(1, Math.min(6, +(st.z * (d > 0 ? 1.4 : 0.71)).toFixed(3))); if (st.z === 1) { st.x = 0; st.y = 0; } }
      if (!figApply(k)) render();
      break;
    }
    case 'figPart': { const k = el.dataset.k, i = +el.dataset.i; const st = figSt(k); st.part = (st.part === i ? -1 : i); render(); break; }
    case 'figStep': { const k = el.dataset.k, d = +el.dataset.d, st = figSt(k), n = ((FIGS[k] || {}).steps || []).length;
      if (d === 0) st.step = 0; else st.step = Math.max(0, Math.min(n - 1, st.step + d));
      S.figDraw = k; render(); break; }
    case 'figFull': { S.figK = el.dataset.k; S.figCap = ''; S.figDraw = null; go('fig'); break; }
    case 'figDraw': { const k = el.dataset.k; S.figDraw = (S.figDraw === k ? null : k); if (S.figDraw === k) figSt(k).step = Math.max(0, figSt(k).step); render(); break; }
    case 'weakOf': S.logFor = 'tests'; S.logSubject = el.dataset.s; go('log'); break;
    /* ٧-ز) سجل «تطوّرك الوزاري» في تبويب الاختبارات */
    case 'minRec': go('minrec'); break;
    case 'minRecSubj': S.minRecSubj = el.dataset.s || null; S.minRecTab = 'all'; render(); break;
    case 'minRecTab': S.minRecSubj = el.dataset.s; S.minRecTab = el.dataset.t; render(); break;
    case 'expRevLog': exportLogDoc('review'); break;
    case 'expActivity': exportLogDoc('activity'); break;
    case 'expTests': exportLogDoc('tests'); break;
    case 'revQuiz': { const t = findTopic(el.dataset.id).t; if (!t || !t.quiz || !t.quiz.length) { toast('لا أسئلة في هذا الموضوع بعد.'); break; } startQuiz('t:' + el.dataset.id, Math.min(10, t.quiz.length)); break; }
    case 'revDone': revDone(el.dataset.id, true); render(); toast('رُصدت مراجعتك. سيعود الموضوع في وقته.'); break;
    case 'revOpen': go('topic', { viewTopic: el.dataset.id }); break;
    case 'hideTopic': { st.hidden = (st.hidden || []).concat(el.dataset.id); save(); back(); render(true); toast('أُخفي الموضوع. ترجعه من صفحة المادة متى شئت.'); break; }
    case 'unhideTopic': st.hidden = (st.hidden || []).filter(x => x !== el.dataset.id); save(); render(); toast('رجع الموضوع إلى مسارك.'); break;
    case 'prob': if (el.dataset.replace) { S.viewProblem = el.dataset.id; render(true); } else go('problem', { viewProblem: el.dataset.id }); break;
    case 'notebook': go('notebook', { viewSubject: el.dataset.s }); break;
    case 'startSolve': startSolve(el.dataset.id); render(); break;
    case 'selfCheck': { const v = solveOf(el.dataset.id); v.self = el.dataset.v; save(); render(); if (v.self === 'ok') toast('أحسنت.'); break; }
    case 'retrySolve': startSolve(el.dataset.id); render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.onb && e.target.id === 'oName') { e.preventDefault(); onbNext(); }
  if (e.key === 'Escape' && S.dialog) { S.dialog = null; render(); }
});
document.addEventListener('input', e => {
  const id = e.target.id, st = me(), v = e.target.value;
  if (id === 'q') { S.search.q = v; const r = document.getElementById('results'); if (r) r.innerHTML = searchResults(); }
  if (id === 'oName' && S.onb) S.onb.name = v;
  if (id === 'oMin' && S.onb) { S.onb.minutes = +v; document.getElementById('oMinVal').textContent = ar(v); }
  if (id === 'oGoal' && S.onb) { S.onb.goal = +v; document.getElementById('oGoalVal').textContent = ar(v); document.getElementById('oGoalLine').textContent = goalLine(+v); }
  if (id === 'fs') { DB.prefs.fs = +v; save(); applyPrefs(); }
  if (id === 'sGoal') { st.goal = +v; save(); e.target.previousElementSibling.querySelector('span').textContent = ar(v); }
  if (id === 'sProb') { st.probMinutes = +v; save(); e.target.previousElementSibling.querySelector('span').textContent = ar(v); }
  if (id === 'revTxt') { DB.reviewDraft = v; save(); }
  if (e.target.classList.contains('blank')) { const k = e.target.dataset.k, j = +e.target.dataset.j; S.blank[k] = S.blank[k] || {}; (S.blank[k].vals = S.blank[k].vals || [])[j] = v; }
  if (id === 'nbWork') { const sv = solveOf(e.target.dataset.id); if (sv) { sv.work = v; save(); } }
  if (e.target.dataset.noteT) { notesOf(e.target.dataset.noteT)[e.target.dataset.noteS] = v; save(); }
  if (id === 'nbPage') { const sv = solveOf(e.target.dataset.id); if (sv) { sv.page = v.replace(/[^0-9٠-٩]/g, ''); save(); } }
  if (id === 'sMin') { st.minutes = +v; save(); e.target.previousElementSibling.querySelector('span').textContent = ar(v); }
  if (id === 'sCollege') { st.college = v; save(); }
  if (id === 'aiKey') { aiPref().key = v.trim(); save(); }
  if (id === 'aiModel') { aiPref().model = v.trim(); save(); }
  if (id === 'aiBase') { aiPref().base = v.trim(); save(); }
});
document.addEventListener('change', e => {
  const aiin = e.target.dataset && e.target.dataset.aiIn;
  if (aiin && e.target.files && e.target.files[0]) { aiCorrect(aiin, e.target.files[0]); return; }
  if (e.target.hasAttribute && e.target.hasAttribute('data-ai-toggle')) { aiPref().on = e.target.checked; save(); render(); return; }
  if (e.target.hasAttribute && e.target.hasAttribute('data-ai-consent')) { aiPref().consent = e.target.checked; save(); return; }
  const pin = e.target.dataset && e.target.dataset.photoIn;
  if (pin && e.target.files && e.target.files[0]) { shrinkPhoto(e.target.files[0]).then(d => MEDIA.put(photoKey(pin), d)).then(() => { solveOf(pin).photo = 1; save(); render(); toast('أُرفقت صورة حلّك.'); }).catch(() => toast('تعذّر حفظ الصورة.')); return; }
  const avin = e.target.dataset && e.target.dataset.avatarIn;
  if (avin && e.target.files && e.target.files[0]) { shrinkPhoto(e.target.files[0]).then(d => MEDIA.put(avKey(avin), d)).then(() => { const s = DB.students.find(x => x.id === avin); if (s) s.photo = 1; save(); render(); toast('حُفظت صورتك الشخصية.'); }).catch(() => toast('تعذّر حفظ الصورة.')); return; }
  if (S.view === 'export' && S.exp && ['expSubj', 'expCh', 'expTopic', 'expSeg'].includes(e.target.id)) {
    const x = S.exp, val = e.target.value;
    if (e.target.id === 'expSubj') { const d = defaultExp(x.lvl, val); x.subject = val; x.ch = d.ch; x.tid = d.tid; }
    if (e.target.id === 'expCh') { x.ch = val; const ch = findChapter(val).ch; x.tid = (ch.topics.find(t => !isHidden(t.id)) || ch.topics[0]).id; }
    if (e.target.id === 'expTopic') x.tid = val;
    if (e.target.id === 'expSeg') x.seg = val;
    render(); return;
  }
  const id = e.target.id, st = me(), v = e.target.value;
  if (id === 'oStart' && S.onb && v) { S.onb.start = v; render(); }
  if (id === 'fs') render();
  if (id === 'sGrade') {
    st.grade = +v; const g = GRADES[st.grade - 1];
    st.branch = g.branch ? (st.branch || 'sci') : null;
    if (!g.ministerial) st.goal = null; else if (!st.goal) st.goal = 90;
    st.examDate = null; save(); render(); toast('تغيّر صفك إلى ' + g.name + '.');
  }
  if (id === 'sStart' && v) { st.start = v; save(); toast('أُعيد حساب أسابيعك.'); }
  if (id === 'sExam' && v) { st.examDate = v; save(); toast('حُفظ موعد امتحانك.'); }
  if (id === 'impFile' && e.target.files[0]) {
    const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(e.target.files[0]);
  }
});

/* =================== النسخ الاحتياطي =================== */
function doExport() {
  const data = JSON.stringify({ app: 'study-app', schema: SCHEMA, exported: new Date().toISOString(), db: DB });
  const box = document.getElementById('expBox'), ta = document.getElementById('expText');
  ta.value = data; box.hidden = false;
  saveFile('نسخة-احتياطية-' + isoD(new Date()) + '.json', data, 'application/json');
}
function doImport(text) {
  let o;
  try { o = JSON.parse(text); } catch (err) { toast('هذا النص ليس نسخة احتياطية صالحة. تأكد أنك نسخته كاملًا.'); return; }
  if (!o || o.app !== 'study-app' || !o.db || !Array.isArray(o.db.students)) { toast('الملف لا يخص هذا التطبيق.'); return; }
  S.dialog = { title: 'استرجاع النسخة الاحتياطية؟', text: 'فيها ' + ar(o.db.students.length) + ' طالب. ستحل محل كل ما على هذا الجهاز الآن.', ok: 'استرجع', danger: false,
    run: () => { DB = Object.assign(freshDB(), o.db, { schema: SCHEMA }); save(); S.stack = []; S.view = 'today'; toast('استُرجعت النسخة الاحتياطية.'); } };
  render();
}

/* =================== التشغيل =================== */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
try { history.replaceState({ d: 0 }, ''); } catch (e) {}
render();
</script>
