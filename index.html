<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>دَرْب</title>
<meta name="description" content="دَرْب: تطبيق دراسي مجاني من الأول الابتدائي إلى السادس الإعدادي، أساسه الفهم لا الحفظ: مسائل الكتاب مع حلولها النموذجية، اختبارات، مراجعة، حفظ، وتصحيح الحل بالصورة.">
<meta name="theme-color" content="#4B46E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دَرْب">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
/* التخطيط: عمود واحد بعرض مريح للآيباد، شريط تبويبات سفلي ثابت، ورأس صغير فيه البحث والإعدادات */
:root{
  --bg:#F5F6FB; --card:#FFFFFF; --ink:#1C2140; --muted:#4A5077; --line:#DCE0F0;
  --soft:#EAECF7; --acc:#4B46E0; --acc-ink:#FFFFFF; --acc-soft:#E9E8FE;
  --coral:#FF6B57; --amber:#F59E0B;
  --gold:#8A5E14; --gold-soft:#FFF7E8; --gold-line:#E0BE7A;
  --ok:#2B7353; --ok-soft:#E8F3EC; --bad:#C33D2A; --bad-soft:#FDEFEB;
  --night:#0A0F22; --night-ink:#EEF0F7; --night-muted:#A8B0D0; --night-card:#171C3E; --night-line:#2A3160; --star:#F2C46D;
  --display:'Alexandria', 'IBM Plex Sans Arabic', 'Segoe UI', sans-serif;
  --deco:'Aref Ruqaa', 'Amiri', 'Times New Roman', serif;
  --body:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --fs:17px;
  color-scheme:light;
}
:root[data-skin="ocean"]{
  --bg:#EAF3F6;--card:#FFFFFF;--ink:#17333C;--muted:#49646D;--line:#C9DCE1;--soft:#DCECEF;
  --acc:#087E8B;--acc-ink:#FFFFFF;--acc-soft:#D6EEF0;--ok:#187A56;--ok-soft:#DDF3E8;
  --shadow:0 5px 18px rgba(16,72,82,.10);--shadow-lg:0 12px 32px rgba(16,72,82,.16);--r:16px
}
:root[data-skin="sage"]{
  --bg:#EEF2E9;--card:#FBFCF8;--ink:#28382B;--muted:#586A59;--line:#D3DDCE;--soft:#E5EBDD;
  --acc:#52764A;--acc-ink:#FFFFFF;--acc-soft:#DDE9D7;--ok:#27684B;--ok-soft:#E0F0E5;
  --shadow:0 2px 8px rgba(48,72,47,.08);--shadow-lg:0 9px 24px rgba(48,72,47,.13);--r:20px
}
:root[data-skin="rose"]{
  --bg:#FBF0F0;--card:#FFFCFC;--ink:#412D34;--muted:#735A62;--line:#E9D4D9;--soft:#F5E4E8;
  --acc:#A54867;--acc-ink:#FFFFFF;--acc-soft:#F4DFE6;--ok:#287454;--ok-soft:#E2F2E9;
  --shadow:0 4px 14px rgba(102,47,68,.09);--shadow-lg:0 12px 28px rgba(102,47,68,.15);--r:24px
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1230; --card:#171C3E; --ink:#EEF0F7; --muted:#A8B0D0; --line:#2A3160; --soft:#1A2147;
    --acc:#7C7DE8; --acc-ink:#0E1230; --acc-soft:#262B5C; --coral:#FF8A75; --amber:#F2C46D;
    --gold:#F2C46D; --gold-soft:#2B2414; --gold-line:#6B5322;
    --ok:#5FC594; --ok-soft:#173326; --bad:#F08A76; --bad-soft:#3A1E19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1230; --card:#171C3E; --ink:#EEF0F7; --muted:#A8B0D0; --line:#2A3160; --soft:#1A2147;
  --acc:#7C7DE8; --acc-ink:#0E1230; --acc-soft:#262B5C; --coral:#FF8A75; --amber:#F2C46D;
  --gold:#F2C46D; --gold-soft:#2B2414; --gold-line:#6B5322;
  --ok:#5FC594; --ok-soft:#173326; --bad:#F08A76; --bad-soft:#3A1E19; color-scheme:dark;
}
:root[data-skin="contrast"]{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#101010; --muted:#303030; --line:#555555; --soft:#EEEEEE;
  --acc:#003B8E; --acc-ink:#FFFFFF; --acc-soft:#E3EDFF; --gold:#694500; --gold-soft:#FFF4D6; --gold-line:#765400;
  --ok:#075B30; --ok-soft:#E4F3E9; --bad:#A00000; --bad-soft:#FCE8E8; color-scheme:light;
}
:root[data-skin="paper"]{
  --bg:#F4EEE1; --card:#FFFCF5; --ink:#2A2118; --muted:#584B38; --line:#DCD1BB; --soft:#EDE4D2;
  --acc:#7A4F12; --acc-ink:#FFFFFF; --acc-soft:#F1E4C8; --coral:#B4472F; --amber:#8A5E14; color-scheme:light;
}
:root[data-skin="night"]{
  --bg:#0A0F22; --card:#131B38; --ink:#EEF1FA; --muted:#BAC2DE; --line:#283152; --soft:#1A2246;
  --acc:#F2C46D; --acc-ink:#0A0F22; --acc-soft:#2A2B45; --coral:#FF8A75; --amber:#F2C46D;
  --gold:#F2C46D; --gold-soft:#25223A; --gold-line:#5E5232;
  --ok:#5FD39B; --ok-soft:#14302A; --bad:#FF8E7E; --bad-soft:#3A1E25; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%;height:auto}
body{margin:0;direction:rtl;text-align:right;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.8;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* هيكل الشاشة */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px max(16px,4vw) 10px}
.top h1{font-family:var(--display);font-size:1.75em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:46px;height:46px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:22px;height:22px}
.page{flex:1;width:100%;max-width:900px;margin:0 auto;padding-inline:max(16px,4vw);padding-block:4px 120px;display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;min-width:0;max-width:120px;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted);cursor:pointer;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--acc);font-weight:700}

/* عناصر مشتركة */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.15em}
.muted{color:var(--muted)}
.small{font-size:.88em}
.btn{min-height:50px;padding:0 22px;border-radius:14px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.quiet{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
/* ── زر + تلميح (الفكرة المطلوبة تطبيقها على النظام كامل) ──
   زرّان، وتحت سطري الزرين سطر تلميح يتبدّل حسب الزر الذي تمرّ عليه أو تركّزه،
   فيشرح فائدته. على الجوّال يعمل التركيز بدل المرور. */
.hp{display:flex;flex-direction:column;gap:8px}
.hp-row{display:flex;gap:10px;flex-wrap:wrap}
.hp-row .btn{flex:1;min-width:140px}
.btn svg{width:22px;height:22px;flex-shrink:0}
.hp-row .btn b{line-height:1.45;word-break:keep-all}
.hp-hint{margin:0;padding:9px 12px;border-radius:12px;border:1px dashed var(--line);background:var(--soft);color:var(--muted);font-size:.87em;line-height:1.75;min-height:2.4em;animation:hpIn .18s ease}
@keyframes hpIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.hp-hint b{color:var(--acc);font-weight:700}
/* صندوق «لماذا يوجد هذا القسم؟» — يُستعمل في كل مكان يشرح فيه النظام فائدة زرّ */
.hint-purpose{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;border:1px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold);line-height:1.7}
.hint-purpose b{color:var(--gold)}
.hint-purpose .small{color:var(--muted)}
.hint-purpose svg{flex-shrink:0;margin-top:3px;width:22px;height:22px}
/* ── رفوف اليوم في خطة الأسبوع ──
   كل يوم دراسة رفٌّ بمواضيعه: رفوف فارغة يملؤها الطالب من الخطة المقسّمة أمامه.
   لا نظام يملأها عنه؛ وهو يضغط الرفّ فيأخذ أول موضوع متبقٍّ ثم يرتبه كما يشاء. */
.pday{display:flex;flex-direction:column;gap:10px}
.pday-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pday-h b{font-size:1.02em}
.pday-h .muted{font-size:.85em}
.pslots{display:flex;flex-direction:column;gap:8px}
.pslot{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 12px;border-radius:13px;border:1.5px dashed var(--line);background:var(--soft);color:var(--muted);font-size:.88em;text-align:right;cursor:pointer;width:100%;font-family:inherit}
.pslot.filled{border-style:solid;border-color:var(--acc-soft);background:var(--acc-soft);color:var(--ink)}
.pslot .n{width:24px;height:24px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:.8em;font-weight:700}
.pslot.filled .n{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pslot .t{flex:1;min-width:0}
.pslot .x{flex-shrink:0;opacity:.6;font-size:.9em}
.psrc{display:flex;flex-direction:column;gap:7px}
.psrc-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:.88em;text-align:right;cursor:pointer;width:100%;font-family:inherit;transition:opacity .15s ease,transform .15s ease}
.psrc-item:active{transform:scale(.99)}
.psrc-item.used{opacity:.34;text-decoration:line-through;cursor:default}
.psrc-item .m{flex-shrink:0;font-size:.8em;font-weight:700;color:var(--acc)}
@media (max-width:520px){.pslot .t,.psrc-item .t{overflow-wrap:anywhere}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.92em}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.92em}
.input{min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--bg)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .4s}
.note{font-size:.85em;color:var(--muted)}
.memo-kind{display:inline-block;font-size:.7em;font-weight:700;letter-spacing:.02em;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.memo-tabs{margin-bottom:10px}
.memo-tabs .chip{min-height:36px;font-size:.82em}
.lock-note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin-top:12px;border:1px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold);border-radius:14px;line-height:1.8}
.lock-note b{color:var(--gold)}
.lock-note .small{color:var(--muted)}
.lock-note svg{flex-shrink:0;margin-top:4px;width:24px;height:24px}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--acc)}
.empty b{color:var(--ink);font-size:1.05em}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 20px}
details.fold>summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:10px;height:10px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(135deg)}
details.fold>.inner{padding-bottom:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:20;font-size:.92em;max-width:calc(100% - 32px)}

/* أقسام قابلة للطي (accordion) */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;margin-top:8px}
.acc-h{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;transition:background .15s ease}
.acc-h:hover{background:var(--acc-soft)}
.acc-h .acc-ico{width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:700;transition:transform .2s ease}
.acc.open .acc-h .acc-ico{transform:rotate(180deg)}
.acc-h .acc-t{flex:1;font-weight:600;font-size:.95em}
.acc-h .acc-s{font-size:.8em;color:var(--muted)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc.open .acc-b{max-height:2000px}
.acc-b-in{padding:0 16px 14px}

/* أشرطة تقدم ملونة */
.bar.daily{height:14px;background:var(--acc-soft);border-radius:999px}
.bar.daily>span{background:linear-gradient(90deg,var(--acc),var(--star))}
.bar.weekly{height:10px;background:var(--gold-soft);border-radius:999px}
.bar.weekly>span{background:linear-gradient(90deg,var(--gold),var(--star))}
.bar.monthly{height:10px;background:var(--ok-soft);border-radius:999px}
.bar.monthly>span{background:var(--ok)}

/* شريط عمودي للأهداف */
.vbar{width:20px;height:120px;border-radius:10px;background:var(--soft);display:flex;flex-direction:column-reverse;overflow:hidden;margin:0 auto}
.vbar>span{width:100%;border-radius:10px;transition:height .4s ease}
.vbar.daily>span{background:linear-gradient(180deg,var(--star),var(--acc))}
.vbar.weekly>span{background:linear-gradient(180deg,var(--star),var(--gold))}
.vbar-label{text-align:center;font-size:.85em;font-weight:600;margin-top:4px}

/* ملخص اليوم والأهداف */
.today-mix .today-stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:12px}
.goal-bars{display:flex;gap:26px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.goal-bars .gbar{display:flex;flex-direction:column;align-items:center;gap:4px}
.goal-bars .gbar .vbar{width:26px}
.goal-bars .gbl{font-size:.82em;font-weight:600;color:var(--muted)}
/* رسم نشاط الأيام */
.dchart{display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding:14px 2px 4px;min-height:180px;direction:rtl}
.dchart .dcol{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dchart .dbar{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;border-radius:8px 8px 3px 3px;background:color-mix(in srgb,var(--muted) 12%,transparent);overflow:hidden}
.dchart .dbar i{display:block;width:100%}
.dchart .dbar i.ok{background:var(--ok)}
.dchart .dbar i.bad{background:var(--bad)}
.dchart .dlbl{font-size:.74em;font-weight:700;color:var(--muted)}
.dchart .dday{font-size:.72em;color:var(--muted)}
.dlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82em;color:var(--muted)}
.dlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:5px}
.dlegend i.ok{background:var(--ok)}.dlegend i.bad{background:var(--bad)}.dlegend i.n{background:color-mix(in srgb,var(--muted) 22%,transparent)}
.dlegend i.good{background:var(--ok)}.dlegend i.mid{background:var(--gold)}.dlegend i.weak{background:var(--bad)}
/* تقويم النشاط */
.kcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 8px}
.kcal .kday{aspect-ratio:1;max-width:52px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:600;color:var(--muted)}
.kcal .kday.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.kcal .kday.mid{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.kcal .kday.weak{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* تقويم السجل: مربع لكل يوم بلون إنجازه، يُضغط ليُفتح تفصيله */
.cal-wrap{margin-top:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-wd{font-size:.72em;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cday{position:relative;aspect-ratio:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.9em;font-weight:600;color:var(--muted);cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.cday:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
.cday .cdot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.cday.out{opacity:.32;background:transparent;border-style:dashed;cursor:default}
.cday.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cday.good .cdot{background:var(--ok)}
.cday.mid{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.cday.mid .cdot{background:var(--gold)}
.cday.weak{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cday.weak .cdot{background:var(--bad)}
.cday.sel{outline:2px solid var(--acc);outline-offset:2px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ctoday{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.chip.sm{min-height:34px;padding:0 12px;font-size:.85em}
.sub{margin:16px 0 8px;font-size:.95em;font-weight:700;color:var(--ink)}
.pbar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line);margin-top:8px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));border-radius:999px}
/* أشرطة النسب على نمط wizarati: وصف + شريط + نسبة */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.srows{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;align-items:center;gap:10px}
.slab{font-size:.82em;color:var(--muted);line-height:1.5}
.strack{height:10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.strack i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.strack i.good{background:var(--ok)} .strack i.gold{background:var(--gold)} .strack i.bad{background:var(--bad)} .strack i.acc{background:var(--acc)}
.sval{font-size:.85em;font-weight:700;color:var(--ink);white-space:nowrap}
/* تفصيل الأسئلة في سجل الاختبارات: كل سؤال رقمنًا مع إصابته وزمنه */
.qdet{display:flex;flex-wrap:wrap;gap:6px}
.qchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:.7em;line-height:1.25}
.qchip b{font-size:.95em;font-weight:700;color:var(--ink)}
.qchip i{font-style:normal;font-weight:700}
.qchip em{font-style:normal;color:var(--muted);font-size:.92em}
.qchip.ok{border-color:rgba(16,163,127,.45);background:rgba(16,163,127,.10)}
.qchip.ok i{color:var(--ok)}
.qchip.bad{border-color:rgba(214,69,69,.45);background:rgba(214,69,69,.10)}
.qchip.bad i{color:var(--bad)}
.qchip.mid{border-color:var(--gold-line);background:var(--gold-soft)}
.qchip.mid i{color:var(--gold)}
/* منحنى الجلسات الوزارية: كل جلسة عمودًا بلون حسب درجتها */
.mincurve{display:flex;align-items:flex-end;gap:4px;height:96px;padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow-x:auto}
.mink{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-width:24px;flex:1;height:100%}
.mink i{display:block;width:100%;max-width:20px;border-radius:4px 4px 0 0;background:var(--acc);min-height:6px}
.mink.good i{background:var(--ok)} .mink.gold i{background:var(--gold)} .mink.bad i{background:var(--bad)}
.mink em{font-style:normal;font-size:.62em;color:var(--muted)}

/* نظام إدخال الإجابة الرقمي */
.answer-pad{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.answer-display{font-size:1.5em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink)}
.answer-display .placeholder{color:var(--muted);font-weight:400;font-size:.85em}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.numpad button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.1em;font-weight:600;cursor:pointer;color:var(--ink);transition:all .15s ease}
.numpad button:hover{background:var(--acc-soft);border-color:var(--acc)}
.numpad button:active{transform:scale(.95)}
.numpad .num{color:var(--ink)}
.numpad .op{color:var(--acc);font-size:1.2em}
.numpad .del{color:var(--bad)}
.numpad .clear{color:var(--muted)}
.unit-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.unit-chip{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.85em;cursor:pointer;color:var(--ink)}
.unit-chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.answer-actions{display:flex;gap:8px;margin-top:8px}
.answer-actions .btn{flex:1}
.badans{border-color:var(--bad);background:rgba(255,80,80,.06)}

/* نظام المطابقة الجديد: مرحلة الترشيد ثم مرحلة المطابقة */
.phase{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);margin-top:4px}
.phase .n{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-size:.85em}
.guide{border:1px solid var(--line);border-inline-start:5px solid var(--acc);border-radius:14px;padding:14px 18px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.guide .glbl{font-weight:700;color:var(--acc)}
.guide ol{margin:0;padding-inline-start:22px;line-height:2}
.masked{display:inline-block;min-width:2.1em;text-align:center;background:var(--acc-soft);color:var(--acc);border-radius:6px;font-weight:700;padding:0 4px}
.timefx{background:var(--ok-soft);border-radius:12px;padding:12px 16px;line-height:2;font-size:.95em;color:var(--ink)}
.timefx.late{background:var(--gold-soft)}
.timefx b{color:var(--ink)}
.answer-pad .dontknow{width:100%;border-style:dashed}

/* إصلاح تداخل الألوان */
.card h2,.card h3{color:var(--ink)}
.card p{color:var(--ink)}
.card .muted{color:var(--muted)}
.pitem b{color:var(--ink)}
.pitem .small{color:var(--muted)}
.stat span{color:var(--muted)}
.stat b{color:var(--acc)}
.strip{color:var(--ink)}
.strip span{color:var(--muted)}
.strip b{color:var(--acc)}

/* اليوم */
.glimpse{background:var(--acc);color:var(--acc-ink);border-radius:20px;padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.glimpse .q{font-family:var(--display);font-size:1.5em;line-height:1.75}
.glimpse .lbl{font-size:.82em;opacity:.85;font-weight:600}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.9em;line-height:1.2;color:var(--acc)}

/* لوحة الأرقام — من وحي وزارياتي: تسلسل، عدد أسئلة، معدل، إنجاز */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.metric .m-lbl{font-size:.78em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .m-val{font-family:var(--display);font-size:1.65em;font-weight:800;line-height:1.2;color:var(--ink)}
.metric .m-val.ok{color:var(--ok)}
.metric .m-val.coral{color:var(--coral)}
.metric .m-val.amber{color:var(--amber)}
.metric .m-sub{font-size:.75em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* على الشاشات الضيّقة يُسمح بالالتفاف بدل القصّ بعلامة (…) — فلا يضيع معنى التهنئة */
@media(max-width:520px){.metric .m-sub,.metric .m-lbl{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;min-height:2.7em}.metric .m-lbl{min-height:auto}}

/* بطاقة الطالب */
.student-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.student-card .sc-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.student-card .sc-name{font-family:var(--display);font-size:1.3em;font-weight:800;line-height:1.4}
.student-card .sc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc-tag{font-size:.76em;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--acc-soft);color:var(--acc);border:1px solid var(--line)}
.sc-tag.coral{background:var(--bad-soft);color:var(--coral);border-color:transparent}
.sc-tag.amber{background:var(--gold-soft);color:var(--amber);border-color:var(--gold-line)}
.sc-tag.gold{background:var(--gold-soft);color:var(--gold);border-color:var(--gold-line)}

/* الإنجازات */
.ach-row{display:flex;flex-direction:column;gap:8px}
.ach{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.ach .a-st{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1em;font-weight:800}
.ach.earned .a-st{background:var(--gold-soft);color:var(--gold);border:1.5px solid var(--gold-line)}
.ach.locked{opacity:.55}
.ach.locked .a-st{background:var(--soft);color:var(--muted)}
.ach b{font-size:.95em;line-height:1.5}
.ach p{font-size:.8em;color:var(--muted)}

/* مساري */
.grade-hero{background:#15202B;color:#F3F5F2;border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;gap:12px}
.grade-hero h2{font-family:var(--display);font-size:1.9em}
.subject{min-height:110px;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.subject b{font-size:1.1em}

/* المكتبة */
.shelf{background:#2A1A0D;border-radius:20px;padding:20px 20px 14px;display:flex;flex-direction:column;gap:0;overflow-x:auto}
.shelf .lbl{color:#E9CF8F;font-size:.85em;margin-bottom:10px}
.books{display:flex;gap:12px;align-items:flex-end;min-height:190px;padding:0 8px}
.book{width:56px;flex-shrink:0;border-radius:6px;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:.9em;background:#4A3A2C;color:#C9B9A6;border:1.5px dashed #8C7458}
.plank{height:14px;border-radius:4px;background:#5C3A1E;box-shadow:0 6px 0 #3A2210}

/* أول فتح */
.onb{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 12% 8%,#183B47 0,transparent 38%),linear-gradient(155deg,#111A31 0%,#0A1022 55%,#101A31 100%);color:var(--night-ink);display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,7vw) calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain}
.onb .stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.onb .stars i{position:absolute;width:var(--s);height:var(--s);border-radius:9px;background:var(--star);animation:tw 4s var(--d) infinite}
.onb-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;width:100%;margin:0 auto 14px;padding:10px 14px;border:1px solid rgba(166,197,204,.17);border-radius:16px;background:rgba(18,34,50,.72);color:#F4F6FA}
.onb-head b{font-family:var(--display);font-size:.95em}
.onb-head b span{color:var(--star)}
.onb-count{color:#BAC8D2;font-size:.8em;white-space:nowrap}
.onb-dots{display:flex;gap:7px;justify-content:center;position:relative}
.onb-dots i{height:6px;width:10px;border-radius:9px;background:#2C434C;transition:all .3s}
.onb-dots i.on{width:28px;background:var(--star)}
.onb-dots i.dn{background:#8FA59F}
.onb-body{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center;max-width:640px;width:100%;margin:0 auto;padding-block:24px}
.onb-body.story{isolation:isolate;min-height:300px;padding:clamp(22px,5vw,42px);border:1px solid rgba(166,197,204,.19);border-radius:30px;background:linear-gradient(145deg,rgba(24,48,64,.94),rgba(14,24,43,.96));box-shadow:0 22px 60px rgba(0,0,0,.24);overflow:hidden}
.onb-body.story::before{content:"";position:absolute;z-index:-1;width:220px;height:220px;inset-inline-end:-110px;top:-120px;border-radius:50%;background:rgba(242,196,109,.09);filter:blur(2px)}
.onb-body.story .line{font-size:clamp(1.25em,4vw,1.85em);line-height:1.72}
.onb-body.story .verse{font-size:clamp(1.35em,4.4vw,2em);line-height:1.9}
.onb-body .line{font-family:var(--display);font-size:clamp(1.45em,4.4vw,2.05em);line-height:1.8;animation:rise .9s var(--d,0s) both}
.onb-body .verse{font-family:var(--display);font-size:clamp(1.7em,5vw,2.4em);line-height:1.9;color:var(--star);animation:rise 1s .2s both}
.onb-body h1{font-family:var(--display);font-size:clamp(1.7em,5vw,2.3em);animation:rise .6s both}
.onb-body .sub{color:var(--night-muted);line-height:1.9}
.onb-ic{width:84px;height:84px;margin:0 auto;color:var(--star);animation:rise .8s both}
.onb-body.story .onb-ic{width:68px;height:68px;padding:14px;border-radius:20px;background:rgba(242,196,109,.1);border:1px solid rgba(242,196,109,.24)}
.onb-body.story .logo{width:82px;height:82px;border-radius:24px;box-shadow:0 12px 32px rgba(0,0,0,.24)}
.onb-body.story .logo svg{width:44px;height:44px}
.onb input,.onb select{background:var(--night-card);border:1.5px solid #3C5A66;color:#fff;border-radius:16px;min-height:58px;padding:0 18px;text-align:center;font-size:1.25em;width:100%}
.onb .pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.onb .opt{min-height:56px;border-radius:14px;border:1px solid var(--night-line);background:var(--night-card);color:var(--night-ink);cursor:pointer;font-size:.92em}
.onb .opt[aria-pressed="true"]{background:var(--star);color:#15202B;border-color:var(--star);font-weight:700}
.onb .tile{padding:14px;border-radius:14px;background:var(--night-card);border:1px solid var(--night-line)}
.onb .tile b{display:block;font-size:1.8em;color:var(--star);line-height:1.2}
.onb .tile span{font-size:.85em;color:var(--night-muted)}
.onb .list{display:flex;flex-direction:column;gap:10px;text-align:right}
.onb .list{background:transparent;box-shadow:none;padding:0}
.onb .list div{padding:14px 18px;border-radius:14px;background:var(--night-card);border:1px solid var(--night-line);animation:rise .6s var(--d) both}
.onb-map{display:flex;flex-direction:column;gap:12px;width:100%;text-align:right}
.onb-map h1{font-size:clamp(1.35em,4.5vw,1.8em)}
.onb-map-lead{color:var(--night-muted);font-size:.88em;line-height:1.7}
.onb-map-main{padding:15px;border:1px solid rgba(242,196,109,.38);border-radius:18px;background:linear-gradient(145deg,rgba(37,54,70,.95),rgba(20,31,49,.98))}
.onb-map-main>div:first-child{display:flex;justify-content:space-between;align-items:center;gap:8px}
.onb-map-main h2{font-size:1.05em}
.onb-map-status{border-radius:999px;padding:3px 9px;background:rgba(95,197,148,.14);color:#8FE0B6;font-size:.72em;font-weight:700;white-space:nowrap}
.onb-map-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}
.onb-map-stats span{padding:8px 4px;border-radius:12px;background:rgba(8,15,31,.44);text-align:center;color:#C1CBD6;font-size:.75em}
.onb-map-stats b{display:block;color:var(--star);font-size:1.35em}
.onb-map-subjects{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.onb-map-subjects span{border:1px solid rgba(166,197,204,.2);border-radius:999px;padding:4px 9px;color:#E2E8EF;font-size:.73em}
.onb-map-empty{display:flex;flex-direction:column;gap:7px;padding:12px;border:1px solid rgba(166,197,204,.15);border-radius:16px;background:rgba(16,27,45,.72)}
.onb-map-empty h2{font-size:.9em}
.onb-map-empty p{color:var(--night-muted);font-size:.78em;line-height:1.7}
.onb-map-grades{display:flex;flex-wrap:wrap;gap:6px}
.onb-map-grades span{border-radius:999px;padding:3px 8px;background:rgba(35,49,69,.86);color:#D2DAE4;font-size:.7em}
.onb-act{position:relative;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:640px;width:100%;margin:18px auto 0}
.onb-next{min-width:min(100%,300px);min-height:58px;border-radius:16px;border:0;background:var(--star);color:#15202B;font-weight:700;font-size:1.1em;cursor:pointer}
.onb-link{min-height:44px;border:0;background:transparent;color:var(--night-muted);cursor:pointer}
.onb .err{color:#FFB4A6;font-size:.9em}
.logo{width:110px;height:110px;margin:0 auto;border-radius:30px;background:#1E5A73;display:flex;align-items:center;justify-content:center;animation:rise .8s both,glow 3s 1s infinite}
.logo svg{width:60px;height:60px;color:var(--star)}

/* البحث */
.result{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:right;cursor:pointer;width:100%}
.badge{min-width:64px;text-align:center;padding:5px 10px;border-radius:10px;font-size:.78em;font-weight:700;background:var(--acc-soft);color:var(--acc)}

/* مقدمة الصف */
.flip{min-height:118px;text-align:right;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .3s, background .3s}
.flip[aria-expanded="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);transform:scale(1.02)}
.cycle{position:relative;width:min(100%,460px);aspect-ratio:1;margin:0 auto}
.cycle .ring{position:absolute;inset:12%;border-radius:50%;border:2px dashed var(--line);animation:spin 50s linear infinite}
.cycle .core{position:absolute;inset:33%;border-radius:50%;background:#15202B;color:#F3F5F2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.cycle .core b{font-family:var(--display);font-size:1.3em}
.cycle .core span{font-size:.72em;line-height:1.5;opacity:.85}
.cycle .st{position:absolute;width:24%;min-height:52px;transform:translate(50%,-50%);border-radius:14px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);font-weight:700;cursor:pointer;font-size:.9em}
.cycle .st[aria-pressed="true"]{background:var(--gold-line);color:#15202B;border-color:var(--gold-line)}

.dialog-back{position:fixed;inset:0;background:rgba(10,15,20,.52);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);color:var(--ink);width:min(100%,560px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg);animation:popIn .2s ease both}
/* نافذة منبثقة مركزية: للخطط والسجل والمكتبة والبنك والامتحانات */
.modal-back{position:fixed;inset:0;background:rgba(10,15,20,.6);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s both}
.modal{background:var(--card);color:var(--ink);width:min(100%,760px);max-height:92vh;border-radius:24px;padding:0;display:flex;flex-direction:column;gap:0;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:popIn .22s cubic-bezier(.2,.9,.3,1.2) both;overflow:hidden;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;flex-shrink:0;background:linear-gradient(135deg,var(--acc-soft),transparent);border-bottom:1px solid var(--line);position:relative}
.modal-h::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--acc);border-radius:0 4px 4px 0}
.modal-h h2{font-size:1.25em;margin:0;font-family:var(--display);font-weight:800}
.modal-x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease}
.modal-x:hover{background:var(--bad);color:#fff;border-color:var(--bad);transform:rotate(90deg)}
.modal-b{overflow-y:auto;padding:16px 18px 20px;min-height:80px;-webkit-overflow-scrolling:touch;flex:1}
.modal-b .page{padding:0;gap:12px}
@media (max-width:480px){.modal{max-height:94vh;border-radius:20px}.modal-h{padding:14px 14px}.modal-b{padding:14px 14px 18px}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}


/* التقييم */
.stars-row{display:flex;gap:4px;justify-content:center}
.stars-row button{width:52px;height:52px;border:0;background:transparent;font-size:36px;cursor:pointer;color:var(--line);line-height:1}
.stars-row button[aria-pressed="true"]{color:#D9A53A}
.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.social a{min-height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fff;font-weight:600}
.social a svg{width:26px;height:26px}
.s-ig{background:linear-gradient(45deg,#F58529,#DD2A7B 45%,#8134AF 75%,#515BD4)}
.s-li{background:#0A66C2}
.s-em{background:#3A4650}

/* المسائل */
.prob{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.prob-text{font-size:1.15em;line-height:2;text-align:start;unicode-bidi:plaintext;overflow-wrap:anywhere;word-break:normal}
.q,.qt,.qa,.qa-b,.qcard summary,.fig-evidence-q,.opt>span:not(.ol){overflow-wrap:anywhere;unicode-bidi:plaintext;min-width:0}
.fig-evidence{display:block;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--soft);text-align:start;white-space:normal}
.fig-evidence-meta{display:block;color:var(--acc);font-weight:700;margin-bottom:3px}
.fig-evidence-q{display:block;line-height:1.8;font-weight:400}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:14px;background:var(--acc-soft)}
.timer b{font-size:2em;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums;direction:ltr}
.timer.over{background:var(--gold-soft)}
.timer.over b{color:var(--gold)}
.lock{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.answer{background:var(--ok-soft);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.answer ol{margin:0;padding-inline-start:22px;line-height:2}
/* الحل التفصيلي المتسلسل: خطوات مرقّمة واضحة يليق بالجواب الوزاري */
.sol{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:12px 0}
.sol-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--acc);margin-bottom:12px;font-size:1.05em}
.sol-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.sol-steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--soft);border-inline-start:3px solid var(--acc)}
.sol-steps li .sn{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-size:.82em;font-weight:700}
.sol-steps li .sx{flex:1;line-height:2.15;font-size:.98em;word-break:break-word}
.sol-fields{display:flex;flex-direction:column;gap:9px}
.sol-field{padding:11px 13px;border:1px solid var(--line);border-inline-start:3px solid var(--acc);border-radius:12px;background:var(--soft);line-height:2}
.sol-field>b{display:block;color:var(--acc);font-size:.9em;margin-bottom:2px}
.sol-field p{margin:0;overflow-wrap:anywhere;unicode-bidi:plaintext}
.sol-part{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sol-part>strong{display:block;color:var(--acc);margin-bottom:6px}
.sol-explanation{display:flex;flex-direction:column;gap:8px;line-height:2}
.sol-explanation> b{color:var(--acc)}
.sol-ans{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);border:1px solid var(--ok)}
.sol-ans span{font-size:.85em;color:var(--muted);font-weight:600}
.sol-ans b{color:var(--ok);font-size:1.12em;text-align:left;direction:ltr;unicode-bidi:plaintext}
.math{display:inline;direction:ltr;unicode-bidi:isolate;text-align:left;font-family:'Times New Roman',Georgia,serif;font-size:1.1em;overflow-wrap:anywhere}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:right;width:100%;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
.pitem:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(21,32,43,.08);border-color:var(--acc);background:var(--acc-soft)}
.pitem:active{transform:translateY(0);box-shadow:none}
.pitem .st{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:700;background:var(--soft);color:var(--muted);transition:transform .18s ease}
.pitem:hover .st{transform:scale(1.08)}
.pitem .st.ok{background:var(--ok-soft);color:var(--ok)}
.pitem .st.bad{background:var(--bad-soft);color:var(--bad)}
.card{transition:box-shadow .2s ease,border-color .2s ease}
.card:hover{box-shadow:0 2px 10px rgba(21,32,43,.05)}
.seg{transition:transform .15s ease,box-shadow .15s ease}
.seg:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(21,32,43,.06)}
.chip{transition:transform .15s ease,background .15s ease,color .15s ease}
.chip:hover{transform:translateY(-1px)}
.btn{transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(21,32,43,.1)}
.btn:active{transform:translateY(0)}
.demo{background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:.9em}


/* الموضوع */
/* الامتداد إلى حافّة الشاشة مقيّد بحشو الصفحة الفعلي: كان margin ثابتًا −16px بينما
   paddingInline يحسب max(16px,4vw)، فعندما يختلف الاثنان ب unos بكسلات يخرج nav عن
   النافذة ويُزيح الصفحة كلها. min() يضمن ألّا يتجاوز الامتداد ما هو متاح فعليًا */
.segs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:calc(-1 * min(max(16px,4vw),(100vw - 100%) / 2));padding-inline:min(max(16px,4vw),(100vw - 100%) / 2)}
.segs::-webkit-scrollbar{display:none}
.seg{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.92em;position:relative}
.seg[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.seg .dot{position:absolute;top:6px;inset-inline-start:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.why{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.why .lbl,.activity .lbl{font-size:.8em;font-weight:700;color:var(--gold)}
.lesson{display:flex;flex-direction:column;gap:14px;line-height:2.05;min-width:0}
.lesson :is(p,h3,li,summary,caption,th,td,.keybox,.notebox,.deftext,.understand,.a){unicode-bidi:plaintext;text-align:start;overflow-wrap:anywhere}
.lesson .tbl-wrap{width:100%;max-width:100%;min-width:0}
.lesson .tbl{direction:rtl;max-width:100%}
.lesson .tbl th,.lesson .tbl td{white-space:normal;overflow-wrap:anywhere}
.lesson h3{font-size:1.12em;margin-top:8px;color:var(--acc)}
.eqbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;overflow-x:auto}
.math.eq{display:inline-block;font-size:1.35em;white-space:nowrap}
.math sub{font-size:.68em;vertical-align:-.25em;line-height:0}
.keybox{border-inline-start:5px solid var(--acc);background:var(--acc-soft);border-radius:12px;padding:14px 16px;font-weight:600}
.notebox{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:.92em}
.lst{margin:0;padding:0;list-style:none;counter-reset:lesson-list;display:flex;flex-direction:column;gap:8px}
.lst>li{counter-increment:lesson-list;position:relative;display:block;direction:rtl;min-width:0;padding:7px 3.2em 7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.8}
.lst>li::before{content:counter(lesson-list,arabic-indic) ".";position:absolute;right:9px;top:7px;width:2.2em;direction:ltr;unicode-bidi:isolate;text-align:center;color:var(--acc);font-weight:800;font-variant-numeric:tabular-nums}
.lst>li>.math,.lst>li>.lt{display:inline-block;max-width:100%;white-space:normal;overflow-wrap:anywhere;vertical-align:top}
.lesson .lst{width:100%}
details.think{background:var(--card);border:1.5px dashed var(--gold-line);border-radius:14px;padding:12px 16px}
details.think summary{cursor:pointer;list-style:none;line-height:1.9}
details.think summary::-webkit-details-marker{display:none}
details.think summary b{color:var(--gold);margin-inline-end:6px}
details.think[open] summary{margin-bottom:8px}
details.think div{border-top:1px solid var(--line);padding-top:8px}
.fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.fig svg{width:100%;max-width:420px;height:auto}
.fig figcaption{font-size:.85em;color:var(--muted)}
/* ── الرسم التفاعلي (النقطة ٨): إطار مقصوص + طبقة قابلة للسحب والتقريب + نقاط شرح ── */
.fig.ix{align-items:stretch;gap:8px;overflow:hidden}
.fig-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fig-ttl{font-size:.95em;color:var(--acc);line-height:1.5}
.fig-tools{display:flex;gap:6px;flex-shrink:0}
.fig-tools .icon-btn{width:38px;height:38px;border-radius:10px}
.fig-tools .icon-btn svg{width:18px;height:18px}
/* touch-action:none للشاشة الكاملة فقط؛ أما رسم الموضوع فيمرّر الصفحة عاديًّا ما دام صغيرًا */
.fig-vp{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--soft);cursor:grab;min-height:170px;display:flex;align-items:center;justify-content:center}
.fig-vp[data-figvp]{touch-action:none}
.fig-vp:active{cursor:grabbing}
/* عرض الطبقة = عرض الـsvg بالضبط، وإلّا انزلقت النقاط عن مواضعها (نسبة من الطبقة) */
.fig-layer{position:relative;width:100%;max-width:520px;margin:0 auto;transform-origin:50% 50%;transition:transform .12s ease-out;will-change:transform}
.fig-layer svg{display:block;width:100%;max-width:none;height:auto}
.fig.ix .fhot{position:absolute;width:28px;height:28px;border-radius:50%;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-size:.74em;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 2px #fff;z-index:5;padding:0;line-height:1;transform:translate(-50%,-50%) scale(calc(1 / var(--fz,1)));transition:transform .12s ease-out}
.fig.ix .fhot:hover,.fig.ix .fhot.on{background:var(--acc);color:#fff;transform:translate(-50%,-50%) scale(calc(1.18 / var(--fz,1)))}
.fig-hint{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.72em;color:var(--muted);line-height:1.7}
.fig-hint b{color:var(--acc)}
.fig-tip{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:.8em;color:var(--muted);line-height:1.7}
.fig-tip svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--acc)}
.fig-expl{background:var(--acc-soft);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;animation:figPop .18s ease-out}
.fig-expl b{display:flex;align-items:center;gap:7px;color:var(--acc);font-size:.92em;margin-bottom:4px}
.fig-expl p{margin:0 0 8px;font-size:.84em;line-height:1.85}
.fnum{display:inline-flex;min-width:22px;height:22px;padding:0 5px;align-items:center;justify-content:center;border-radius:50%;background:var(--acc);color:#fff;font-size:.72em;font-style:normal}
@keyframes figPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fig-why{border-style:dashed}
.fig-open{width:100%;font-size:.85em}
/* «كيف ترسمه بنفسك؟»: بناء الرسم أمام الطالب خطوة خطوة */
.fig-draw{border:1.5px solid var(--gold-line);border-radius:14px;padding:10px;background:var(--gold-soft);display:flex;flex-direction:column;gap:8px}
.fig-stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.fig-stepper .num{font-size:.8em;color:var(--muted);font-weight:600}
.fig-stepper button[disabled]{opacity:.4;cursor:default}
.fig-stepview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.fig-stepview svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;animation:figPop .2s ease-out}
.fig-say{margin:0;background:var(--card);border-inline-start:3px solid var(--gold);border-radius:8px;padding:8px 10px;font-size:.85em;line-height:1.7}
.fig-say b{color:var(--gold)}
.fig-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.fig-list .pitem{cursor:pointer}
.fig-grp{margin-top:12px}
.fig-grp-t{display:block;color:var(--acc);font-size:.9em;margin-bottom:6px}
.fig-subject{margin-top:10px}
.fig-chapter{margin-top:10px}
.fig-chapter>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;background:var(--soft);border-radius:12px}
.fig-chapter>summary::-webkit-details-marker{display:none}
.fig-chapter>summary::before{content:'＋';color:var(--acc);font-size:1.05em}
.fig-chapter[open]>summary::before{content:'−'}
.fig-chapter>summary .count{flex:none;color:var(--muted);font-size:.8em;font-weight:600}
.fig-chapter-content{padding:4px 8px 10px}
.zap{animation:zap 1.2s infinite}
@keyframes zap{0%,60%,100%{opacity:1}30%{opacity:.15}}
.sim svg text,.fig svg text{direction:ltr;unicode-bidi:plaintext}
.tbl td .math.eq{white-space:nowrap}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);overscroll-behavior-inline:contain}
.tbl{border-collapse:collapse;width:100%;font-size:.9em;background:var(--card)}
.tbl caption{caption-side:top;text-align:start;padding:10px 12px;font-weight:600;font-size:.92em}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top;unicode-bidi:plaintext}
.tbl th{background:var(--soft);font-weight:600}
.activity{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.defcard{text-align:right;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.defcard>b{font-size:1.12em;color:var(--acc)}
.defcard[aria-expanded="true"]{border-color:var(--acc)}
.deftext{font-family:var(--display);font-size:1.18em;line-height:1.9}
.understand{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.92em}
.law{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.law-f{background:var(--acc-soft);border-radius:14px;padding:16px;text-align:center;overflow-x:auto}
.law-f .math.eq{font-size:1.5em;color:var(--acc)}
.warn{color:var(--bad)}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.qa .q{font-weight:600}
.qa .a{background:var(--ok-soft);border-radius:12px;padding:12px 14px;line-height:2}
.blank-line{line-height:2.6}
input.blank{width:9em;min-height:40px;border:0;border-bottom:2px solid var(--acc);background:var(--acc-soft);border-radius:8px 8px 0 0;padding:0 8px;text-align:center;margin:0 4px}
input.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
input.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.blank-ans{background:var(--ok-soft);color:var(--ok);padding:2px 8px;border-radius:8px}
.okmark{color:var(--ok);font-weight:700;align-self:center}
.badmark{color:var(--bad);align-self:center;font-size:.9em}
.example{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--ok);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;justify-content:space-between;align-items:baseline}
.steps{margin:0;padding-inline-start:4px;list-style:none;display:flex;flex-direction:column;gap:6px;line-height:2;max-width:100%}
.steps li,.qa .a,.ex-ans,.sol-ans b{overflow-wrap:anywhere;max-width:100%}
.steps li{animation:rise .35s both}
.ex-ans{background:var(--ok-soft);border-radius:12px;padding:10px 14px}
.src{display:inline-block;font-size:.76em;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.src.bk{background:var(--acc-soft);color:var(--acc)}
.t-head{display:flex;gap:12px;align-items:center}.t-head h2{font-family:var(--display);font-size:1.5em}.t-sec{flex-shrink:0;min-width:52px;height:52px;padding:0 8px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700;direction:ltr}
/* المسار */
.path{display:flex;flex-direction:column;gap:16px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.chap-h{display:flex;gap:12px;align-items:center}
.chap-no{width:48px;height:48px;flex-shrink:0;border-radius:14px;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.5em;font-weight:700}
.chap .fold{background:var(--bg)}
.stations{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.stations::before{content:"";position:absolute;inset-inline-start:21px;top:20px;bottom:20px;width:3px;background:var(--line);border-radius:3px}
.station{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:10px 4px;border:0;background:transparent;cursor:pointer;min-height:60px}
.station b{display:block;line-height:1.6}
.st-dot{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.78em;font-weight:700;color:var(--muted);z-index:1;direction:ltr}
.st-dot.half{border-color:var(--gold)}
.st-dot.done{background:var(--ok);border-color:var(--ok);color:#fff;font-size:1em}
/* الاختبار */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer}
.opt .ol{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1;color:inherit}
.answer.badans{background:var(--bad-soft)}
.bad-t{color:var(--bad)}
.result-hero{background:#15202B;color:#F3F5F2;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.result-hero b{font-size:3em;color:var(--star);line-height:1.1}
/* المحاكاة */
.sim{background:var(--card);border:1.5px solid var(--acc);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sim-h{display:flex;flex-direction:column;gap:2px}
.sim-h b{color:var(--acc)}
.plot{width:100%;max-width:520px;height:auto;align-self:center;background:var(--bg);border-radius:12px}
.graph-lab{display:flex;flex-direction:column;gap:12px}
.graph-eq{font-family:ui-monospace,monospace;direction:ltr;text-align:left}
.graph-range{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.graph-range label{display:flex;flex-direction:column;gap:5px;font-size:.8em;color:var(--muted)}
.graph-range .input{min-height:42px;padding:0 9px;direction:ltr;text-align:center}
.graph-plot{width:100%;max-width:460px;height:auto;align-self:center;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.graph-grid{stroke:var(--line);stroke-width:1}

.graph-legend{display:flex;flex-wrap:wrap;gap:8px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(233,207,143,0)}50%{box-shadow:0 0 40px 6px rgba(233,207,143,.35)}}

/* خريطة المسار */
.map-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 10px;overflow:hidden}
.map-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}

.pmap{position:relative;width:100%;max-width:480px;margin:0 auto}
.pmap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.road{fill:none;stroke:var(--soft);stroke-width:20;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .1s ease-out forwards}
.road-mid{fill:none;stroke:var(--card);stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round;opacity:0;animation:fadein .5s 1.3s forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popd{from{opacity:0;transform:translate(-50%,-50%) rotate(45deg) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1)}}
@keyframes lblin{from{opacity:0}to{opacity:1}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
@keyframes hit{50%{transform:translate(-50%,-50%) scale(1.18)}}
.pn{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 .95em var(--body);cursor:pointer;background:var(--card);color:var(--muted);border:2px solid var(--line);opacity:0;animation:pop .45s cubic-bezier(.3,1.5,.6,1) forwards;z-index:2;padding:0}
.pn span{direction:ltr;unicode-bidi:isolate}
.pn.s-cur{width:64px;height:64px;background:var(--acc);color:var(--acc-ink);border:5px solid var(--acc-soft);animation:pop .45s cubic-bezier(.3,1.5,.6,1) forwards,ring 1.8s 1.6s infinite}
.pn.s-done{background:var(--ok);color:#fff;border:4px solid var(--card)}
.pn.s-lock{background:var(--bg);color:var(--muted);border:2px dashed var(--line)}
.pn.small{transform:translate(-50%,-50%) rotate(45deg);width:34px;height:34px;border-radius:9px;font-size:.85em;background:var(--gold-soft);color:var(--gold);border:1.5px solid var(--gold-line);animation-name:popd}
.pn.small span{transform:rotate(-45deg)}
.pn.small.s-done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pn.small.s-cur{width:40px;height:40px;background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold);animation:popd .45s forwards,ring 1.8s 1.6s infinite}
.pn.star{width:68px;height:68px;border-radius:20px;background:var(--ink);color:var(--star);border:0;font-size:1.5em}

.pn.star.s-done{background:var(--ok);color:#fff}
.pn.hit{opacity:1;animation:hit .4s}
.pn.small.hit{opacity:1;animation:none}
.pl{position:absolute;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;line-height:1.45;opacity:0;animation:lblin .5s forwards;pointer-events:none;z-index:1}
.pl b{font-size:.92em;font-weight:600;background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:6px}
.pl span{font-size:.78em;color:var(--muted)}
.pl.s-cur b{color:var(--acc);font-weight:700}

.pl-s{position:absolute;transform:translateX(-50%);font-size:.72em;font-weight:700;color:var(--ok);opacity:0;animation:lblin .5s forwards;direction:ltr}
.pin{position:absolute;width:24px;height:24px;margin:-48px 0 0 -12px;border-radius:999px 999px 999px 0;transform:rotate(-45deg);background:var(--star);border:3px solid var(--ink);transition:left .38s ease,top .38s ease;display:none;z-index:3}
.pin.on{display:block}
.pmap .pin.on{transition:none;will-change:left,top}
.pmap.still .road,.pmap.still .road-done{animation:none;stroke-dashoffset:0}
.pmap.still .road-mid,.pmap.still .pl,.pmap.still .pl-s{animation:none;opacity:1}
.pmap.still .pn{animation:none;opacity:1}
.pmap.still .pn.s-cur{animation:ring 1.8s infinite}
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc-soft);color:var(--acc);border-radius:14px;padding:12px 16px;font-size:.88em;font-weight:600}

@media (prefers-reduced-motion:reduce){.road,.road-done{animation:none;stroke-dashoffset:0}.road-mid,.pn,.pl,.pl-s{animation:none;opacity:1}}

.nb-th{max-height:120px}
.photo-in{cursor:pointer}

.nb-note{border-right:3px solid #E3A3A3;padding:4px 10px;background:var(--bg);border-radius:8px}

.nb-prob{display:flex;gap:10px;align-items:flex-start;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;color:inherit;cursor:pointer;width:100%}
.nb-pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nb-pt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.pick{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:inherit;cursor:pointer}

.exp-frame{width:100%;height:70vh;border:1px solid var(--line);border-radius:14px;background:#fff}
.poem{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--soft,rgba(127,127,127,.08));font-size:1.05em}.poem .bt{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:5px 0;line-height:2}.poem .bt span:last-child{text-align:left}@media(max-width:520px){.poem .bt{grid-template-columns:1fr;gap:0}.poem .bt span:last-child{padding-inline-start:28px}}
.lt{unicode-bidi:isolate;font-family:inherit;font-style:normal}.lt-b{display:block;text-align:left}
.mstart,.mend{margin:10px 0;padding:6px 12px;border-radius:10px;font-size:.85em;font-weight:700;text-align:center}
.mstart{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc)}
.mend{background:color-mix(in srgb,var(--ok,#2e7d32) 14%,transparent);color:var(--ok,#2e7d32);border:1.5px dashed currentColor}
.poem .bt.out{opacity:.55}
.memo-head .segs{margin-top:8px}.mbar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--muted) 20%,transparent);overflow:hidden;margin:6px 0}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.munit{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--muted) 25%,transparent);background:var(--card);color:inherit;font:inherit;line-height:2;cursor:pointer}
.munit.static{cursor:default}.mb{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mb span:last-child{text-align:left}
@media(max-width:520px){.mb{grid-template-columns:1fr;gap:0}.mb span:last-child{padding-inline-start:24px;text-align:right}}
.mq{font-size:1.08em}.mq.big{font-size:1.15em;line-height:2.1;margin:10px 0}
.mdots{display:flex;gap:6px;align-items:center}.mdots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--muted) 25%,transparent)}.mdots i.on{background:var(--acc)}.mdots em{font-style:normal;font-size:.8em;color:var(--muted)}
.mw.hid{color:transparent;background:color-mix(in srgb,var(--acc) 18%,transparent);border-radius:6px;cursor:pointer;user-select:none}
.mw.fl{color:var(--acc);cursor:pointer;font-weight:700}.mw.shown{color:var(--acc)}
.mcard{margin:10px 0;padding:18px;border-radius:18px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--acc) 30%,transparent);text-align:center;display:flex;flex-direction:column;gap:10px}
.mcue{font-size:1.2em;line-height:2;font-weight:600}.mans{font-size:1.2em;line-height:2;color:var(--acc);font-weight:700}.mprev{opacity:.7}
.opt.right{border-color:var(--ok,#2e7d32);background:color-mix(in srgb,var(--ok,#2e7d32) 14%,transparent)}.opt.wrong{border-color:#c62828;background:color-mix(in srgb,#c62828 12%,transparent)}
.note.bad{color:#c62828}.mwin{text-align:center;border:2px solid var(--ok,#2e7d32)}.ok-t{color:var(--ok,#2e7d32)}
.flash{animation:flashk 1.4s 1}@keyframes flashk{0%,100%{filter:none}30%{filter:drop-shadow(0 0 10px var(--acc))}}
